# Deployment target and region must be supplied explicitly by the approved
# pilot environment. This file does not create an application or volume.
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile.service"

[deploy]
  strategy = "immediate"

[[mounts]]
  source = "loop_engine_service"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 16
    hard_limit = 32

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/api/v1/health"
    [http_service.checks.headers]
      Host = "localhost:8080"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "2gb"
