apiVersion: apps/v1
kind: Deployment
metadata:
  name: loop-engine-worker
  labels:
    app.kubernetes.io/name: loop-engine-worker
    app.kubernetes.io/component: service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: loop-engine-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loop-engine-worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
      containers:
        - name: worker
          image: IMAGE_REFERENCE
          args: ["serve", "api", "--tenants", "/config/tenants.json", "--bind", "0.0.0.0", "--port", "8080"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
              httpHeaders:
                - name: X-Loop-Engine-Key
                  value: READINESS_KEY_FROM_SECRET
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          volumeMounts:
            - name: tenants
              mountPath: /config
              readOnly: true
            - name: work
              mountPath: /work
      volumes:
        - name: tenants
          secret:
            secretName: loop-engine-tenants
        - name: work
          emptyDir: {}
