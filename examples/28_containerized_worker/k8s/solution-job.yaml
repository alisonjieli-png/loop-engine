apiVersion: batch/v1
kind: Job
metadata:
  name: loop-engine-example-26
  labels:
    app.kubernetes.io/name: loop-engine-example-26
    app.kubernetes.io/component: solution
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
      containers:
        - name: solution
          image: IMAGE_REFERENCE
          command: ["python", "/app/examples/26_export_a_standalone_solution/run.py", "--out", "/work/export"]
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          volumeMounts:
            - name: work
              mountPath: /work
      volumes:
        - name: work
          emptyDir: {}
