  owner: tools.knowledge_radar.questions-v1.json:questions[37].seeds[0].links.documentation
  rationale: 'The knowledge radar question registry is the one owner of each recurring question''s declared
    sources: the public repositories, publishers, search terms, seed links and official pages a reader
    opens to check a brief again. A radar engine reads a source only through the source contract that
    names its host, and only under the run''s explicit network grant; the contracts refuse the hosts that
    must never be read by script, so links such as OpenRouter''s and Artificial Analysis''s stay links
    for a person. No value here selects a model, a provider or an authority, and the registry''s strict
    reader (tools/knowledge_radar/records.py, checked by tools/test_knowledge_radar.py) reads every change
    again.'
  classification: STRATEGY_OR_PROVIDER_BINDING
  created_on: '2026-09-27'
  expires_on: '2027-09-27'
