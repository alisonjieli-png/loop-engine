  rationale: 'The source folder of this checkout, put first on PYTHONPATH when one tools test module runs
    alone in its own process to be timed, as unittest discovery loads it in continuous integration. It
    is the fixed layout of the repository, not a value read from a deployment environment, and has no
    deployment lifecycle: the tool times tests on a development machine and the service never runs it.
    Added with the run-time shard placement of September 27, 2026 (3f4bb696); tools/test_ci_test_shards.py
    covers the placement it feeds.'
