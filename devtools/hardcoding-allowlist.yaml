  classification: DEPLOYMENT_CONFIGURATION
  rationale: "Reviewed October 6, 2026: this names the R2 S3 secret environment binding at the existing credential-source registry. It contains no secret. The resolver reads the keyring value only inside the authorized operator process; source, reports and public feeds contain no credential values."
