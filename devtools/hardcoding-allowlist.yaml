  - finding_id: hardcoding.0412d4b5f094897c2f515e48
    owner: .github.workflows.fly-pilot.yml:jobs.pilot.environment
    rationale: >-
      The literal is the name of the GitHub deployment environment that holds
      the deployment secret and its protection rules. GitHub resolves
      environment-scoped variables only after a job names its environment, so
      the name cannot come from those variables, and taking it from a workflow
      input would let a caller select an unprotected environment. Every other
      deployment setting in this workflow comes from that environment's
      variables. Reviewed on 2026-09-20. Only this exact finding is allowed; a
      changed or added value has a different finding identity and stays
      blocking.
    classification: DEPLOYMENT_CONFIGURATION
    created_on: 2026-09-20
    expires_on: 2027-09-20
