      Callers cannot replace it with a credential-exfiltration endpoint.
      Separate explicit network authority is required before resolving a key
      or sending a request, and redirects are refused. Provider checks and
      mutants cover these guards. The host still supplies the account, API
      version and secret reference. Other origin literals remain blocking.
      Source is the official Stripe API documentation at
      https://docs.stripe.com/api/subscriptions/list.
    classification: STRATEGY_OR_PROVIDER_BINDING
    created_on: 2026-09-19
    expires_on: 2027-09-19
  - finding_id: hardcoding.1e8eaa28b82cba8bf4ed8d8a
    owner: tools.architecture_report.app.js
    rationale: >-
      The fixed http://www.w3.org/2000/svg value is the XML namespace passed to
      document.createElementNS, not a network endpoint or provider choice.
      The self-contained report blocks all network connections and loads no
      remote resources. Offline browser acceptance exercises every diagram
      and proves that a copied single file works with no companion assets.
      Altering the namespace is not a deployment setting. Only this exact
      source path and literal identity are allowed; a changed or added URL
      remains subject to the detector. No file, baseline or rule is excluded.
    classification: STRATEGY_OR_PROVIDER_BINDING
    created_on: 2026-09-19
    expires_on: 2027-09-19
