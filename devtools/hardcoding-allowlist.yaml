- finding_id: hardcoding.f873c95a8f2f1c3edf740627
  owner: tools.fresh_account_journey.mjs:state.mailbox.token
  rationale: This operator-only signup probe assigns the mailbox token returned by the live mailbox session
    to its private resumable journal. The right-hand side is a runtime variable, not a hardcoded credential.
    The journal is outside the repository, bound to one origin and account, owned by the current user,
    and written atomically with mode 0600 under a private nonsymlink directory. It prevents a failed email
    wait from creating another mailbox or account. The thirteen fresh-journey checks cover private paths,
    permissions, uncertain effects, confirmation origin, client-key mutation refusal and secret-free reports.
    This exception covers this exact assignment only; it does not authorize logging credentials, weakening
    the journal checks or storing a credential in a component package.
  classification: SECRET_OR_CREDENTIAL_REFERENCE
  created_on: '2026-09-26'
  expires_on: '2026-10-26'
- finding_id: hardcoding.cdec358b6a6fd775d7895bf4
  owner: loop_engine.core.service_runtime.web_assets.documentation.js:url
  rationale: The documentation view owns this first-party source-edit link. Its destination is the public
    repository named in this repository's instructions, and its suffix must match a declared docs/guides
    Markdown path from the validated documentation index. It is a navigation link for the reader, not
    an API provider binding; constructing it sends no request, credential or model call. The integration
    review checked the destination and the path validation against the current source. A different repository
    or edit route requires a new review.
  classification: STRATEGY_OR_PROVIDER_BINDING
  created_on: '2026-09-26'
  expires_on: '2027-09-26'
- finding_id: hardcoding.bb9e87ced4a289932ef9b7ba
  owner: case-studies.decision-red-team-modern-slavery.scenarios.json:source.url
  rationale: The citation address of the CC0 Kaggle write-up whose prompts the frozen scenario record
    restates (roadmap S-6.198). It is a source reference a reader follows, kept beside the citation and
    the licence in the record; no code reads it, binds to it or fetches it, and the run record copies
    it only as the study's source. The record's digest is pinned in tools/red_team_decisions.py, so a
    changed record is scanned and reviewed again.
  classification: STRATEGY_OR_PROVIDER_BINDING
  created_on: '2026-09-25'
  expires_on: '2027-09-25'
- finding_id: hardcoding.04dd1a45335f78d34b107c8a
  owner: pyproject.toml:project.urls.Repository
  rationale: The packaging metadata is the one owner of the public repository address. An installed distribution
    carries it as its Repository project URL, and the library page at /library reads it from there at
    run time to link each item's review record, so no Python module writes the address. It selects no
    provider or route and grants no authority; without it the page links nothing and says the record is
    kept with the release. The Homepage, Documentation and Issues entries beside it predate the baseline.
  classification: STRATEGY_OR_PROVIDER_BINDING
  created_on: '2026-09-25'
  expires_on: '2027-09-25'
- finding_id: hardcoding.20ea916032835992d349a0b5
  owner: tools.candidate_review.reviewers.command_line:codex_session_root
  rationale: CODEX_HOME is the Codex command line's own documented variable for its home folder. The codex_exec_session
    reviewer protocol reads it only to find the session record that command line wrote for the thread
    its events name, exactly where the command line itself resolves it, and falls back to the command
    line's own default home. It is not a Loop Engine setting, selects no model or route and grants no
    authority; the answer still counts only when that record names the installation's pinned model.
  classification: DEPLOYMENT_CONFIGURATION
  created_on: '2026-09-24'
  expires_on: '2027-09-24'
