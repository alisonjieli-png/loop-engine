  - finding_id: hardcoding.bfc9ecf2016d8a54801fdc7e
    owner: case-studies.data-cleanup-with-and-without-baltor.population.generate_population:address_rows.add
    rationale: >-
      Frozen experiment code of the data cleanup case study: its digest is bound
      by case-studies/data-cleanup-with-and-without-baltor/design-freeze.json from
      commit f90babc, before the first model call, so moving the literal would
      change the code that produced the recorded runs. The literal is one value of
      the study's own closed vocabulary (truth row kinds, scorer outcomes, review
      flags, duplicate decisions, Pi event types, run phases or material modes),
      written the same way in the frozen design and truth files. It selects no
      product runtime behavior.
    classification: CLOSED_CONTROLLED_VOCABULARY
    created_on: 2026-09-23
    expires_on: 2027-09-23
