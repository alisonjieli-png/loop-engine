    owner: loop_engine.core.custom_endpoint:CustomEndpoint.__post_init__
    rationale: >-
      The https:// scheme is the TLS trust contract itself: an endpoint that
      declares a private anchor, an expected server name or a pinned certificate
      must use HTTPS, so plain HTTP cannot carry its key. This is a protocol
      requirement tested by known-wrong controls, not a provider, host or route
      choice.
    classification: STRATEGY_OR_PROVIDER_BINDING
    created_on: 2026-09-24
    expires_on: 2027-09-24
