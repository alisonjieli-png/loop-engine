  - finding_id: hardcoding.24ca9147889627b85cfe5c45
    owner: loop_engine.core.service_runtime.stripe_provider
    rationale: >-
      The fixed official Stripe API origin is an adapter security boundary.
      Callers cannot replace it with a credential-exfiltration endpoint.
      Separate explicit network authority is required before resolving a key
      or sending a request, and redirects are refused. Provider checks and
      mutants cover these guards. The host still supplies the account, API
      version and secret reference. Other origin literals remain blocking.
      Source is the official Stripe API documentation at
      https://docs.stripe.com/api/subscriptions/list.
    classification: STRATEGY_OR_PROVIDER_BINDING
    created_on: 2026-09-19
    expires_on: 2027-09-19
