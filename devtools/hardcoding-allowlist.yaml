      credential in an authorization header and the invited person's address
      in its body, so the destination must not be settable by a configuration
      value, an environment proxy or a redirect. The command refuses any other
      mail address before it builds the request, for the same reason that
      tools/setup_stripe_sandbox.py pins the payment provider origin. A changed
      origin has a different finding identity and stays blocking. Reviewed on
      2026-09-21. Only this exact finding is allowed; a changed or added value
      has a different finding identity and stays blocking. The audit classifies
      the address as a strategy or provider binding, and this entry repeats
      that classification.
