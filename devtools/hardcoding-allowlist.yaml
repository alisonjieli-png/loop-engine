    owner: tools.check_fly_service_container:default_command_host_configuration
    rationale: >-
      The public origin of the disposable host file that the release container
      check writes for the image's default command. It is a name under the
      reserved .invalid top level name, which can never resolve anywhere, so it
      binds no provider or endpoint; the container has no network at all. The
      hosted origin stays in the host file on the Fly volume.
