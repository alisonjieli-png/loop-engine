  owner: loop_engine.core.service_runtime.catalogue_feed
  classification: STRATEGY_OR_PROVIDER_BINDING
  rationale: "Reviewed October 6, 2026: JSON Feed 1.1 requires this exact version identifier. It is serialized as a format discriminator, never fetched or selected as a provider. The format test checks the identifier and parses the actual HTTP response. Changing it requires reviewing the feed contract."
