  expires_on: '2027-01-06'
- finding_id: hardcoding.6357933cd21aadc97e6c64fa
  owner: tools.operator_credentials.json:api_keys.cloudflare-r2-management.environment
  classification: DEPLOYMENT_CONFIGURATION
  rationale: "Reviewed October 6, 2026: this is the environment reference name in the existing credential-source registry, not a credential value. The operator credential resolver obtains the owner's token from the system keyring or its declared environment. Real R2 qualification records no secret values."
  created_on: '2026-10-06'
  expires_on: '2027-01-06'
- finding_id: hardcoding.9477b4349ada24ae93a7792a
  owner: tools.operator_credentials.json:api_keys.cloudflare-r2-sample-access-id.environment
  classification: DEPLOYMENT_CONFIGURATION
  rationale: "Reviewed October 6, 2026: this names the R2 S3 access-id environment binding at the existing credential-source registry. The value stays in the system keyring. The historical sample label describes initial use, not provider-enforced scope; the owner supplied account-wide R2 credentials."
  created_on: '2026-10-06'
  expires_on: '2027-01-06'
- finding_id: hardcoding.329cfaec76241d32a6887733
