schema: hardcoding_allowlist/v1
entries:
  - finding_id: hardcoding.04dd1a45335f78d34b107c8a
    owner: pyproject.toml:project.urls.Repository
    rationale: The packaging metadata is the one owner of the public repository address. An installed
      distribution carries it as its Repository project URL, and the library page at /library reads it
      from there at run time to link each item's review record, so no Python module writes the address.
      It selects no provider or route and grants no authority; without it the page links nothing and says
      the record is kept with the release. The Homepage, Documentation and Issues entries beside it predate
      the baseline.
    classification: STRATEGY_OR_PROVIDER_BINDING
    created_on: '2026-09-25'
    expires_on: '2027-09-25'
  - finding_id: hardcoding.20ea916032835992d349a0b5
    owner: tools.candidate_review.reviewers.command_line:codex_session_root
    rationale: CODEX_HOME is the Codex command line's own documented variable for its home folder. The
      codex_exec_session reviewer protocol reads it only to find the session record that command line wrote
      for the thread its events name, exactly where the command line itself resolves it, and falls back to
      the command line's own default home. It is not a Loop Engine setting, selects no model or route and
      grants no authority; the answer still counts only when that record names the installation's pinned
      model.
    classification: DEPLOYMENT_CONFIGURATION
    created_on: '2026-09-24'
    expires_on: '2027-09-24'
  - finding_id: hardcoding.b8c2de715f0926b6fb499569
    owner: tools.check_service_workspace.mjs:url
    rationale: Exact hosted-checkout URL prefix in the loopback browser acceptance scenario. It verifies
      the fixture returned the Stripe checkout surface rather than accepting an arbitrary destination. This
      is a provider-specific test assertion, not a runtime route or credential; it does not create a real
      checkout or charge.
    classification: STRATEGY_OR_PROVIDER_BINDING
    created_on: '2026-09-23'
    expires_on: '2027-09-23'
  - finding_id: hardcoding.6f5b08707df506d0111f2aef
    owner: tools.resources.original-native-generation-prompt-v1.json:system
    rationale: Versioned generation instruction resource owned by original_native_generation_prompt/v1 and
      rendered through the existing PromptResourceBundle. Run v4 binds both resource bytes and rendered
      text digests plus implementation source; a resource-only change refuses resume before a model call.
      These are the deliberately governed instructions, not an inline hidden prompt or a task-specific control-flow
      shortcut.
    classification: RESOURCE_OR_TEMPLATE
    created_on: '2026-09-23'
    expires_on: '2027-09-23'
