  - finding_id: hardcoding.7cab50bbc563d86d7bd19b2c
    owner: tools.build_documentation_index
    rationale: Canonical first-party documentation-link origin, used only to rewrite exact origin-plus-slash
      links into same-site paths. It selects no runtime provider or credential and makes no network call.
      Foreign hosts are not accepted by this prefix rule; link and body guards are tested.
    classification: STRATEGY_OR_PROVIDER_BINDING
    created_on: '2026-09-23'
    expires_on: '2027-09-23'
  - finding_id: hardcoding.73f41a7a93bc6cff7f50424a
    owner: tools.build_documentation_index
    rationale: Literal HTTP/HTTPS scheme prefixes classify documentation links; these strings are URI syntax,
      not a configurable deployment endpoint. No request or model call occurs in this renderer.
    classification: STRATEGY_OR_PROVIDER_BINDING
    created_on: '2026-09-23'
    expires_on: '2027-09-23'
