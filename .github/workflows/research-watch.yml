name: Research watch

# A daily, read-only check of the primary sources in tools/research_source_watch.json:
# protocol and harness specifications, registries and projects Baltor follows. It makes
# bounded HTTPS reads and no model call, keeps its report as a run artifact, and opens
# or updates the existing research issue when a source changed or collection failed.
on:
  schedule:
    - cron: "41 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: research-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Restore the previous successful watch report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/research-watch-prior"
          for watch_previous_run in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow research-watch.yml \
              --branch main --status success --limit 5 --json databaseId --jq '.[].databaseId'); do
            watch_previous_folder="$RUNNER_TEMP/research-watch-download-$watch_previous_run"
            if gh run download "$watch_previous_run" --repo "$GITHUB_REPOSITORY" \
                --name research-watch --dir "$watch_previous_folder" && \
                test -f "$watch_previous_folder/research-watch.json"; then
              cp "$watch_previous_folder/research-watch.json" \
                "$RUNNER_TEMP/research-watch-prior/RESEARCH-SOURCE-WATCH-$watch_previous_run.json"
              break
            fi
          done
      - name: Check every watched source
        id: watch
        env:
          # Read-only token for api.github.com requests only; GitHub allows 60
          # unauthenticated requests an hour per address, which a shared runner can exhaust.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/research-watch.json"
          watch_exit_code=0
          PYTHONPATH=src:tools python tools/refresh_research_sources.py --online --max-online-sources 50 \
            --prior-dir "$RUNNER_TEMP/research-watch-prior" --output "$report" > "$RUNNER_TEMP/research-watch.log" 2>&1 || watch_exit_code=$?
          cat "$RUNNER_TEMP/research-watch.log"
          python3 tools/summarize_research_watch.py "$report" --watch-exit-code "$watch_exit_code" \
            --github-output "$GITHUB_OUTPUT" > "$RUNNER_TEMP/research-watch.md"
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: research-watch
          path: |
            ${{ runner.temp }}/research-watch.json
            ${{ runner.temp }}/research-watch.md
            ${{ runner.temp }}/research-watch.log
          if-no-files-found: warn
          retention-days: 30
      - name: Open or update the research issue for changes or failed coverage
        if: always() && steps.watch.outcome == 'success' && (steps.watch.outputs.changed != '0' || steps.watch.outputs.errors != '0')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title="Research watch: sources changed"
          number="$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file "$RUNNER_TEMP/research-watch.md"
          else
            gh issue create --title "$title" --body-file "$RUNNER_TEMP/research-watch.md"
          fi
      - name: Fail the run when collection coverage is degraded
        if: always() && steps.watch.outputs.errors != '' && steps.watch.outputs.errors != '0'
        run: |
          echo "Research watch coverage is degraded. See the research-watch artifact and issue summary."
          exit 1
