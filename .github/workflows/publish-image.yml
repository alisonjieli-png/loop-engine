name: Publish worker image

# Builds the Loop Engine worker image from the repository Dockerfile and
# publishes it to the GitHub Container Registry under this repository. The
# image carries no provider key, model, or customer data. Tags: the branch
# name and the commit digest; the pushed image digest is written to the job
# summary so a deployment manifest can pin it.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: build and push ghcr.io image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}

    steps:
      - uses: actions/checkout@v7

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:main
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT

      - name: Verify the pushed image runs the doctor command
        run: |
          docker pull "${IMAGE}@${{ steps.build.outputs.digest }}"
          docker run --rm "${IMAGE}@${{ steps.build.outputs.digest }}" doctor --format json > "$RUNNER_TEMP/doctor.json"
          python3 - <<'PY'
          import json, os
          report = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "doctor.json")))
          assert isinstance(report, dict) and report, "doctor produced no report"
          print("doctor keys:", sorted(report)[:12])
          PY

      - name: Record the image digest
        run: |
          {
            echo "## Published worker image"
            echo
            echo "- image: \`${IMAGE}@${{ steps.build.outputs.digest }}\`"
            echo "- tags: \`main\`, \`sha-${{ github.sha }}\`"
            echo "- base: python:3.12-slim pinned by digest in the Dockerfile"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.build.outputs.digest }}" > "$RUNNER_TEMP/image-digest.txt"

      - uses: actions/upload-artifact@v7
        with:
          name: worker-image-digest
          path: ${{ runner.temp }}/image-digest.txt
          retention-days: 90
