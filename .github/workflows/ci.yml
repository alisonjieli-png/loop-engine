name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  docs:
    name: public documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check Markdown structure
        run: >-
          npx --yes markdownlint-cli2@0.23.2
          AGENTS.md README.md CHANGELOG.md CONTRIBUTING.md SECURITY.md humanizer-context.md
          showcase/README.md 'docs/**/*.md' 'case-studies/*.md'
          'examples/**/*.md'

      - name: Check public language
        uses: vale-cli/vale-action@v3
        with:
          version: 3.18.0
          sync: false
          files: '["AGENTS.md","README.md","CHANGELOG.md","CONTRIBUTING.md","SECURITY.md","humanizer-context.md","showcase/README.md","docs","case-studies","examples"]'

      - name: Refuse retired public language
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            echo "ripgrep (rg) is required for retired-language checks but was not found."
            echo "Installing ripgrep..."
            sudo apt-get update -y && sudo apt-get install -y ripgrep
          fi
          rg --version
          # Source terminology is owned by the conformance gate
          # (python -m loop_engine --conformance), which applies the
          # machine-readable allowed_fragments contract in
          # forbidden_paths.json. This check owns public prose only.
          # docs/prompts and docs/evidence are historical evidence, not
          # current public language.
          if rg --hidden -n -i \
            --glob '!src/loop_engine/forbidden_paths.json' \
            --glob '!docs/prompts/**' --glob '!docs/evidence/**' \
            --glob '!showcase/node_modules/**' --glob '!**/.cache/**' \
            '\bchronicles?\b|\breceipts?\b' \
            README.md CHANGELOG.md humanizer-context.md docs examples \
            case-studies benchmarks showcase; then
            echo "Retired public language found. Use Run History, event log, record, report, or evidence."
            exit 1
          fi

          if rg --hidden -n -i \
            --glob '!docs/prompts/**' --glob '!docs/evidence/**' \
            --glob '!showcase/assets/**' \
            --glob '!showcase/node_modules/**' --glob '!**/.cache/**' \
            '\bchild(?:ren)?\b|\broot[[:space:]_-]+loop\b|what[[:space:]_-]*is[[:space:]_-]*next|what[[:space:]_-]+next|whats[[:space:]_-]*next|whatnext' \
            README.md CHANGELOG.md humanizer-context.md docs examples \
            case-studies showcase; then
            echo "Retired topology or decision language found. Use Starting, Spawned by, Queried by, Retrieved by, Connected from, or select next action."
            exit 1
          fi

      - name: Check local links and section anchors
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline --include-fragments --root-dir "$GITHUB_WORKSPACE"
            AGENTS.md README.md CHANGELOG.md CONTRIBUTING.md SECURITY.md humanizer-context.md
            showcase/README.md 'docs/**/*.md' 'case-studies/*.md'
            'examples/**/*.md'
          fail: true
          failIfEmpty: true

      - name: Validate benchmark registry
        run: |
          python -m pip install PyYAML jsonschema
          python - <<'PY'
          import json
          import yaml
          from jsonschema import validate
          with open("docs/benchmarks/benchmark-registry.yaml") as stream:
              registry = yaml.safe_load(stream)
          with open("docs/benchmarks/benchmark-registry.schema.json") as stream:
              schema = json.load(stream)
          validate(registry, schema)
          tracks = registry["benchmarks"]
          ids = [item["id"] for item in tracks]
          assert len(tracks) >= 100
          assert len(ids) == len(set(ids))
          assert not any(item["staged_eligibility"]["eligible_for_comparison"]
                         for item in tracks)
          print(f"validated {len(tracks)} cataloged benchmark tracks")

          with open("docs/benchmarks/loop-engine-benchmark-evidence.json") as stream:
              native = json.load(stream)
          with open("docs/benchmarks/loop-engine-benchmark-evidence.schema.json") as stream:
              native_schema = json.load(stream)
          validate(native, native_schema)
          native_ids = [item["record_id"] for item in native["records"]]
          assert len(native_ids) == len(set(native_ids))
          print(f"validated {len(native_ids)} Loop Engine benchmark records")
          PY

      - name: Render current architecture diagrams
        run: |
          awk 'BEGIN{inside=0} /^```mermaid$/{if(!inside){inside=1; next}} inside && /^```$/{exit} inside{print}' README.md > "$RUNNER_TEMP/readme-overview.mmd"
          npx --yes @mermaid-js/mermaid-cli@11.16.0 -p .github/puppeteer-config.json -i "$RUNNER_TEMP/readme-overview.mmd" -o "$RUNNER_TEMP/readme-overview.png" --quiet
          awk 'BEGIN{inside=0} /^```mermaid$/{if(!inside){inside=1; next}} inside && /^```$/{exit} inside{print}' docs/components/self-improvement/README.md > "$RUNNER_TEMP/self-improvement.mmd"
          npx --yes @mermaid-js/mermaid-cli@11.16.0 -p .github/puppeteer-config.json -i "$RUNNER_TEMP/self-improvement.mmd" -o "$RUNNER_TEMP/self-improvement.png" --quiet
          awk 'BEGIN{inside=0} /^```mermaid$/{if(!inside){inside=1; next}} inside && /^```$/{exit} inside{print}' docs/components/intelligence-layers/INTELLIGENCE-AS-LOOPS.md > "$RUNNER_TEMP/intelligence-loops.mmd"
          npx --yes @mermaid-js/mermaid-cli@11.16.0 -p .github/puppeteer-config.json -i "$RUNNER_TEMP/intelligence-loops.mmd" -o "$RUNNER_TEMP/intelligence-loops.png" --quiet
          awk 'BEGIN{inside=0} /^```mermaid$/{if(!inside){inside=1; next}} inside && /^```$/{exit} inside{print}' docs/components/core-architecture/BRAVE-SEARCH-PLUGIN.md > "$RUNNER_TEMP/brave-plugin.mmd"
          npx --yes @mermaid-js/mermaid-cli@11.16.0 -p .github/puppeteer-config.json -i "$RUNNER_TEMP/brave-plugin.mmd" -o "$RUNNER_TEMP/brave-plugin.png" --quiet
          awk 'BEGIN{inside=0} /^```mermaid$/{if(!inside){inside=1; next}} inside && /^```$/{exit} inside{print}' docs/components/core-architecture/MODEL-GATEWAY.md > "$RUNNER_TEMP/model-gateway.mmd"
          npx --yes @mermaid-js/mermaid-cli@11.16.0 -p .github/puppeteer-config.json -i "$RUNNER_TEMP/model-gateway.mmd" -o "$RUNNER_TEMP/model-gateway.png" --quiet
          awk 'BEGIN{inside=0} /^```mermaid$/{if(!inside){inside=1; next}} inside && /^```$/{exit} inside{print}' docs/components/loop-object/LOOP-PROFILE-ONTOLOGY.md > "$RUNNER_TEMP/loop-profiles.mmd"
          npx --yes @mermaid-js/mermaid-cli@11.16.0 -p .github/puppeteer-config.json -i "$RUNNER_TEMP/loop-profiles.mmd" -o "$RUNNER_TEMP/loop-profiles.png" --quiet

      - name: Verify interactive architecture and video
        run: |
          npm ci --prefix showcase
          python3 -m http.server 8082 --directory showcase > /tmp/showcase-server.log 2>&1 &
          SHOWCASE_PID=$!
          trap 'kill $SHOWCASE_PID 2>/dev/null || true; wait $SHOWCASE_PID 2>/dev/null || true' EXIT INT TERM
          echo "Waiting for showcase server at http://127.0.0.1:8082 ..."
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8082/ >/dev/null 2>&1; then
              echo "Showcase server is ready."
              break
            fi
            if ! kill -0 $SHOWCASE_PID 2>/dev/null; then
              echo "Showcase server failed to start. Log:"
              cat /tmp/showcase-server.log || true
              exit 1
            fi
            sleep 0.5
          done
          if ! curl -fsS http://127.0.0.1:8082/ >/dev/null 2>&1; then
            echo "Showcase server did not become ready within 30s."
            cat /tmp/showcase-server.log || true
            exit 1
          fi
          npm test --prefix showcase
          node showcase/tests/visual-audit.mjs
          kill $SHOWCASE_PID 2>/dev/null || true
          wait $SHOWCASE_PID 2>/dev/null || true
          trap - EXIT INT TERM

  test:
    name: suite + conformance gates
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Self-test
        run: python -m loop_engine --self-test

      - name: Conformance gates
        run: python -m loop_engine --conformance

      - name: Examples run
        run: |
          python examples/01_prioritize_support_queue/run.py
          python examples/02_predict_customer_renewal/run.py
          python examples/04_read_run_reports/run.py
          python examples/06_reconcile_invoices/run.py
          python examples/08_play_back_a_saved_run/run.py
          python examples/09_search_the_intelligence_layers/run.py
          python examples/10_validate_customer_import/run.py
          python examples/11_seed_space_context/run.py
          python examples/12_wrap_a_large_codebase/run.py
          python examples/13_brave_search_plugin/run.py
          python examples/14_five_problem_campaign/run.py
          python examples/15_verify_a_deployment_profile/run.py
          python examples/16_compare_complex_harnesses/run.py
          python examples/17_classify_harness_files/run.py
          python examples/20_compile_text_tasks/run.py

  build:
    name: build the distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
