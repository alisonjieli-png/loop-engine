name: Live pulse

# A read-only pulse of the live service every six hours. It asks every hostname
# for its pages, health and capabilities, and asks the identity provider's
# public health address so the free identity project stays active. It holds no
# secret and changes nothing. A failure fails the run, and GitHub notifies.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-pulse
  cancel-in-progress: false

jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Ask every hostname
        run: python3 tools/check_live_pulse.py --output "$RUNNER_TEMP/live-pulse.json"
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: live-pulse
          path: ${{ runner.temp }}/live-pulse.json
          if-no-files-found: ignore
          retention-days: 14
