  asynchronous_dispatch: loop_engine.core.reusable_capability_harvest.dispatch_reuse_opportunity_as_loop
  harvester: loop_engine.core.reusable_capability_harvest.harvest_reuse_opportunity_as_loop
  primary_practitioner_context: loop_engine/intelligence/context/core/practitioner_context_intelligence.yaml
