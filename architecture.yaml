parameter_and_prompt_governance:
  operational_runtime_type: Loop
  settings_authority: loop_engine.core.runtime_settings.RuntimeSettings
  parameter_definition: loop_engine.core.parameter_resolution.ParameterDefinition
  tagged_parameter_input: loop_engine.core.parameter_resolution.ParameterInput
  resolved_parameter_record: loop_engine.core.parameter_resolution.ResolvedParameter
