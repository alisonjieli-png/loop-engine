schema_version: 1

semantic_identity:
  authority: terminology.yaml
  installed_projection: src/loop_engine/data/semantic_data_dictionary.yaml
  rendered_glossary: docs/architecture/SEMANTIC-IDENTITY-DICTIONARY.md
  ambiguity_register: docs/architecture/SEMANTIC-AMBIGUITY-REGISTER.yaml
  rules:
    - one_term_one_meaning
    - one_authority_per_concept
    - runtime_definition_request_record_reference_are_distinct
    - permission_policy_never_equals_preference
    - store_authority_never_equals_rebuildable_index
    - candidate_never_equals_active_intelligence
    - parameterize_when_invariants_and_lifecycle_match
    - compose_when_implementation_varies_behind_one_contract
    - separate_class_only_for_distinct_state_lifecycle_protocol_or_authority
    - create_loop_instance_for_independently_governed_work
    - compatibility_aliases_never_own_authority

component_architecture:
  ontology: src/loop_engine/data/component_ontology.yaml
  interactions: src/loop_engine/data/component_interactions.yaml
  folder_map: src/loop_engine/data/component_folder_map.yaml
  definition: loop_engine.core.component_contracts.LoopComponentDefinition
  reference: loop_engine.core.component_contracts.LoopComponentRef
  static_invariants:
    - does_not_execute
    - does_not_call_provider
    - does_not_read_files_through_hidden_io
    - does_not_mutate_itself
    - does_not_grant_permission
    - is_not_a_graph_vertex
  execution_rule: every_semantic_value_and_transformation_is_a_logical_loop
  default_atomic_mode: deterministic
  value_contract: loop_engine.loop.atomic_primitives.LoopValue
  intrinsic_kernel: loop_engine.loop.intrinsic_kernel
  intrinsic_forbidden_authority:
    - task
    - domain
    - provider
    - storage
    - permission
    - policy
    - routing
    - example
  physical_fusion_requires_logical_history: true

adaptive_recovery:
  stall_detector_authority: signal_only
  semantic_panel_steps:
    - diagnose_stall
    - propose_recovery
    - propose_recovery_alternative
    - adjudicate_recovery
  adjudication_selects_validated_proposal: true
  proposal_executes_directly: false
  next_action_validation_required: true
  semantic_repair_attempts_per_panel_step: 1
  deterministic_terminal_authorities:
    - permission
    - safety
    - cancellation
    - declared_budget_exhaustion
  verification_scope:
    blocking_gap_requires_registered_criterion: true
    advisory_finding_blocks_completion: false
    proposed_new_requirement_blocks_completion: false
    semantic_step_contract_is_task_acceptance: false

reactive_execution:
  operational_runtime_type: Loop
  series_definition: loop_engine.loop.reactive_activation.ReactiveSeriesDefinition
  reactive_profile: loop_engine.loop.reactive_contracts.ReactiveLoopProfile
  trigger_contract: loop_engine.loop.reactive_activation.TriggerEnvelope
  activation_record: loop_engine.loop.reactive_activation.ActivationRecord
  lease_contract: loop_engine.loop.reactive_activation.WorkLease
  scheduler_mechanic: loop_engine.core.reactive_scheduler.SQLiteReactiveScheduler
  canonical_executor: loop_engine.core.reactive_worker.CanonicalReactiveExecutor
  asynchronous_worker: loop_engine.core.reactive_worker.AsyncReactiveWorker
  information_identity: loop_engine.loop.atomic_primitives.LoopValueRef
  information_resolver: loop_engine.core.information_access.InformationResolver
  candidate_output: loop_engine.loop.reactive_outputs.CandidateOutput
  candidate_evaluation: loop_engine.loop.reactive_outputs.CandidateEvaluation
  portfolio_snapshot: loop_engine.loop.reactive_outputs.OutputPortfolioSnapshot
  output_store: loop_engine.core.reactive_output_store.SQLiteReactiveOutputStore
  invariants:
    - series_is_passive_and_never_a_graph_vertex
    - every_activation_is_finite_budgeted_and_terminal
    - every_claimed_activation_starts_the_exact_loop_definition
    - process_local_information_never_claims_restart_durability
    - reference_possession_never_grants_access
    - rank_belongs_to_one_policy_version_not_the_candidate
    - portfolio_reads_never_reactivate_the_producer
    - stale_fencing_tokens_cannot_commit
    - unchanged_input_does_not_create_duplicate_work
    - candidate_producer_cannot_be_sole_verifier
    - runtime_transitions_project_through_run_history
  persistence:
    transactional_store: sqlite_wal
    delivery: at_least_once_with_idempotency
    activation_state: append_only_revisions
    output_state: append_only_candidates_evaluations_and_portfolios
    live_coroutine_serialization: prohibited
  installed_execution_placements:
    - inline
    - async_io
    - thread
  unproven_placements:
    - process
    - local_container
    - remote_worker
    - kubernetes_job

plugin_distribution:
  runtime_type: Loop
  bundle_manifest: loop_engine.core.plugin_bundles.PluginBundleManifest
  resolved_snapshot: loop_engine.core.plugin_bundles.ResolvedPluginSnapshot
  skill_authority: loop_engine.core.skill_registry.SkillAdmissionRecord
  resolution_role_profile: intelligence.code.resolve
  override_policy: exact_content_deduplication_or_refusal
  semantic_fingerprint_includes:
    - complete_plugin_manifest
    - complete_skill_file_digests
    - exact_skill_admission_digests
  invariants:
    - plugin_bundle_is_passive
    - plugin_bundle_grants_no_authority
    - plugin_skill_must_be_independently_admitted
    - changed_project_bundle_cannot_override_installed_content_silently
    - changed_skill_body_invalidates_resolution
    - text_and_json_views_share_one_snapshot

added_file_extensions:
  operational_runtime_type: Loop
  discovery_contract: loop_engine.core.extension_discovery.ExtensionDiscoveryRequest
  resolved_snapshot: loop_engine.core.extension_discovery.ExtensionSnapshot
  provider_route_contract: loop_engine.core.extension_discovery.ProviderRouteBundle
  capability_candidate_contract: loop_engine.core.extension_discovery.CapabilityCandidate
  provider_settings_authority: loop_engine.core.runtime_settings.ProviderSettings
  skill_authority: loop_engine.core.skill_registry.SkillAdmissionRecord
  plugin_authority: loop_engine.core.plugin_bundles.PluginBundleManifest
  intelligence_authority: loop_engine.ontology.catalog.UnifiedCatalog
  conventional_roots:
    project: .loop-engine/extensions
    user: ~/.config/loop-engine/extensions
    environment: LOOP_ENGINE_EXTENSION_ROOTS
  recognized_folders:
    - providers
    - capabilities
    - skills
    - plugins
    - intelligence
  invariants:
    - file_discovery_is_effect_free
    - added_files_are_passive_and_create_no_runtime
    - conflicting_identity_and_version_fail_closed
    - exact_content_may_deduplicate
    - credential_values_never_enter_snapshots
    - endpoint_templates_cannot_interpolate_credentials
    - only_zero_price_and_local_routes_auto_activate_by_default
    - included_quota_paid_and_unknown_routes_need_explicit_opt_in
    - wire_protocol_and_authentication_are_independent
    - unsupported_protocol_or_auth_remains_visible_and_inactive
    - capability_files_are_candidate_only
    - skill_files_require_independent_admission
    - intelligence_files_cannot_self_register_or_self_promote
    - plugin_bundles_remain_under_existing_plugin_authority
    - model_calls_and_effects_still_require_runtime_authority

planning_and_execution:
  operational_runtime_type: Loop
  graph_authority: loop_engine.code_nodes.solution_graph.LoopGraphDefinition
  plan_definition: loop_engine.core.development_planning.PlanDefinition
  task_slice: loop_engine.core.development_planning.TaskSliceDefinition
  graph_compiler: loop_engine.core.development_planning.compile_plan_to_loop_graph
  wave_executor: loop_engine.core.development_execution.execute_development_plan
  verification_contract: loop_engine.core.development_planning.RequirementVerificationContract
  planning_authority: loop_engine.core.development_planning.PlanningAuthority
  clarification_disposition: loop_engine.core.development_planning.ClarificationDisposition
  assignment_envelope: loop_engine.core.development_planning.WorkerAssignmentEnvelope
  retry_policy: loop_engine.core.development_planning.RetryPolicy
  resume_reconciliation: loop_engine.core.development_governance.ResumeReconciliationResult
  invariants:
    - planning_is_practitioner_loop_work
    - plans_and_task_slices_are_passive
    - accepted_tasks_compile_to_loop_graph_definition
    - every_executable_attempt_runs_as_a_solution_loop
    - safe_ready_tasks_may_overlap_in_one_dependency_wave
    - criteria_bind_expected_verification_evidence_before_action
    - children_receive_resolved_exact_snapshots
    - retries_require_an_executable_delta
    - blocked_is_terminal_for_the_current_activation
    - run_history_remains_authoritative

lifecycle_extensions:
  operational_runtime_type: Loop
  procedure_contract: loop_engine.core.lifecycle_extensions.ProcedureLifecycleDefinition
  extension_contract: loop_engine.core.lifecycle_extensions.LifecycleExtensionDefinition
  resolver: loop_engine.core.lifecycle_extensions.resolve_extensions
  resolved_snapshot: loop_engine.core.lifecycle_extensions.ResolvedExtensionSetSnapshot
  execution_fingerprint: loop_engine.core.lifecycle_extensions.ExecutionContextFingerprint
  invariants:
    - procedure_declares_supported_events
    - extension_registration_is_passive
    - extension_execution_uses_an_exact_loop_definition
    - resolution_order_is_deterministic
    - empty_and_failed_are_distinct
    - material_authority_drift_requires_replanning
    - no_fixed_global_hook_list

software_development_skill:
  tdd_skill: loop_engine/skills/software-tdd-red-green-refactor/SKILL.md
  admission_authority: loop_engine.core.skill_registry.SkillAdmissionRecord
  scope: optional_software_only
  universal_rule: evidence_first_execution

development_governance:
  publication_authorization: loop_engine.core.development_governance.PublicationAuthorization
  contribution_isolation: loop_engine.core.development_governance.ContributionIsolationResult
  self_hosting_profile: loop_engine.core.development_governance.SelfHostingProfile
  legacy_authority: loop_engine.core.development_governance.LegacyAuthorityState
  invariants:
    - commit_push_pull_request_publish_and_deploy_are_distinct_effects
    - requester_cannot_approve_its_own_publication
    - projection_state_is_reconciled_against_artifact_reality
    - repository_config_is_not_a_generated_user_template
    - legacy_and_current_authorities_do_not_merge_silently

product_solve:
  command: loop-engine solve
  request: loop_engine.code_nodes.solve_runtime.SolveRequest
  outcome: loop_engine.code_nodes.solve_runtime.SolveOutcome
  terminal_vocabulary: loop_engine.code_nodes.solve_runtime.SolveTerminalCode
  practitioner: loop_engine.core.adaptive_practitioner.run_adaptive_practitioner
  generated_project: loop_engine.core.generated_project.execute_generated_project
  graph_authority: loop_engine.code_nodes.solution_graph.LoopGraphDefinition
  default_granularity: governed_semantic
  optional_granularity: strict_atomic
  invariants:
    - original_task_is_immutable
    - task_build_does_not_claim_execution
    - completion_requires_verified_artifact_or_state_change
    - local_source_materialization_requires_explicit_model_authority
    - workspace_and_command_effects_require_exact_approval
    - generated_commands_run_in_a_confined_pinned_docker_image
    - unsupported_work_returns_a_typed_blocker
    - every_run_preserves_run_history
    - external_provider_support_requires_a_separate_live_result

independent_qualification:
  starter: devtools/qualification_lab
  imports_loop_engine: false
  model_provider: ollama
  unit_of_qualification:
    - component
    - interaction
    - state_transition
    - architecture_classification

invariants:
  LE-NODE-001:
    title: Loop is the only operational runtime and executable graph vertex
    severity: constitutional
    required: true
    canonical_class:
      module: loop_engine.loop.recursive_loop
      name: Loop
    forbidden_concrete_classes:
      - Node
      - LoopNode
      - PractitionerNode
      - IntelligenceNode
      - SolutionNode
      - ConfigurationNode
      - StringNode
      - CodeNode
      - ContractNode
      - DeterministicNode
      - HybridNode
      - NonDeterministicNode
    forbidden_plugin_behavior:
      - define_node_type
      - replace_node_runtime
      - bypass_loop_runtime

  LE-NODE-005:
    title: Reusable behaviors use versioned Loop profiles
    canonical_profile_types:
      - LoopProfileSpec
      - LoopProfileRef
    legacy_preset_artifact_kind: loop_node_preset
    presets_are_subclasses: false

  LE-DOC-001:
    title: Prose is non-executable
    prohibited_behavior_sources:
      - documentation
      - comments
      - free_form_tags
      - display_labels
      - operator_notes

node_ontology:
  only_operational_node:
    kind: loop
    class: loop_engine.loop.recursive_loop.Loop
  allow_generic_concrete_node: false
  allow_additional_node_subtypes: false
  allow_plugin_node_kinds: false
  allow_role_specific_node_classes: false
  allow_mode_specific_node_classes: false

loop_dimensions:
  roles:
    - practitioner
    - intelligence
    - solution
  relationships:
    - starting
    - spawned_by
    - queried_by
    - retrieved_by
    - connected_from
  run_modes:
    - deterministic
    - hybrid
    - non_deterministic

intelligence_layers:
  - context
  - code
  - runtime_history_solution
  - user_feedback

source_collections:
  - core
  - learned
  - plugin

forbidden_paths:
  - src/loop_engine/static_architecture
  - src/loop_engine/node/node.py

forbidden_class_names:
  - Node
  - LoopNode
  - PractitionerNode
  - IntelligenceNode
  - SolutionNode
  - RootNode
  - ChildNode
  - CodeNode
  - ToolNode
  - ModelNode
  - CapabilityNode
  - DeterministicNode
  - HybridNode
  - NonDeterministicNode
  - ConfigurationNode
  - StringNode
  - ContractNode

development_import_boundaries:
  src_must_not_import:
    - devtools
    - tests
    - examples
    - benchmarks
