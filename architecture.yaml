intelligence_layers:
  - context
  - code
  - runtime_history_solution
  - user_feedback

source_collections:
  - core
  - learned
  - plugin

forbidden_paths:
  - src/loop_engine/static_architecture
  - src/loop_engine/node/node.py

forbidden_class_names:
  - Node
  - LoopNode
  - PractitionerNode
  - IntelligenceNode
