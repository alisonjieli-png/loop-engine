record_type: component_guide_map/v1
version: 1.0.0
source_of_truth: docs/components/COMPONENT-GUIDE-MAP.yaml
checked_by: tools/check_component_guides.py
description: >-
  Which component guide owns each source directory that runs a registered
  operational boundary, and which guides exist. The check in
  tools/check_component_guides.py refuses a registered boundary whose
  directory has no guide, a guide that is not listed here, and a listed guide
  that is missing. With --run-documented-checks it also runs each self-test
  command the guides give a reader and refuses the ones that fail.
limits: >-
  The coverage rule resolves one guide for each source directory, not one
  guide for each boundary. A directory holding several components sends all
  of them to the same guide, so this map proves that no boundary is
  undocumented at directory level; it does not prove that a guide describes
  every boundary inside its directory. Splitting a directory's guides needs a
  finer rule than a directory lookup. A reviewer still reads the prose: the
  check decides whether the names a guide uses exist and its commands run, not
  whether its sentences are true.

# Every source directory reached by an envelope in
# loop_engine.core.boundary_registry.BOUNDARIES. A directory is written
# relative to src/loop_engine. "." is the package root.
components:
  ".":
    guide: docs/components/managed-records/README.md
    covers: >-
      The record tool dispatched from the package root, which is the only
      registered boundary whose module sits beside the package folders.
  loop:
    guide: docs/components/loop-object/README.md
    covers: >-
      The canonical Loop runtime, its definition, relationships, modes, step
      profiles, spawning, checkpoints and effect approvals.
  core:
    guide: docs/components/core-architecture/README.md
    covers: >-
      The three public capability groups and the internal runtime mechanics:
      the model gateway, harness adapters, workspaces, settings, retrieval,
      Runtime Memory, reusable capabilities and the semantic runtime.
  core/engines:
    guide: docs/components/core-architecture/ENGINE-SELECTION.md
    covers: >-
      The shared engine framework: the engine records, the slot catalogue,
      engine selection for every slot, attempt assessment and fallback, and
      the evidence that may order engines.
  core/step_execution:
    guide: docs/components/core-architecture/STEP-EXECUTION.md
    covers: >-
      The step executor slot: the step edge records, the envelope that selects
      and runs an engine, the declared harness engine and its manifest, the
      custom Loop engine and the qualification of a registered harness.
  core/decisions:
    guide: docs/components/typed-decisions/README.md
    covers: >-
      Typed decision requests, their provider capability and the configured
      decision endpoints the model gateway dispatches to.
  core/service_runtime:
    guide: docs/components/service-runtime/README.md
    covers: >-
      The hosted intelligence service: its versioned operations, tenant
      authority, client keys, request limits and usage records.
  code_nodes:
    guide: docs/components/solution-canvas/README.md
    covers: >-
      Solution Canvas execution, the solution graph adapter and the other
      reusable solution capabilities that run as Solution or Practitioner
      Loops.
  generation:
    guide: docs/components/configuration-search/README.md
    covers: >-
      The configuration space, its proposal adapters and the search that
      proposes exact configuration candidates.

# Every Markdown file under docs/components, with what it covers. A new guide
# has to be listed here, and a listing without a file fails the check.
guides:
