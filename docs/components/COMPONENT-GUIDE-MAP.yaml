# Names a guide may cite that Loop Engine does not define. Each one belongs to
# another project and is named so a reader can find the real dependency.
external_names:
  ClientSession: >-
    The Model Context Protocol client session class from the mcp package.
  FastMCP: >-
    The server class from the mcp package, used by a host that publishes
    tools to Loop Engine.
  mcp.server.fastmcp.FastMCP: >-
    The fully qualified path to that same mcp server class.
  TracerProvider: >-
    The OpenTelemetry tracer provider a host configures before export.
  UsageLimits: >-
    The request limit object from the pydantic-ai package used by one
    external harness adapter.
  SKILL.md: >-
    The file name an external harness uses for a skill instruction file.
  events.jsonl: >-
    The file name inside a saved run directory, not a Python name.

# Placeholder names an example asks the reader to supply. The package defines
# none of them, and a reader substitutes their own value.
reader_supplied_names:
  configured_recording_tracer: >-
    The OpenTelemetry tracer the reader builds from their own TracerProvider
    before calling the exporter in the export example.

# Contract names a guide invents to make an example concrete. The package
# defines none of these, and a reader must not look for them.
example_record_types:
  invoice_and_rate_table/v1: >-
    The input contract of the invented invoice tool in the Code Intelligence
    registration example.
  normalized_invoice/v1: >-
    The output contract of that same invented invoice tool.
  import_failure/v1: >-
    The input port role of the invented customer-import repair task in the
    profile binding example.
  repair_patch/v1: >-
    The output port role of that same invented repair task.
  context_item/v1: >-
    The schema_version written in the illustrative Context Intelligence
    record. The package stores the field but defines no such value.

# Names a guide cites that no runtime module of the package defines: a value
# in an example measurement's data, a retired name that only a check still
# spells, to show that it is refused, or the name of a named check that a guide
# points a reader to. Each entry names the repository file that
# holds the name. The check reads that file and refuses an entry whose file is
# missing or outside the repository, or does not hold that exact name, so a
# renamed value fails here the same way a renamed package name does.
repository_file_names:
  is_approved:
    file: src/loop_engine/core/mcp_adapter_checks.py
    meaning: >-
      The retired generic approval hook. The effect approval and protocol tool
      guides name it only to say that it no longer grants authority, and this
      check builds one to show that it is refused.
  starter_catalogue_search_queries/v1:
    file: examples/29_intelligence_service/starter-catalogue/search-queries.json
    meaning: >-
      The record type of the starter catalogue's own search queries. The
      search quality measurement uses it as the origin of the 105 requests it
      takes unchanged from that file.
  written_for_this_measurement:
    file: examples/30_search_quality/relevance-judgements.json
    meaning: >-
      The origin of the 249 requests written from item titles before any
      ranking was measured.
  held_back:
    file: examples/30_search_quality/relevance-judgements.json
    meaning: >-
      The split of the requests that are read once, after a policy is chosen
      from the development split.
  plan_and_split_work_with_explicit_joins:
    file: examples/29_intelligence_service/starter-catalogue/items.json
    meaning: >-
      A starter catalogue item that the search quality guide names as the
      wanted answer of a request that search ranks tenth.
  split_a_large_request_into_assignable_parts:
    file: examples/29_intelligence_service/starter-catalogue/items.json
    meaning: >-
      The near neighbour that search ranks first for that same request.
  adding_a_process_harness_recipe_needs_no_core_dispatch_edit:
    file: src/loop_engine/core/harness_recipe_catalog_checks.py
    meaning: >-
      The named check that fails when a harness style is spelled in the
      process runner or the relay. The external harness guide names it so that
      a reader who adds a recipe knows which check holds that rule.
  no_fresh_instance_recipe_writes_the_model_credential_to_a_file_or_a_command_line:
    file: src/loop_engine/core/harness_fresh_instance_checks.py
    meaning: >-
      The named check that fails when a fresh instance recipe writes the
      step's model credential to a file or passes it on a command line.
  the_step_executor_slot_record_names_the_contract_kinds_version_and_edges:
    file: src/loop_engine/core/external_harness_contract_checks.py
    meaning: >-
      The named check that fails when the step executor record of the engine
      slot catalogue and the adapter contract state different engine kinds,
      protocol versions or edges.
