  - id: S-6.62
    phase: 6
    title: Catalogue releases and library settings with good defaults
    status: building
    depends_on: [S-6.40]
    boundary: [tools/build_host_catalogue_manifest.py, src/loop_engine/core/service_runtime/http_entrypoint.py]
    verify: ['each catalogue release is a versioned record naming the items added, changed and withdrawn, with release notes a customer can read', 'grants follow the packaged manifest for every approved item, a host setting an older release refuses, so new items reach accounts without a hand list', 'a withdrawn or changed item is refused at download with its reason, and a client can pin a release', 'account library settings with good defaults: families, kinds, licences, harness layout, minimum review level and freshness, applied to search and downloads', 'items and their searchable attributes published without a redeploy: a content-addressed body store behind a fixed edge (a volume folder first, object storage later), a versioned catalogue release record, an active release pointer moved with an expected-version guard, and a hot swap that builds the new index to one side and verifies every digest', 'a declared attribute schema (text, keyword, choice, number, date, list; searchable, filterable, sortable, shown, public or internal) so a new attribute of an existing type needs no code change, and no attribute can set an effect, licence or permission', 'grants that follow the active release with sparse explicit denials, a durable withdrawal that no pointer rollback or image rollback revives, and a catalogue-state marker an older image refuses', 'a local measurement of index build time, memory, disk and search latency for synthetic 10,000-item and 100,000-item releases']
    adversarial: A release that adds an item no reviewer approved, a grant list that drifts from the manifest, and a setting that widens what the account may receive beyond its plan must each fail a named check.
    acceptance: A new batch of approved items reaches every eligible account through one release, customers see what changed, and their settings shape what they are offered.
    evidence: 'September 22 evening: owner direction for 10,000 items, multi-model review, managed releases of new files, and user settings with good defaults. September 22 late evening, the owner: "how can we add harness intelligence files and have their attributes/searchable columns/details without having to redeploy the entire system". Engineering decided the design above; the build started the same night in the detached worktree /home/username/.le-wave3/catalogue-releases. September 22 late-night offline 100,000-row metadata probe: the synthetic manifest reached 122,071,567 bytes against the 2,000,000-byte host loader, the bare unpaged list reached 73,314,429 bytes against a 262,144-byte response ceiling, and current per-request Retriever build took 48.57 seconds and 2.10 GiB peak resident memory. No real bodies or active approvals were part of the fixture. See artifacts/hundredk-serving-probe-2026-09-22/README.md. September 23: built in 18337ff and released in Fly release 17: a content-addressed body store, releases with an active pointer and durable withdrawals, an attribute schema defined as data, search filters, grants that can follow the active release, five operator commands and a catalogue state marker that older images refuse. Locally at 100,000 items one Machine breaks on memory (a swap needs about 2 GB), disk, a 65 second swap and hybrid search speed. Switched on live at 06:17 to 06:21 UTC: the host file gained a catalogue section (backed up first), the first release ad440982... (43 items) was published from a bundle without a redeploy, and the source moved to the store; health, catalogue 6 of 6 and website 74 of 74 passed. The runbook''s follow-catalogue-release --all-tenants step then gave all six accounts every item, including the isolation account pilot-boundary, and the hosted service check failed two isolation checks; the five non-owner accounts now deny every current item and the check passes 19 of 19. Record catalogue-release-activation-1.json. Fly release 16 and older refuse the host file now. September 23, 05:27 Eastern: Fly release 19 from 421f37ce (image sha256:23b00490...) shipped the isolation fix: stop-following-catalogue-release returns an account to a snapshot of what it receives now, --all-tenants moves only accounts that already receive every served item, and the runbook''s first-time step follows only pilot-owner; 16 new checks with removed-guard controls, and a replay of the release 17 step that fails under the old rules. Live repair at 09:30 UTC: the five non-owner accounts returned to empty snapshots and the hosted service check passed 19 of 19. Then the second catalogue release c824a1d2... (43 items, anchored to 565e133) was published without a redeploy and served within a minute; website 81 of 81, catalogue 6 of 6 and hosted service 19 of 19 afterwards. Record pilot-release-17.json.'
    next_local_work: Publish the first release that adds new items (the library-scale importer's reviewed candidates once the independent review panel approves them); then the account library settings, pinning a release for search, paged listing, and the index-file and object-storage engines the 100,000 item measurement calls for.
  - id: S-6.63
    phase: 6
    title: An independent review panel of several model families
    status: building
    depends_on: [S-6.45]
    boundary: [tools/carry_catalogue_approvals.py, examples/29_intelligence_service/starter-catalogue/REVIEW.md]
    verify: ['reviewer engines behind one edge: Ollama Cloud models such as Kimi K3, GLM 5.3, DeepSeek, Qwen and MiniMax, the Codex command line and the Claude Code command line', 'deterministic pre-checks before any model call: file-level rights, native format, safety scan, effects, secrets and duplicates', 'approval needs three approving reviewers from three model families, none of them the author''s family, bound to the exact bytes and naming each reviewer', 'a frozen malicious and benign challenge set plus blinded, stratified human adjudication of real approvals and refusals, with an error gate by risk class before scale', 'a call ceiling, rate-limit pauses and a resumable cursor, with every call recorded']
    adversarial: An approval from the authoring family, an approval not bound to the reviewed bytes, a rights-ambiguous item, a panel that fails its measured error gate and a run that exceeds its declared ceiling must each be refused.
    acceptance: The panel reviews thousands of candidates only after its risk-specific error gate and throughput are measured; every approval names independent reviewers, and a sampled audit never grants approval to unsampled bytes.
    evidence: 'September 22 evening: owner direction for 10,000 items, multi-model review, managed releases of new files, and user settings with good defaults. September23 independent native calibration review verified five curated control observations but found two enforcement gaps: persisted exclusions could be removed and an author-family-skipped reviewer could enter a later candidate phase uncalibrated. Both are being repaired before any live native review or admission. The benign control also needs applicable native-loading qualification before a rejection can be treated as a false refusal. Evidence is in docs/verification/NATIVE-REVIEW-CALIBRATION-INDEPENDENT-QA-2026-09-23.md. Successor repair now closes both gaps plus an altered-prompt/recomputed-review-key gap, with 281 component checks, 79 combined checks, six removed guards and 19 independent focused checks passing (one optional dependency skip in the component suite). Panel export is v3 and calibration result v2; native ledger and hosted approval source are unchanged. See docs/verification/CALIBRATION-EXPORT-ELIGIBILITY-REPAIR-2026-09-23.md and docs/verification/NATIVE-REVIEW-CALIBRATION-INDEPENDENT-SUCCESSOR-QA-2026-09-23.md. The real pilot remains held for applicable benign-control native-loading evidence. September 24, 2026 (review throughput): the Codex reviewer pins its model and reads it back from the command line''s session record (protocol codex_exec_session; an unreported model is still refused); Claude reviews on the owner''s subscription with claude -p --safe-mode; the Tactical endpoint is a provider_binding reviewer; batched review asks up to 12 items per call with one verdict bound to each item''s digest; per-group call ceilings, a stop after repeated identical failures and collection below the quorum with a written reason. The main session set the quorum at two families and recorded the Verified and Community tiers in the AGENTS.md decision table (row Library tiers). Calibration: Claude rejected every known-wrong native control and approved the benign one, alike one at a time and in a mixed batch of 12; Tactical failed calibration on both profiles (3 of 4 native and 1 of 3 starter known-wrong controls approved), so it reviews no real candidate. Ollama Cloud stayed spent (four recorded probes) and Codex stays limited until September 29. Evidence: docs/verification/REVIEW-ENGINES-AND-BATCHING-2026-09-24.md and artifacts/review-throughput-2026-09-24/README.md.'
    next_local_work: "Calibrate Codex (after September 29) and the Ollama Cloud reviewers when their allowances return, then ask them as the second family for Community items so they can become Verified; teach the dated review record to read batch calls; keep one recorded allowance probe before every batch."
