    - id: D-26
      title: "Reach 10,000 and then 100,000 approved harness packages, then add 100 to 1,000 a day"
      stage: public_launch
      steps: [S-6.69, S-6.70, S-6.81, S-6.82, S-6.83, S-6.40, S-6.62, S-6.63, S-6.119, S-6.64, S-6.88]
