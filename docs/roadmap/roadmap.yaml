  SELF: "python -m loop_engine --self-test"
  HARD: "PYTHONPATH=devtools/src:src python -m loop_engine_devtools.cli --hardcoding-audit --allowlist devtools/hardcoding-allowlist.yaml --baseline devtools/hardcoding-ci-baseline.json --fail-on-new high --json"
  LINT: "documentation lint over docs, README.md, CHANGELOG.md, examples, case-studies, humanizer-context.md"
  MUTANT: "a mutant script that removes the behavior and confirms the named check fails"
