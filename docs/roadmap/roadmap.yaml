        - {id: D-26-T02, proof_level: local_contract, scenario: "Push one wave through pre-checks, the panel and a catalogue release bundle.", pass_condition: "Every released package has three approvals from non-producer families bound to its exact bytes.", negative_control: "A package approved by its producer's family must be refused."}
        - {id: D-26-T03, proof_level: operational_drill, scenario: "Run the serving probe at 100,000 approved rows on the live machine size.", pass_condition: "Search, listing and download meet the probe thresholds.", negative_control: "Lowering a threshold must fail the probe's own check."}
        - {id: D-26-T04, proof_level: local_contract, scenario: "Give a scout a skill under a restrictive licence.", pass_condition: "It produces an idea record and no copied text reaches a candidate.", negative_control: "A candidate whose text matches the restricted source must be refused."}
