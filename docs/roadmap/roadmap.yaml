  - id: S-6.100
    phase: 6
    title: "Decision stations around the build step: typed judgments with swappable engines, measured"
    status: building
    depends_on: [S-6.30, S-6.31]
    boundary: [src/loop_engine/core/decisions, src/loop_engine/data/engine_slots.yaml]
    verify:
      - "five stations of the step loop, each a typed question on decision_batch_request/v1 at its loop point: which files to read (a score over candidate chunks, before the step), which model gets the step (a choice among tiers, before the step), whether a command may run without a person (before each command), whether the task is done (read from fresh test output, not the agent's own summary, after the step) and whether a tool output is kept or dropped (a score, at compaction, so survivors stay verbatim)"
      - "swappable engines of the typed_decision slot behind each station, cheapest first: deterministic rules, local classifiers and rerankers, small models through the model gateway, constrained decoding, typed decision libraries, decision endpoints such as Jev, hosted services with enforced schemas, and a frontier fallback; a model-backed engine is unqualified until measured, and an engine that needs a key waits for one"
      - "an answer is admitted only as a typed answer, a confidence is never acceptance, an engine can only make a station stricter, and an irreversible command always waits for a person whatever an engine says"
      - "the typed decision edge returns the binding decision and, separately, advisory guidance that never binds, so a guidance engine can sit behind the same edge later"
      - "every station decision is recorded with its later outcome in the existing semantic decision and outcome records, so engines can be ranked by recorded evidence"
      - "each engine is measured per station on labeled sets built from repository evidence and synthetic cases labeled by rule, reporting accuracy, cost and latency with unknowns kept unknown"
    adversarial: "An irreversible command that an engine calls safe, an effect the step does not hold, a model-backed engine selected without a measured proof level, a confidence counted as an accepted outcome, advisory guidance that changes a binding decision, a harness hook that answers allow, a completion read from the agent's own summary instead of fresh test output, and a compaction that summarizes a kept output must each fail a named check, and each check must fail again when its guard is removed."
    acceptance: "At each station a step asks a typed question and binds the answer of the engine its policy declares, or the station's safe default when no engine answers; advisory guidance stays apart, no answer grants authority, every decision is joined to its outcome, and a per-station measurement names the cheapest engine that meets the station's declared accuracy floor."
    evidence: "September 24, 2026, the owner: \"What about research and further seperation and containerization, and swapable engines for reasonining and decision steps vs build step\". The owner later reported that Jev is full and TypeSafe has paused sign-ups, so the Jev adapter stays as it is, unqualified, and other engines behind the same contract come first. First slice, built and checked locally: the command safety station with the command risk policy (a parser that never runs what it reads), the in-process rules engine, the separate advisory guidance channel on the typed edge, the boundary decision station judgment, the command-safety command with a harness hook that only narrows, and 29 station checks in which every guard is also run with that guard removed. The slot's two planned checks are now existing checks. The run-time engine selector has not reached main, so stations use their declared order and record that dependency."
    next_local_work: "Add the four remaining stations with their engines (test-output parsers, lexical scoring and local rerankers, local classifiers trained on labeled decisions, the small-model and constrained-decoding engines, typed decision library adapters and hosted adapters that wait for a key), build the labeled sets from repository evidence, measure each engine per station on the Tactical server within its 300-call allowance, and write the prior-art research record. When the run-time engine selector reaches main, stations take their engine through it and write engine_selection_decision/v1."
