# Machine-readable roadmap. A development loop reads this file, picks the first
# step whose status is ready and whose dependencies are at least
# offline_verified, builds it, runs its verification, records the evidence path,
# and moves the status. Keep it in step with FABRIC-ROADMAP-2026-09-18.md.
