    - id: OWNER-03
      title: "Close the identity provider's back-door sign-up so that Baltor registration can open to everyone"
      phase: now
      depends_on: [OWNER-01]
      steps: [S-6.65, S-6.24, S-6.12]
      guide: docs/guides/launch-setup-runbook.md
      instructions:
        - "This does not close Baltor's sign-up. It closes the identity provider's own raw sign-up endpoint, a back door through which someone could create an account under another person's email with a password they chose. Baltor's email-first sign-up creates accounts through the administration interface and stays open to everyone."
        - "Quickest: in Claude Code run /mcp and sign in to the prepared baltor-supabase connection, so engineering can change the one setting and record it. Or, in the Supabase dashboard for the Baltor project, turn off the setting that allows new users to sign up through the provider."
        - "If neither happens, engineering builds a service-side guard instead (roadmap S-6.65): the service honours only accounts it created and replaces any provider-created account when the real person signs up, so registration can open without this action."
        - "Engineering then checks that the provider's public sign-up is refused and that Baltor's own sign-up still works, before registration opens."
      return_fields: ["Say that the prepared connection is signed in, or that the provider's own sign-up setting is off"]
      completion: "The provider's back-door sign-up is refused or neutralized by the service-side guard, Baltor's email-first sign-up works end to end for everyone, and registration is open under S-6.65."
      safety: A publishable application key, user access token and privileged server key have different authority. Never interchange them.
