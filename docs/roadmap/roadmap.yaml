  delivery_batches:
    - id: D-01
      title: Freeze the handoff and repair release blockers
      stage: initial_service
      steps: [S-6.17, S-6.26, S-6.27]
      depends_on: []
      actions:
        - Record the exact deployed image separately from the dirty working tree and preserve all unrelated changes.
        - Preserve the reviewed exact identity network registrations and recheck conformance after further changes; earlier failures remain in their original reports.
        - Review browser identity session lifetime, logout, duplicate account activation, provider outages, token audience and registration limits.
        - Review browser dependency licenses and include all required distribution notices.
        - Run focused checks and removed-guard controls before a frozen full-suite capture; do not reuse stale green reports.
        - "Record which files are being changed by each active developer and keep unrelated work outside the release batch."
        - "Bind each evidence artifact to the source, dependencies, host settings and exact test population it actually exercised."
        - "Classify a failed check as implementation, test or environment failure before repair; keep the original result and a discriminating control."
      acceptance: The exact candidate tree passes its declared local checks and conformance, with all failed attempts and untested provider journeys retained.
      adversarial: Removing audience validation, subject binding or network authority must fail a named check. Registering a module must not hide a real ungoverned call.
      authority_note: Local source and tests only. Deployment and publication require their own exact release decision.
      owning_paths: ["src/loop_engine/core/service_runtime/http_auth.py","src/loop_engine/forbidden_paths.json","tools/capture_architecture_checks.py"]
      rollback: "Keep the deployed image and configuration until the replacement passes. Preserve failed source snapshots and never reset the shared worktree."
      verification_cases:
        - id: D-01-T01
          proof_level: "source_review"
          scenario: "Review changed files and concurrent work before a release batch."
          pass_condition: "Every changed behavior has an owning boundary and resolved edit ownership."
          negative_control: "An unexplained dirty file cannot enter a publish command."
        - id: D-01-T02
          proof_level: "local_contract"
          scenario: "Remove issuer, audience or subject binding from identity validation."
          pass_condition: "The corresponding negative authentication test fails."
          negative_control: "A correctly signed token for another service must still be refused."
        - id: D-01-T03
          proof_level: "local_contract"
          scenario: "Remove an exact network registration or introduce an ungoverned call."
          pass_condition: "Conformance detects the boundary change without a broad exception."
          negative_control: "A loopback fixture does not authorize an external destination."
        - id: D-01-T04
          proof_level: "operational_drill"
          scenario: "Change a package file while a full check capture runs."
          pass_condition: "The report records source drift and is not used for release."
          negative_control: "A green subprocess exit alone cannot establish matching source."
        - id: D-01-T05
          proof_level: "source_review"
          scenario: "Review transitive browser and server dependency notices."
          pass_condition: "The distributed image contains the notices for its pinned dependencies."
          negative_control: "A top-level license alone does not satisfy a dependency with separate terms."
    - id: D-02
      title: Finish domain and authentication email
      stage: initial_service
      steps: [S-6.12, S-6.15, S-6.24]
      depends_on: []
      actions:
        - Reuse the created auth.baltor.ai sender, its exact records and the running verification request; confirm success before enabling authentication mail.
        - Reuse the approved Cloudflare write grant and existing Free zone; verify activation and all records without recreating resources.
        - Verify registry publication of the nameserver change already accepted by Namecheap. The owner confirms no existing mail or forwarding; preserve the old delegation in the rollback record.
        - Configure the exact website record and certificate, then exact identity redirects and private sender settings under a permitted management connection.
        - Test confirmation, recovery, expired and reused links, duplicate submissions, delivery failure and sender authentication with controlled recipients.
        - "Record authoritative and recursive DNS observations separately, including negative caching, DNSSEC state and certificate renewal."
        - "Add sender failure, suppression, bounce and complaint handling without storing raw account email content in general traces."
        - "Move canonical service and callback addresses only through an explicit migration that preserves accepted old connections until their retirement."
      acceptance: The chosen hostname and sender work through the real customer path without disrupting existing website or mail behavior.
      adversarial: A missing management permission, wrong host, unverified sender or unknown DNS-change outcome prevents a readiness claim and triggers reconciliation.
      authority_note: Existing pilot limits apply. Registrar and Cloudflare write access are authorized. Supabase authentication-settings access remains a separate permission gap; do not bypass refusals.
      owning_paths: ["docs/guides/launch-setup-runbook.md","tools/operator_credentials.py","src/loop_engine/core/service_runtime/browser_identity.py"]
      rollback: "Keep the verified Fly origin available. Reconcile uncertain DNS writes before retrying and never restore obsolete mail records without review."
      verification_cases:
        - id: D-02-T01
          proof_level: "real_provider"
          scenario: "Read the registrar, registry and both authoritative DNS servers."
          pass_condition: "All identify the intended delegation and exact website and sender records."
          negative_control: "A cached recursive answer cannot establish the registrar state."
        - id: D-02-T02
          proof_level: "real_provider"
          scenario: "Verify all advertised hostnames with ordinary HTTPS clients."
          pass_condition: "Hostname validation succeeds and the served source matches the candidate image."
          negative_control: "An insecure TLS bypass or pinned-address probe alone is insufficient."
        - id: D-02-T03
          proof_level: "end_to_end"
          scenario: "Deliver confirmation and recovery messages to controlled recipients."
          pass_condition: "The intended recipient receives a valid, expiring link for the selected environment."
          negative_control: "A verified sender domain alone is not proof of inbox delivery."
        - id: D-02-T04
          proof_level: "real_provider"
          scenario: "Expire, reuse or change a confirmation or recovery link."
          pass_condition: "The provider and application refuse the changed or consumed authority."
          negative_control: "A forged tenant claim or redirect cannot grant another account."
        - id: D-02-T05
          proof_level: "operational_drill"
          scenario: "Interrupt sender or DNS configuration after a possible write."
          pass_condition: "Read-back establishes the outcome before another mutation."
          negative_control: "Repeating an unknown write or silently changing providers fails the drill."
    - id: D-03
      title: Connect customer accounts and client access
      stage: initial_service
      steps: [S-6.5, S-6.12, S-6.24]
      depends_on: [D-01, D-02]
      actions:
        - Exercise the real identity provider with two ordinary test identities and server-owned tenant creation.
        - Complete confirmation, password recovery, session expiry, logout and account-disable behavior without accepting editable tenant metadata.
        - Add scoped self-service client credentials through the existing access boundary, with short lifetime, one-time display and revocation.
        - Qualify native client authorization separately from browser sign-in; never accept a generic browser audience as the service resource audience.
        - Test account switching, delayed responses, concurrent activation, request limits and two supported client implementations.
        - "Require a verified browser session for personal credential management; service tokens cannot mint more credentials or delegate billing and administration."
        - "Bind personal tokens to their issuing subject, account state, explicit scopes and expiry; cap active tokens and retained token history."
        - "Test logout during pending reads and writes, provider outages, account disablement and subject revocation without leaking stale results."
      acceptance: A new customer signs in, obtains only permitted client access and loses that access when revoked, across browser and native clients.
      adversarial: Cross-tenant requests, old sessions, anonymous identities, server keys in browsers and repeated activation cannot restore or expand authority.
      authority_note: Disposable test identities and exact selected project only. No opening public registration before delivery and abuse controls work.
      owning_paths: ["src/loop_engine/core/service_runtime/access.py","src/loop_engine/core/service_runtime/runtime.py","src/loop_engine/core/service_runtime/http_auth.py","src/loop_engine/core/service_runtime/web_assets/client-access.js"]
      rollback: "Disable new account admission or personal token issuance independently. Keep existing revocation records and do not restore discarded secrets."
      verification_cases:
        - id: D-03-T01
          proof_level: "end_to_end"
          scenario: "Two verified customers create and revoke their own client credentials."
          pass_condition: "Each token authenticates only its server-assigned account and is shown once."
          negative_control: "Supplying another tenant or using a service token to mint must fail."
        - id: D-03-T02
          proof_level: "local_contract"
          scenario: "Race two requests against the last available token slot."
          pass_condition: "At most one credential commits under the tenant quota."
          negative_control: "Removing the transaction guard must expose the excess issue."
        - id: D-03-T03
          proof_level: "local_contract"
          scenario: "Lose the write acknowledgment and retry the same request identity."
          pass_condition: "The existing result reconciles without another key or recovered plaintext."
          negative_control: "Changing scope or label under that identity must fail."
        - id: D-03-T04
          proof_level: "end_to_end"
          scenario: "Sign out while a credential response is delayed."
          pass_condition: "Local data clears immediately and the late result cannot repopulate the page."
          negative_control: "The test must hold a real response, not only clear a static form."
        - id: D-03-T05
          proof_level: "real_provider"
          scenario: "Disable an account or revoke its mapped subject."
          pass_condition: "New management requests and linked client tokens lose authority within the declared revocation policy."
          negative_control: "Browser logout alone must not be misreported as revoking all independent client tokens."
    - id: D-04
      title: Complete sandbox subscriptions
      stage: initial_service
      steps: [S-6.21, S-6.12, S-6.16]
      depends_on: [D-01, D-03]
      actions:
        - Bind all test operations to the approved Baltor sandbox account and privately stored runtime test credential.
        - Create the test product, recurring Price and portal settings with idempotency and reconcile uncertain outcomes.
        - Implement server-owned customer creation through the existing billing boundary; customers cannot choose another customer's identifier.
        - Register the exact test webhook and separate signing-secret reference; complete periodic reconciliation and outage recovery.
        - Exercise activation, failed payment, cancellation, reactivation, duplicate and reordered events, and access revocation in website and client requests.
        - "Separate customer creation, checkout session creation, subscription state and material entitlement, with durable identities for each effect."
        - "Handle multiple subscriptions, changed prices, trials, refunds and payment disputes through explicit owner-approved entitlement policy."
        - "Verify checkout return and cancellation destinations against configured origins; never accept a browser-supplied customer, Price or redirect."
      acceptance: One complete real test-mode subscription lifecycle changes the same durable entitlement used by both transports.
      adversarial: A checkout redirect, forged event, wrong account, old success event or lost response cannot grant access or create duplicate customer actions.
      authority_note: Test mode only. Public prices, terms and live customer charging remain owner decisions.
      owning_paths: ["src/loop_engine/core/service_runtime/billing.py","src/loop_engine/core/service_runtime/stripe_sessions.py","src/loop_engine/core/service_runtime/stripe_provider.py"]
      rollback: "Keep live charging disabled. Preserve provider identifiers and reconcile payments before restoring an older application or entitlement projection."
      verification_cases:
        - id: D-04-T01
          proof_level: "real_provider"
          scenario: "Create a disposable customer and subscription in the selected Stripe sandbox."
          pass_condition: "Account identity and test mode match every stored provider object."
          negative_control: "A different sandbox or live-mode response must be refused."
        - id: D-04-T02
          proof_level: "end_to_end"
          scenario: "Complete test checkout, cancel and reactivate a subscription."
          pass_condition: "The same durable entitlement governs browser and client delivery."
          negative_control: "A success redirect without verified provider state grants nothing."
        - id: D-04-T03
          proof_level: "local_contract"
          scenario: "Deliver duplicate and reordered signed events."
          pass_condition: "Current provider state wins and every event identity remains traceable."
          negative_control: "An older paid event cannot restore canceled access."
        - id: D-04-T04
          proof_level: "real_provider"
          scenario: "Lose a customer or session creation response."
          pass_condition: "A durable idempotency identity prevents duplicate effects during reconciliation."
          negative_control: "A new random request identity is not an acceptable automatic retry."
        - id: D-04-T05
          proof_level: "operational_drill"
          scenario: "Pause webhook processing and resume with periodic reconciliation."
          pass_condition: "Missed changes are recovered without expanding grants or discarding failures."
          negative_control: "A healthy webhook endpoint with a stuck reconciliation queue fails readiness."
    - id: D-05
      title: Connect cloud records, files and retrieval
      stage: initial_service
      steps: [S-6.4, S-6.5, S-6.6]
      depends_on: [D-01]
      actions:
        - Implement PostgreSQL behind the existing catalogue transaction contract, including read-set guards and unknown-commit reconciliation.
        - Create the private bucket under the existing project; map immutable references to exact bytes without a second source of truth.
        - Add one versioned semantic embedding profile beside exact and lexical retrieval; separate filters, candidate generation, fusion and optional ranking.
        - Preserve missing-feature and incompatible-embedding-space states, deletion, grant revocation and index rebuild behavior.
        - Measure permission-filtered recall, search and delivery latency, cold starts, payload sizes and concurrency on a declared corpus.
        - "Define migration rehearsal, cutover, rollback and consistency checks before replacing the live SQLite authority."
        - "Keep index projections rebuildable and file objects immutable; record versions, deletion state and access decisions outside provider-owned indexes."
        - "Test object size limits, partial transfers, expiry, cache isolation and tampered bytes across inline, streamed and signed delivery."
      acceptance: Two tenants retrieve only permitted exact revisions through real shared-state and storage adapters; search indexes can be rebuilt from authoritative records.
      adversarial: Stale grants, cross-tenant caches, wrong digests, partial writes, leaked signed URLs and missing embedding features must refuse or remain explicitly unavailable.
      authority_note: Existing project and pilot allowance only. No extra search cluster or model embedding calls without exact authority.
      owning_paths: ["src/loop_engine/catalog/protocol.py","src/loop_engine/catalog/stores/sqlite_store.py","src/loop_engine/core/service_runtime/storage.py","src/loop_engine/core/service_runtime/provisioning.py"]
      rollback: "Retain the authoritative source and a verified export. Stop writes during an unresolved cutover; do not run divergent stores as simultaneous authorities."
      verification_cases:
        - id: D-05-T01
          proof_level: "local_contract"
          scenario: "Run identical catalogue transactions against each supported store."
          pass_condition: "Read-set guards, unique ownership and commit acknowledgments preserve the same semantics."
          negative_control: "An adapter without atomic batch support must refuse mutation."
        - id: D-05-T02
          proof_level: "real_provider"
          scenario: "Store and fetch selected immutable objects in a private bucket."
          pass_condition: "Bytes and digests match and anonymous retrieval fails."
          negative_control: "A public bucket or permanent bearer URL fails qualification."
        - id: D-05-T03
          proof_level: "end_to_end"
          scenario: "Revoke a grant after search but before object delivery."
          pass_condition: "Delivery reauthorizes and refuses the stale selection."
          negative_control: "A cached search result cannot preserve revoked access."
        - id: D-05-T04
          proof_level: "operational_drill"
          scenario: "Rebuild the search projection and rehearse a store migration."
          pass_condition: "Counts, identities, grants and exact revisions reconcile before cutover."
          negative_control: "An index match count alone cannot establish data completeness."
        - id: D-05-T05
          proof_level: "held_out_comparison"
          scenario: "Compare retrieval on a frozen permission-scoped corpus."
          pass_condition: "Report recall, latency, payload size, exclusions and missing embedding features."
          negative_control: "Character similarity cannot be labeled learned semantic retrieval."
    - id: D-06
      title: Prove selected material reaches each step
      stage: core_proof
      steps: [S-6.1, S-6.2, S-6.7, S-6.9]
      depends_on: [D-01, D-05]
      actions:
        - Connect search, selection, authorized download and digest verification through the existing provisioner.
        - Resolve required dependencies and compile a versioned native layout for one named client version.
        - Record offered, selected, downloaded, placed, loaded and used material separately, including inherited user-level instructions and truncation.
        - Compare useful material with withheld, changed and malicious material; preserve relevant limits across a permitted harness change.
        - Run one complete task through independent verification and preserve the exact files and outputs consumed by each step.
        - "Resolve dependency closure, license state, executable effects and layout compatibility before writing a selected bundle."
        - "Give instructions, reusable material, writable outputs and host-owned authority separate filesystem scopes."
        - "Track inherited configuration, actual discovery, truncation and use independently from successful download and placement."
      acceptance: A supported client demonstrably loads selected material and completes a checked task; file presence and connection success are insufficient.
      adversarial: Disabled discovery, incompatible native versions, traversal, symbolic links, unexpected inherited instructions and missing required files must be detected.
      authority_note: Offline preparation can proceed now. Model-backed task proof needs an exact model-call allowance, including for local inference.
      owning_paths: ["src/loop_engine/core/node_provisioning.py","src/loop_engine/core/instance_instructions.py","src/loop_engine/core/harness_process.py"]
      rollback: "Keep exact prior bundles and outputs. Stop before execution if the compiled layout or permission boundary cannot be verified."
      verification_cases:
        - id: D-06-T01
          proof_level: "end_to_end"
          scenario: "Materialize an exact selected bundle into one supported native client."
          pass_condition: "Observed loading identifies every required revision and its declared native path."
          negative_control: "A file existing on disk without loading evidence is not a pass."
        - id: D-06-T02
          proof_level: "local_contract"
          scenario: "Try traversal, symbolic links, archive escapes and conflicting paths."
          pass_condition: "Preparation refuses before overwriting or exposing unrelated files."
          negative_control: "A friendly filename cannot replace path confinement."
        - id: D-06-T03
          proof_level: "end_to_end"
          scenario: "Compare useful material with withheld, changed and misleading material."
          pass_condition: "Independent checks distinguish actual use and task effect."
          negative_control: "A model claiming it read the material is not sufficient evidence."
        - id: D-06-T04
          proof_level: "local_contract"
          scenario: "Resolve a missing dependency or incompatible native layout."
          pass_condition: "The response names the unsupported requirement without silently dropping it."
          negative_control: "A fallback cannot replace an exact contract with prose."
        - id: D-06-T05
          proof_level: "operational_drill"
          scenario: "Interrupt preparation or change harness after a failed attempt."
          pass_condition: "The manifest, outputs and consumed authority remain bound and recoverable."
          negative_control: "A new process cannot erase a previous effect or renew its budget."
    - id: D-07
      title: Qualify overnight local work and recovery
      stage: core_proof
      steps: [S-6.8, S-6.9, S-6.24, S-6.13]
      depends_on: [D-01, D-06]
      actions:
        - Connect an existing local model endpoint and one supported development tool; record hardware, model identity, context capacity and effective settings.
        - Bind resource admission, scoped credential use and cancellation to the existing process lifetime owner.
        - Compare fresh processes, retained workers and trust-group sandboxes; do not require a separate operating-system image for every step or assume Python for every tool.
        - Persist work and remaining limits across process crash, machine restart, sleep, network loss and unavailable model service; uncertain effects require reconciliation.
        - Test a declared overnight duration with multiple real task types, an independently checked result and a morning report that distinguishes complete, blocked and unfinished work.
        - "Set explicit maximum running processes, memory reservations, disk use, output growth and slow-consumer behavior for each supported execution profile."
        - "Keep external model serving separate from worker placement; accept user-operated endpoints without taking ownership of their model processes."
        - "Test operating-system-specific shutdown, signal handling and checkpoint restoration with the same declared task authority."
      acceptance: A named local configuration performs bounded unattended work and resumes or stops honestly, without hidden cloud-model fallback or repeated external effects.
      adversarial: Lost contact cannot free reserved capacity, a restart cannot reset the budget, and a failed verifier cannot be reported as overnight completion.
      authority_note: Model calls remain disabled until approved. Existing endpoints are user-operated; this does not authorize installing weights or launching model servers.
      owning_paths: ["src/loop_engine/core/local_resources.py","src/loop_engine/core/instance_hibernation.py","src/loop_engine/core/credential_leases.py","src/loop_engine/loop/delegation_runtime.py"]
      rollback: "Stop new admissions, reconcile active effects and retain checked work. Resume only a supported checkpoint with the original remaining authority."
      verification_cases:
        - id: D-07-T01
          proof_level: "end_to_end"
          scenario: "Run the declared unattended duration on a real local endpoint."
          pass_condition: "The final report distinguishes accepted, provisional and unfinished work."
          negative_control: "Local execution with hidden remote inference fails the local-model claim."
        - id: D-07-T02
          proof_level: "operational_drill"
          scenario: "Restart after a process crash, machine sleep or network interruption."
          pass_condition: "Safe work resumes without duplicated effects or lost output identities."
          negative_control: "A new attempt with reset time or token allowance fails."
        - id: D-07-T03
          proof_level: "local_contract"
          scenario: "Cancel a worker that still owns descendants or reservations."
          pass_condition: "Capacity is released only after observed termination."
          negative_control: "Sending a signal alone cannot count as stopped execution."
        - id: D-07-T04
          proof_level: "held_out_comparison"
          scenario: "Compare fresh processes, warm workers and shared trust-group sandboxes."
          pass_condition: "Measure whole-task memory, startup, cost, cancellation and isolation."
          negative_control: "A cheaper shared environment that leaks another task's files is ineligible."
        - id: D-07-T05
          proof_level: "real_provider"
          scenario: "Lose an optional decision or model endpoint during work."
          pass_condition: "The configured refusal or authorized fallback is recorded distinctly."
          negative_control: "No undeclared provider, model server or paid route is started."
    - id: D-08
      title: Build useful expertise and reusable outputs
      stage: core_proof
      steps: [S-6.10, S-6.20, S-6.11, S-6.23]
      depends_on: [D-05, D-06]
      actions:
        - Select a small useful starter population across the four persistent intelligence layers, with licenses, provenance and coverage gaps recorded.
        - Independently review the existing twelve candidate records; distinguish code reference cards from executable packages.
        - Add expert methods, mistakes, constraints, code and example outputs where actual task coverage is missing, through existing catalogue writes.
        - Exercise bounded generation, review, promotion, later-task retrieval and withdrawal; a generator cannot approve its own work.
        - Export an accepted solution into a clean environment and run fresh inputs without the builder conversation or undeclared dependencies.
        - "Specify applicability, contraindications, version validity and dependency limits for each reusable item rather than promoting generic descriptions."
        - "Preserve rejected candidates and corrective findings so later retrieval can distinguish failure evidence from approved guidance."
        - "Bind consumer feedback to the exact item and output revision used; never overwrite a consumed result with a later improvement."
      acceptance: Reviewed material helps a declared task population, and at least one accepted solution is independently reusable on changed inputs.
      adversarial: A mislabeled generic file, incompatible dependency, changed source, unsupported license or builder-only test cannot qualify a package.
      authority_note: Distribution rights and independent review are required. No automatic promotion or bulk model generation under the zero-call allowance.
      owning_paths: ["src/loop_engine/core/code_intelligence_assets.py","src/loop_engine/core/reusable_capability_flywheel.py","src/loop_engine/code_nodes/solution_export.py"]
      rollback: "Withdraw a bad item by lifecycle state and keep its history. Restore an approved prior revision only after current rights and compatibility checks."
      verification_cases:
        - id: D-08-T01
          proof_level: "source_review"
          scenario: "Review the starter population across all four persistent layers."
          pass_condition: "Each item has a responsible source, rights, purpose and explicit qualification state."
          negative_control: "A Markdown format or vector representation is not a new intelligence layer."
        - id: D-08-T02
          proof_level: "end_to_end"
          scenario: "Use a reviewed item in a fresh task and export the result."
          pass_condition: "The consumer records the exact revision and independently checked outcome."
          negative_control: "Retrieval rank or placement alone cannot establish benefit."
        - id: D-08-T03
          proof_level: "local_contract"
          scenario: "Attempt to promote a producer's own generated candidate."
          pass_condition: "The separate review requirement prevents activation."
          negative_control: "A high model confidence or passing producer test cannot waive review."
        - id: D-08-T04
          proof_level: "operational_drill"
          scenario: "Withdraw an item after a license or correctness finding."
          pass_condition: "Future selection refuses it while previous consumption records remain intact."
          negative_control: "Deleting history to hide an earlier bad result fails the record contract."
        - id: D-08-T05
          proof_level: "end_to_end"
          scenario: "Run an exported solution on changed inputs in a clean environment."
          pass_condition: "Declared dependencies and checks suffice without the builder conversation."
          negative_control: "Undeclared local files or cached credentials must not make the example pass."
    - id: D-09
      title: Measure token savings and context usefulness
      stage: core_proof
      steps: [S-6.3, S-6.6, S-6.19, S-6.23]
      depends_on: [D-06, D-08]
      actions:
        - Capture each physical model attempt exactly once across retries, helpers and native sessions, with unknown usage kept unknown.
        - Freeze matched tasks, evaluator, quality tolerance, model and non-treatment settings before measuring changes.
        - Compare selected versus full, insufficient, expanded and misleading context, and code reuse versus generation where both meet the task.
        - Report input, cached input, output, reasoning usage when available, cost, elapsed time, memory and failures separately; include retrieval and verification overhead.
        - Use repeated trials and uncertainty estimates; record task-specific regressions, withheld cases and the exact limits of any public claim.
        - "Track retrieval, feature generation, model startup, context transfer, execution, retries and verification in the same route-cost accounting."
        - "Separate optimization search cost from later serving savings and report the workload needed to recover that investment."
        - "Predeclare quality floors and task-group regression limits; publish absolute outcomes and uncertainty as well as relative savings."
      acceptance: A source-bound report can support or reject each launch benefit without changing the quality standard to make savings appear.
      adversarial: Dropped failed calls, missing usage treated as zero, cheaper unfinished work, mismatched models and evaluation-set tuning invalidate the comparison.
      authority_note: No benchmark model calls are authorized by writing this plan. Telemetry defaults to structural records; content reuse requires separate consent.
      owning_paths: ["src/loop_engine/core/model_gateway.py","src/loop_engine/core/model_call_records.py","src/loop_engine/core/run_history.py","src/loop_engine/core/stage_evidence_records.py"]
      rollback: "Keep the prior qualified policy and raw observations. Reject unsupported claims rather than repairing the held-out benchmark from its own failures."
      verification_cases:
        - id: D-09-T01
          proof_level: "held_out_comparison"
          scenario: "Compare complete routes on frozen tasks and independently checked outputs."
          pass_condition: "Include useful outcomes, failures, confidence intervals and all charged work."
          negative_control: "A lower bill caused by unfinished tasks fails the capability floor."
        - id: D-09-T02
          proof_level: "local_contract"
          scenario: "Omit usage from one physical call or count a retry twice."
          pass_condition: "Accounting reports missing or duplicate evidence explicitly."
          negative_control: "Unknown cost cannot become zero."
        - id: D-09-T03
          proof_level: "held_out_comparison"
          scenario: "Vary selected, expanded, insufficient and misleading context."
          pass_condition: "Record both improvements and regressions by task group."
          negative_control: "Minimum context is not assumed to be universally optimal."
        - id: D-09-T04
          proof_level: "source_review"
          scenario: "Review a proposed public efficiency claim."
          pass_condition: "Its task population, source, model, harness, evaluator and limitations are traceable."
          negative_control: "Borrowed vendor percentages do not become Baltor results."
        - id: D-09-T05
          proof_level: "operational_drill"
          scenario: "Discover leakage between search tasks and evaluation tasks."
          pass_condition: "The affected result is invalidated and the frozen split remains unchanged."
          negative_control: "A repaired candidate cannot reuse the same exposed holdout as independent proof."
    - id: D-10
      title: Simplify the website and finish customer journeys
      stage: initial_service
      steps: [S-6.12, S-6.24, S-6.22]
      depends_on: [D-03, D-04]
      actions:
        - Use Baltor, task, step, model, tools and results on public pages; keep runtime names in technical documentation and GitHub.
        - Keep How it works focused on the example and benefits, with a short honest pilot limitation instead of a runtime taxonomy.
        - Complete sign-in, account, client setup, first successful retrieval, usage, access revocation, billing and clear failure states.
        - Check keyboard navigation, small screens, enlarged text, loading races and expired sessions; test whether a new reader understands the page.
        - Plan public documentation, examples and approved showcase subdomains without presenting an unconfigured docs hostname as live.
        - "Show connection, authentication, material loading, task success and subscription state as separate observable stages."
        - "Make one-time secrets, ambiguous outcomes, expired links, empty results and unavailable features understandable without support intervention."
        - "Compare public pages and setup journeys against the existing competitor matrix without copying claims or hiding current product limits."
      acceptance: A new user can understand the product and complete the supported journey without knowing internal architecture terms or copying a secret into the wrong field.
      adversarial: Hidden unfinished features, misleading benefit claims, missing error recovery and technical vocabulary leaking into public explanations fail the page review.
      authority_note: Copy can be improved independently. Public deployment must use a qualified exact source; no customer testimonials or performance numbers may be invented.
      owning_paths: ["src/loop_engine/core/service_runtime/web_assets","docs/guides/product-style-guide.md","tools/check_service_workspace.mjs"]
      rollback: "Retain the last qualified customer interface and feature flags. Disable an incomplete flow visibly instead of leaving a working-looking control."
      verification_cases:
        - id: D-10-T01
          proof_level: "end_to_end"
          scenario: "A new reader completes the declared account and client journey."
          pass_condition: "They can identify the next action without internal runtime vocabulary."
          negative_control: "A static mock control or undocumented manual workaround fails."
        - id: D-10-T02
          proof_level: "local_contract"
          scenario: "Display malicious labels, retrieved text and provider errors."
          pass_condition: "The page renders text without script execution or credential disclosure."
          negative_control: "Unsafe HTML insertion must be detected."
        - id: D-10-T03
          proof_level: "end_to_end"
          scenario: "Use keyboard-only navigation, narrow screens and enlarged text."
          pass_condition: "All required controls remain operable and readable."
          negative_control: "A desktop screenshot alone cannot establish accessibility."
        - id: D-10-T04
          proof_level: "local_contract"
          scenario: "Switch accounts while responses are delayed."
          pass_condition: "Late results cannot reveal or modify the previous account's state."
          negative_control: "Clearing labels without aborting or invalidating requests fails."
        - id: D-10-T05
          proof_level: "source_review"
          scenario: "Review homepage benefits, docs and showcase examples."
          pass_condition: "Every current claim has matching evidence or a clear qualification limit."
          negative_control: "An illustrative task must not look like a recorded successful customer run."
    - id: D-11
      title: Exercise operations and make the release decision
      stage: public_launch
      steps: [S-6.14, S-6.15, S-6.16, S-6.6, S-6.13]
      depends_on: [D-02, D-03, D-04, D-05, D-06, D-08, D-10, D-13, D-14, D-15, D-16]
      actions:
        - Freeze the exact source, image, database migration and host settings; run clean installation, full checks, examples and real customer journeys.
        - Test backup, restored revocations, rollback, secret rotation, payment reconciliation, abuse limits, tenant deletion and retention.
        - Establish alerts, support contact, incident ownership and a tested maintenance path; record single-machine availability limitations.
        - Review security boundaries, dependencies, license obligations, privacy settings, terms, cancellation and public claims.
        - Obtain the separate paid-release decision and publish only reviewed source under explicit commit and push authority.
        - "Define the supported pilot contract separately from optional research engines and later enterprise features."
        - "Require exact evidence for every release gate and an explicit owner decision for live charging and source publication."
        - "Rehearse a failed release with account and payment state changing during rollback, not only a clean image replacement."
      acceptance: Every required launch gate has current reviewed evidence, a supported-customer scope and a rehearsed recovery path; otherwise remain a named private pilot.
      adversarial: A health check, account connection, plan checkbox or old test count cannot stand in for the complete release record.
      authority_note: No live charges or source publication without owner approval. An overnight or savings claim additionally requires D-07 or D-09 respectively.
      owning_paths: ["Dockerfile.service","fly.toml",".github/workflows/fly-pilot.yml","tools/check_pilot_backup_restore.py"]
      rollback: "Pause admission and writes where necessary, restore a compatible image and reconcile newer revocations and payment state before serving protected material."
      verification_cases:
        - id: D-11-T01
          proof_level: "operational_drill"
          scenario: "Deploy and roll back a frozen candidate with matching settings."
          pass_condition: "The expected image, schema and configuration are observed after each transition."
          negative_control: "A rollback that resurrects revoked access fails."
        - id: D-11-T02
          proof_level: "end_to_end"
          scenario: "Complete the supported journey from a clean customer environment."
          pass_condition: "Account, client access, retrieval, execution, acceptance and revocation have actual evidence."
          negative_control: "A collection of unrelated component checks cannot substitute."
        - id: D-11-T03
          proof_level: "source_review"
          scenario: "Review all launch gates against their source identities."
          pass_condition: "Every required gate has current independent review or remains open."
          negative_control: "A plan checkbox or an expired green report cannot approve release."
        - id: D-11-T04
          proof_level: "operational_drill"
          scenario: "Restore while subscription or credential state changed after backup."
          pass_condition: "Fresh authority is reconciled before protected delivery resumes."
          negative_control: "Restoring old database bytes alone is insufficient."
        - id: D-11-T05
          proof_level: "real_provider"
          scenario: "Inspect the final selected accounts, region and charging mode."
          pass_condition: "They match approved limits and live charging remains separately authorized."
          negative_control: "A configured test Price must never silently become a live offer."
    - id: D-12
      title: Continue interchangeable engines and governed improvement
      stage: continued_improvement
      steps: [S-6.18, S-6.19, S-6.22, S-6.25]
      depends_on: [D-01]
      actions:
        - Review exact, hybrid and bounded agentic retrieval profiles behind the same reference-first interface; qualify challengers only for demonstrated gaps.
        - Compare configured decision endpoints, including Jev, Circuit and a separately specified SemIf score adapter, without assuming confidence is calibrated.
        - Keep SoL-Pi mechanisms optional within the existing harness boundary; compare whole-task quality, cost and omission failures before promotion.
        - Compare direct requests, scripted browsers and native tool access under the same permission and outcome rules.
        - Stage proposed routing, context and intelligence changes for independent replay and review, with rollback and the existing learned-adoption policy preserved.
        - "Record each engine's license, supported protocol, actual feature coverage, initialization cost and unavailable states in configuration."
        - "Compare configured preference with learned selection, keeping confidence calibration, downstream utility and factual verification distinct."
        - "Preserve one owner for retries, cancellation and cumulative budgets across nested wrappers and native harness controls."
      acceptance: New engines replace implementations at existing typed boundaries without new runtimes, stores or silent authority changes; supported combinations have specific evidence.
      adversarial: Incompatible handshakes, invented conversion rules, tenant-leaking learning, self-promotion and cheaper but lower-quality routes must not become defaults.
      authority_note: Research and offline adapters can proceed independently; provider experiments, automatic adoption and external outreach need their own authority.
      owning_paths: ["src/loop_engine/core/retrieval_backends.py","src/loop_engine/core/decisions","src/loop_engine/core/harness_semantic.py","src/loop_engine/core/harness_layering.py"]
      rollback: "Retain the last qualified engine profile and stop on unsupported semantics. Never invent protocol conversions or reset authority during fallback."
      verification_cases:
        - id: D-12-T01
          proof_level: "local_contract"
          scenario: "Negotiate versions, schemas and optional features at initialization."
          pass_condition: "The selected binding is explicit and checked again at use."
          negative_control: "Equal vector dimensions or similar field names do not establish compatibility."
        - id: D-12-T02
          proof_level: "real_provider"
          scenario: "Call an owner-configured decision endpoint with typed alternatives."
          pass_condition: "Actual provider output, uncertainty and usage remain distinct from verification."
          negative_control: "No canned result is substituted for a failed call."
        - id: D-12-T03
          proof_level: "held_out_comparison"
          scenario: "Evaluate a retrieval or harness challenger on matched tasks."
          pass_condition: "Whole-route quality, cost, startup and failure behavior determine eligibility."
          negative_control: "A vendor benchmark or low token count alone cannot promote the engine."
        - id: D-12-T04
          proof_level: "local_contract"
          scenario: "Race native and outer retries or cancellation."
          pass_condition: "One policy owns the transition and each physical call is counted once."
          negative_control: "Nested wrappers cannot multiply attempts or duplicate an uncertain effect."
        - id: D-12-T05
          proof_level: "held_out_comparison"
          scenario: "Promote and later roll back a candidate improvement."
          pass_condition: "Independent evidence, consent scope and the existing adoption threshold are enforced."
          negative_control: "Production interactions cannot directly rewrite global policy."
    - id: D-13
      title: "Qualify execution and service security boundaries"
      stage: core_proof
      steps: ["S-6.8","S-6.9","S-6.14","S-6.24"]
      depends_on: ["D-01","D-03","D-06"]
      actions:
        - "Write a threat model for browser accounts, service tokens, retrieved material, plugins, local workers and operator infrastructure access."
        - "Separate trusted control state and credential brokers from model-editable workspaces and retrieved instructions."
        - "Test filesystem, archive, network, process and resource confinement for each supported isolation profile."
        - "Make prompt injection and malicious tool output tests cross the actual retrieval-to-execution path."
        - "Apply request limits, exact origins, redirect refusal and destination checks at the existing transport boundaries."
        - "Review package installation, executable dependencies and native user-level configuration before allowing a harness profile."
        - "Document credential rotation, account revocation and incident containment without exporting raw secrets."
        - "Keep unsupported sandbox, provider and protocol combinations unavailable instead of silently weakening isolation."
      acceptance: "The supported client and service profiles withstand declared adversarial cases without crossing tenant, workspace, credential or effect boundaries."
      adversarial: "Malicious retrieved instructions, a forged principal, a symbolic-link escape or a stale approval cannot expand authority."
      authority_note: "Security fixtures and isolated local checks are permitted; no attack on unrelated infrastructure or unapproved external service is authorized."
      owning_paths: ["src/loop_engine/core/action_fence.py","src/loop_engine/loop/effect_approval.py","src/loop_engine/core/workspace_contracts.py","src/loop_engine/core/service_runtime/http.py"]
      rollback: "Disable the affected capability or admission path while preserving evidence. Do not replace a failed sandbox with raw-host execution."
      verification_cases:
        - id: D-13-T01
          proof_level: "end_to_end"
          scenario: "Retrieve a malicious instruction or plugin candidate."
          pass_condition: "It remains untrusted and cannot acquire tools, secrets or network permission."
          negative_control: "A label claiming approval must not alter authority."
        - id: D-13-T02
          proof_level: "local_contract"
          scenario: "Forge tenant, subject, origin and permission fields."
          pass_condition: "Typed authentication and current grants refuse the request."
          negative_control: "A signed token with editable tenant metadata still fails."
        - id: D-13-T03
          proof_level: "operational_drill"
          scenario: "Cancel untrusted code with descendants and open handles."
          pass_condition: "Owned processes stop and unrelated work remains intact."
          negative_control: "Killing by a shared process name is not acceptable cleanup."
        - id: D-13-T04
          proof_level: "local_contract"
          scenario: "Attempt path, archive, symlink and redirect escapes."
          pass_condition: "The exact boundary refuses before the effect."
          negative_control: "Passing a harmless filename test is not a substitute for adversarial paths."
        - id: D-13-T05
          proof_level: "operational_drill"
          scenario: "Contain a leaked test credential and restore service."
          pass_condition: "Revocation is durable, rotation is scoped and records contain no secret values."
          negative_control: "A restored snapshot cannot reactivate the leaked credential."
    - id: D-14
      title: "Operate intelligence ingestion, review and withdrawal"
      stage: core_proof
      steps: ["S-6.4","S-6.10","S-6.11","S-6.20","S-6.23"]
      depends_on: ["D-05","D-06"]
      actions:
        - "Define the supported source formats, size limits, provenance fields and trust classifications for intake."
        - "Preserve immutable source revisions, license evidence and dependency identities before extraction or chunking."
        - "Stage imported and generated material through existing catalogue contracts with candidate-only lifecycle state."
        - "Keep prompts, skills, contracts, code packages and history distinct as content families within the four persistent layers."
        - "Route semantic review and executable verification to an independent process with a fixed subject digest."
        - "Track applicability, freshness, contradictions and withdrawal reasons without silently rewriting consumed history."
        - "Propagate deletion and revocation to indexes, caches and delivery while preserving legally permitted audit metadata."
        - "Build a useful starter population from real task gaps and measure coverage rather than the number of generated files."
      acceptance: "Every served starter item has traceable rights, exact bytes, an appropriate review basis and a tested withdrawal path."
      adversarial: "Leaked proprietary prompts, poisoned context, stale licenses and producer-approved executable packages must not enter the active catalogue."
      authority_note: "Use owned or distributable material. Private customer content, model generation and publication require their separate authority and consent."
      owning_paths: ["tools/stage_intelligence_candidates.py","src/loop_engine/core/code_intelligence_assets.py","src/loop_engine/core/intelligence_layers.py"]
      rollback: "Withdraw affected revisions and invalidate projections. Keep immutable provenance and previous consumer bindings; do not edit historical outcomes."
      verification_cases:
        - id: D-14-T01
          proof_level: "source_review"
          scenario: "Admit representative prompts, skills, code and historical records."
          pass_condition: "Each has its correct layer, rights, source identity and qualification basis."
          negative_control: "A public repository URL is not proof of redistribution permission."
        - id: D-14-T02
          proof_level: "local_contract"
          scenario: "Ingest changed bytes under an existing immutable identity."
          pass_condition: "The mismatch refuses rather than replacing the active body."
          negative_control: "Updating only a title cannot conceal a changed executable."
        - id: D-14-T03
          proof_level: "end_to_end"
          scenario: "Review, activate, retrieve and withdraw one exact revision."
          pass_condition: "Each stage records a distinct authorized transition."
          negative_control: "Successful execution cannot silently promote its producer's candidate."
        - id: D-14-T04
          proof_level: "operational_drill"
          scenario: "Delete or revoke material after indexing and caching."
          pass_condition: "Future search and delivery respect the change within the declared window."
          negative_control: "A stale cache cannot outlive the authorization contract."
        - id: D-14-T05
          proof_level: "held_out_comparison"
          scenario: "Evaluate domain coverage on frozen tasks."
          pass_condition: "Report useful, missing, harmful and unused material separately."
          negative_control: "Title-matching probes alone do not demonstrate intelligence quality."
    - id: D-15
      title: "Operate reliability, telemetry and customer data lifecycle"
      stage: public_launch
      steps: ["S-6.6","S-6.13","S-6.14","S-6.15","S-6.16"]
      depends_on: ["D-03","D-04","D-05"]
      actions:
        - "Define availability, latency, recovery and data-loss objectives for the supported pilot without promising unmeasured guarantees."
        - "Measure cold and reused connections, simultaneous customers, large files and slow clients with failures retained."
        - "Add alerts for identity outages, failed delivery, reconciliation backlog, storage growth and exhausted capacity."
        - "Use structural telemetry by default and separate raw-content retention, embeddings and training reuse behind explicit settings and consent."
        - "Implement customer export, deletion, retention and backup-expiry procedures across records, files, indexes and logs."
        - "Rehearse private backups, restore, secret rotation and incident response using exact manifests and owner-selected limits."
        - "Split stateless serving, workers, indexes or storage onto separate resources only when measurements and consistency contracts justify it."
        - "Keep infrastructure budgets, model budgets and customer subscription entitlements separately enforced and observable."
      acceptance: "Operators can detect, diagnose and recover declared failures without leaking private content, reviving revoked access or exceeding approved resources."
      adversarial: "Missing telemetry is unknown, embeddings are not anonymous, alerts are not hard spending caps, and additional SQLite replicas are not a scaling strategy."
      authority_note: "Remain within the existing infrastructure allowance. No new paid cluster, model experiment, retention policy or training reuse is approved by the plan."
      owning_paths: ["src/loop_engine/core/service_runtime","tools/measure_service_latency.py","tools/check_pilot_backup_restore.py"]
      rollback: "Use a rehearsed degraded mode or maintenance response. Restore only compatible state and reconcile post-backup revocations before admission."
      verification_cases:
        - id: D-15-T01
          proof_level: "operational_drill"
          scenario: "Stop the service or one external dependency during requests."
          pass_condition: "Failures, recovery time and uncertain effects are recorded accurately."
          negative_control: "A health endpoint alone cannot establish customer availability."
        - id: D-15-T02
          proof_level: "end_to_end"
          scenario: "Load the declared corpus with concurrent, slow and canceled clients."
          pass_condition: "Latency, memory, errors and backpressure stay within the chosen profile."
          negative_control: "Failed requests cannot be dropped from the denominator."
        - id: D-15-T03
          proof_level: "local_contract"
          scenario: "Disable raw-content telemetry and inspect all exported records."
          pass_condition: "Credentials and disallowed content are absent; missing cost stays unknown."
          negative_control: "Embedding vectors cannot be relabeled anonymous telemetry."
        - id: D-15-T04
          proof_level: "operational_drill"
          scenario: "Export and delete a disposable customer's data."
          pass_condition: "Every configured store and projection follows the retention contract."
          negative_control: "Deleting the primary row alone does not complete erasure."
        - id: D-15-T05
          proof_level: "operational_drill"
          scenario: "Restore a backup with newer revocation and payment events."
          pass_condition: "The restored service refuses stale authority until reconciliation."
          negative_control: "A successful archive extraction is not a complete restore test."
    - id: D-16
      title: "Qualify installation, distribution and compatibility"
      stage: public_launch
      steps: ["S-6.1","S-6.2","S-6.9","S-6.15","S-6.24","S-6.26"]
      depends_on: ["D-01","D-06","D-13"]
      actions:
        - "Choose and document the exact operating systems, Python versions, native clients and transport profiles supported by the pilot."
        - "Test clean installation and upgrade without relying on developer caches, user-level instructions or untracked packages."
        - "Keep model endpoints user-operated and credential references local; do not require installing a model server to connect an existing endpoint."
        - "Provide container and process profiles that separate dependency images, workers, workspaces and inference services."
        - "Pin distributed dependencies, retain notices and produce source and image identities that match the tested release."
        - "Verify protocol negotiation and explicit unsupported states across independently deployed client and server versions."
        - "Document uninstall, credential removal, workspace retention and rollback without broad filesystem deletion."
        - "Publish packages, source and images only after reviewed ownership and explicit release authority, keeping automatic deployment disabled until then."
      acceptance: "A new customer can install the supported profile, connect securely, run the documented task and recover or uninstall without hidden dependencies or data loss."
      adversarial: "An operator's warm cache, privileged shell, global model key or old unpublished interface cannot be required for a passing clean installation."
      authority_note: "Local packaging and isolated checks are permitted. Public package publication, Git commits and pushes need their exact authority; model calls remain separately bounded."
      owning_paths: ["pyproject.toml","Dockerfile.service","examples/29_intelligence_service","src/loop_engine/core/harness_execution_contracts.py"]
      rollback: "Retain the prior qualified distribution and explicit data migration path. Never reset customer workspaces or reinstall incompatible versions silently."
      verification_cases:
        - id: D-16-T01
          proof_level: "end_to_end"
          scenario: "Install the supported package and client in a clean environment."
          pass_condition: "Only declared dependencies and credential references are needed."
          negative_control: "A developer checkout on the import path must not make the test pass."
        - id: D-16-T02
          proof_level: "local_contract"
          scenario: "Connect clients with missing features or incompatible versions."
          pass_condition: "Negotiation selects a qualified common profile or refuses explicitly."
          negative_control: "Similar field names cannot trigger an invented conversion."
        - id: D-16-T03
          proof_level: "end_to_end"
          scenario: "Run equivalent trusted work through process and container profiles."
          pass_condition: "Contracts and outcomes agree while isolation differences remain explicit."
          negative_control: "One directory per task cannot be called a security sandbox."
        - id: D-16-T04
          proof_level: "source_review"
          scenario: "Inspect the distributable image, dependency lock and notices."
          pass_condition: "They match the tested source and required licenses."
          negative_control: "A newly downloaded unpinned executable invalidates the release identity."
        - id: D-16-T05
          proof_level: "operational_drill"
          scenario: "Upgrade, roll back and uninstall with retained customer work."
          pass_condition: "Credentials and scoped state follow the documented lifecycle."
          negative_control: "Recursive deletion of a broad home or workspace directory fails the procedure."
    - id: D-17
      title: Open a private beta for invited users
      stage: initial_service
      steps: [S-6.5, S-6.10, S-6.12, S-6.15, S-6.24, S-6.28]
      depends_on: [D-01, D-03]
      actions:
        - "Release only from a committed revision whose continuous integration run passed, through the guarded pilot workflow, so that the deployed image can always be rebuilt from the repository."
        - "Enable browser sign-in on the pilot for accounts that the operator prepared in advance, with public registration closed, and supply the identity provider's publishable key as a deployment secret reference."
        - "Give the operator one command that prepares an invited account and returns a single-use link for setting a password, so that an invitation does not depend on outgoing email."
        - "Let each invited person create, label, see and revoke personal client keys, and show copy-ready connection settings for OpenCode, Codex and Claude Code."
        - "Compile a starter catalogue of useful, skill-sized material from existing repository sources across the four persistent intelligence layers, refuse an item without a known licence, keep every item a candidate until the owner approves it, then publish the approved items with exact digests."
        - "Prove with one supported native client that selected material is downloaded, placed in that client's native layout and actually loaded, and record what the client received."
        - "Bound the cost of anonymous requests before inviting anyone: limit sign-in and activation attempts for each address and keep the pause between identity key reads."
        - "Run the invited-user journey with two people outside engineering, record every obstacle as roadmap work, and repeat the restore and rollback drills on the release that they used."
      acceptance: "An invited person signs in, creates a client key, connects a supported client, finds and downloads useful starter material, sees usage, and loses access when the operator disables the account. Every release comes from a committed revision and has a rehearsed rollback."
      adversarial: "An uninvited visitor, a disabled account, a key whose owner was disabled, an older release reading newer records, and a burst of forged sign-in tokens must all be refused without exhausting the service."
      authority_note: "No public registration, no live charges and no model calls. Candidate material is never published without the owner's approval. Provider changes use only the prepared connections."
      owning_paths: [".github/workflows/fly-pilot.yml","tools/check_rollback_key_version.py","src/loop_engine/core/service_runtime/browser_identity.py","src/loop_engine/core/service_runtime/http_entrypoint.py","src/loop_engine/core/service_runtime/web_assets/client-recipes.json","tools/stage_intelligence_candidates.py","tools/build_host_catalogue_manifest.py","tools/carry_catalogue_approvals.py","examples/29_intelligence_service/starter-catalogue/reviews.json"]
      rollback: "Redeploy the previous release image by digest. Personal keys use a record version that the previous release refuses, so a rollback cannot honor a key whose owner was disabled. Remove browser sign-in from the host configuration to return to operator-issued keys."
      verification_cases:
        - id: D-17-T01
          proof_level: "operational_drill"
          scenario: "Deploy a release from a committed revision through the guarded workflow and compare the running image with the image built from that revision."
          pass_condition: "The running image digest equals the built digest and the revision's continuous integration run passed."
          negative_control: "A working tree with uncommitted changes, or a revision whose checks failed, must be refused before anything is deployed."
        - id: D-17-T02
          proof_level: "operational_drill"
          scenario: "Write service state with the new release, including a personal key whose owner is then disabled, and read it with the previous release image."
          pass_condition: "The previous release refuses the personal key and still accepts operator-issued keys."
          negative_control: "State written without the record version change must be shown to be accepted, so the drill can detect the defect."
        - id: D-17-T03
          proof_level: "end_to_end"
          scenario: "A person outside engineering completes sign-in, key creation, client connection, search, download and usage review on the deployed service."
          pass_condition: "Every step succeeds without help and the record names the release that served it."
          negative_control: "An address that was not invited and a disabled account must both be refused at sign-in."
        - id: D-17-T04
          proof_level: "end_to_end"
          scenario: "A supported native client downloads selected starter material and loads it from its native layout."
          pass_condition: "The client's own record shows that it loaded the material, with matching digests."
          negative_control: "Tool discovery alone, or a file that exists but is never read, must not count as loading."
        - id: D-17-T05
          proof_level: "local_contract"
          scenario: "Send a burst of forged sign-in tokens that carry unknown key identifiers."
          pass_condition: "At most one identity key read happens inside the pause and ordinary requests keep working."
          negative_control: "With the pause removed, the number of key reads must grow with the burst."
        - id: D-17-T06
          proof_level: "local_contract"
          scenario: "Anchor the catalogue to a new revision, which rewrites the trailing anchor line of every body, and carry the independent approvals across the move."
          pass_condition: "An approval carries only when the sole difference between the bytes its reviewers read and the body today is that line and the revision it names. A carried approval keeps its reviewers, their decisions and the digest they judged, and records that it was carried rather than freshly approved."
          negative_control: "A body with a changed sentence beside the changed anchor line, a removed anchor line, a second anchor-looking line, a changed word inside the anchor line other than the revision, changed trailing whitespace, and a body whose recorded digest does not match it must each refuse the carry and return the item to candidate state, and a comparison that always carries must let every one of those cases through."
