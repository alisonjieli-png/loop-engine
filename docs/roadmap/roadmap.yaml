    - id: D-27
      title: "Clear components: one index, contract test kits and one home for every topic and term"
      stage: continued_improvement
      steps: [S-6.84, S-6.71, S-6.72, S-6.73]
      depends_on: [D-19]
      actions:
        - "Generate one component index from the slot catalogue, component interactions, folder map, boundary registry, guide map and terminology, and refuse a stale index."
        - "Give every slot one contract test kit that every engine passes alone, add composition tests for joined slots and end-to-end journey tests, and run isolated bindings in containers."
        - "Keep one authoritative record per topic and one definition per term, map every alias to one current term, and refuse conflicting definitions."
        - "Write the functional component standard into the development rules: one short rule in AGENTS.md, one standard document that extends the engine slot design, and a check for each rule."
      acceptance: "Every component has one contract, one guide, one owning folder, tested engines and simple names that do not conflict, and all of it is findable in one generated index."
      adversarial: "A stale index, an engine that passes only its own tests, a term with two definitions and two records claiming one topic must each fail a named check."
      authority_note: "Engineering work with no model calls, provider changes or spending."
      owning_paths: ["src/loop_engine/data/engine_slots.yaml", "src/loop_engine/core/engines/slot_checks.py", "src/loop_engine/core/component_contracts.py", "docs/components/COMPONENT-GUIDE-MAP.yaml", "tools/check_component_guides.py", "terminology.yaml"]
      verification_cases:
        - {id: D-27-T01, proof_level: local_contract, scenario: "Change one slot's contract version without regenerating the index.", pass_condition: "The index check names the slot and fails.", negative_control: "An index check that ignores contract versions must fail its own mutant test."}
        - {id: D-27-T02, proof_level: local_contract, scenario: "Run the step executor's contract kit against two engines and one deliberately broken engine.", pass_condition: "Both engines pass the same fixtures and the broken engine fails.", negative_control: "A kit that accepts the broken engine must fail its mutant test."}
        - {id: D-27-T03, proof_level: local_contract, scenario: "Add a second definition of an existing term in a new document.", pass_condition: "The term conflict check refuses it.", negative_control: "Removing the check must let the conflict through, shown by a mutant."}
      rollback: "Generated pages and checks can be switched off in continuous integration without touching runtime behavior."
    - id: D-28
      title: "Selectable engines at every slot, with a Baltor-native engine beside every adopted project"
      stage: continued_improvement
      steps: [S-6.74, S-6.75, S-6.30, S-6.31, S-6.32, S-6.44, S-6.52, S-6.86, S-6.87]
      depends_on: [D-19, D-27]
      actions:
        - "Map pinned, preferred and automatic selection onto the slot fields and record every decision."
        - "Wrap every adopted outside project as a pinned engine behind one slot and build a Baltor-native engine that passes the same kit."
        - "Serve multi-file packages through the Harness Working Directory Compiler with a native engine and an optional agent-harness engine, writing binaries and file modes byte for byte."
        - "Add the index-backed and hybrid search engines behind the search slot and measure each on the held-out query set."
      acceptance: "Any component's engine can be pinned, preferred or chosen automatically, replaced without touching its neighbours, and compared on recorded evidence."
      adversarial: "A pinned selection that falls back, an upstream type crossing an edge, a compiler that changes binary bytes or file modes and a ranking on evidence below the floor must each fail."
      authority_note: "Engine choice never grants file, network, model or spending authority. Comparison traffic for model-backed engines defaults to zero."
      owning_paths: ["src/loop_engine/core/engines/slots.py", "src/loop_engine/core/external_harness.py", "src/loop_engine/data/component_interactions.yaml"]
      verification_cases:
        - {id: D-28-T01, proof_level: local_contract, scenario: "Pin an engine that is unavailable.", pass_condition: "The step fails with the pinned engine named and no fallback runs.", negative_control: "A pinned selection that falls back must fail."}
        - {id: D-28-T02, proof_level: end_to_end, scenario: "Compile one multi-file package with a binary asset and an executable script for two harnesses through each compiler engine.", pass_condition: "Every file's bytes and mode match the source and each harness loads the package.", negative_control: "An engine that rewrites binary bytes must be refused at the edge."}
        - {id: D-28-T03, proof_level: held_out_comparison, scenario: "Rank the held-out queries with the current, index-backed and hybrid search engines.", pass_condition: "Recall, refusal accuracy and latency are recorded for each engine.", negative_control: "Evidence below the minimum sample must leave the declared order unchanged."}
      rollback: "Switch a slot's selection back to its previous engine in the host configuration; engines are retired, never deleted."
    - id: D-29
      title: "Agents that manage and improve the system"
      stage: continued_improvement
      steps: [S-6.76, S-6.77, S-6.80, S-6.55, S-6.41, S-6.51]
      depends_on: [D-18]
      actions:
        - "Keep the state review, library wave, harness discovery, research sweep and plan validation workflows in the repository, parameterized and free of machine paths."
        - "Declare each recurring job with its schedule, workflow and an effect policy of reports or candidates only, and record every run."
        - "Refresh the Harness File Profiles weekly from each harness's own documentation and source."
        - "Run a persona review after every release and learn from retrieval: wrong context, repeated asks and items fetched together."
        - "Model the recurring jobs as Practitioner Loops that stage candidates for independent review."
      acceptance: "The system is reviewed, researched, measured and grown on a schedule, and every change an agent proposes reaches main or the live service only through review."
      adversarial: "A job that pushes, approves or publishes on its own must be refused by its effect policy, and a run without a record must fail the audit."
      authority_note: "Recurring jobs write reports and candidates. Model calls follow the recorded authority with a per-run ceiling. Merging and releasing follow AGENTS.md."
      owning_paths: ["artifacts/agent-workflows-2026-09-23", "tools/refresh_research_sources.py", "docs/roadmap/roadmap.yaml"]
      verification_cases:
        - {id: D-29-T01, proof_level: operational_drill, scenario: "Run the daily state review on two consecutive days.", pass_condition: "Both reports exist, name their inputs and differ only where the state changed.", negative_control: "A run that edits a repository must be refused by its effect policy."}
        - {id: D-29-T02, proof_level: local_contract, scenario: "Change one harness's documented instruction file name in a fixture.", pass_condition: "The profile refresh proposes a candidate profile change with evidence.", negative_control: "A silent profile edit must fail the check."}
        - {id: D-29-T03, proof_level: local_contract, scenario: "Give a recurring job the effect policy of reports only and let its workflow attempt a push to main.", pass_condition: "The push is refused before it leaves the machine and the refusal is recorded with the job and its policy.", negative_control: "With the effect policy check removed, a mutant must let the push through and fail a named test."}
      rollback: "Pause a recurring job through its scheduling state; its past reports stay."
    - id: D-30
      title: "A release train for upgrades, features, packages and engines"
      stage: public_launch
      steps: [S-6.78, S-6.79, S-6.35, S-6.57]
      depends_on: [D-18]
      actions:
        - "Record every release kind with a versioned record: the service by image digest, the catalogue by manifest digest, client recipes and plugins by version, and the local engine by package version."
        - "Generate a customer changelog page from those records."
        - "Put new features behind versioned host configuration flags and roll them out in stages."
        - "Publish the local engine to a package index with an upgrade command that negotiates versions with the service."
        - "Measure the machine under load and name the first scale step and its trigger."
      acceptance: "Customers get new features, packages and engines on a predictable train, can see what changed, and can upgrade or roll back safely."
      adversarial: "A release without a record, a flag that widens authority, a silent protocol downgrade and a scale change above the allowance must each fail."
      authority_note: "Releases follow the guarded workflow from a checked main. Spending above the recorded allowance of 50 dollars a month needs the owner."
      owning_paths: ["CHANGELOG.md", "pyproject.toml", "fly.toml", "tools/build_catalogue_release_bundle.py"]
      verification_cases:
        - {id: D-30-T01, proof_level: operational_drill, scenario: "Release, then roll back to the previous image by digest.", pass_condition: "The live checks pass on both, and both releases have records.", negative_control: "A release missing its record must fail the release check."}
        - {id: D-30-T02, proof_level: local_contract, scenario: "Turn a flagged feature on for one account.", pass_condition: "Only that account sees it, and turning it off restores the previous behavior without a release.", negative_control: "A flag read from an older record version must be refused."}
        - {id: D-30-T03, proof_level: end_to_end, scenario: "Upgrade the local engine from the previous version.", pass_condition: "It negotiates the protocol with the service and keeps the customer's settings.", negative_control: "A client that silently downgrades a required protocol must be refused."}
      rollback: "Point the host back at the previous release record, turn a flag off, or reinstall the previous local engine version."
