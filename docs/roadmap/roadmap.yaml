        - {id: D-25-T02, proof_level: end_to_end, scenario: "Subscribe with an operator-entitled test account and follow Get set up for one harness.", pass_condition: "The entitlement is active, the setup path is exact, and the harness's own record shows the first package loaded with matching digests.", negative_control: "A download that the harness never reads must not count as a first load."}
        - {id: D-25-T03, proof_level: operational_drill, scenario: "Crawl every page in the typed site map on every hostname after a release.", pass_condition: "Every page answers with its own title and canonical address, and robots.txt and sitemap.xml list them.", negative_control: "Removing one route must fail the site map check."}
        - {id: D-25-T04, proof_level: operational_drill, scenario: "Make one hosted check fail on a copy of the service.", pass_condition: "The status view shows the failure and the incident runbook's rollback path is followed.", negative_control: "A status view that stays green must fail the drill."}
