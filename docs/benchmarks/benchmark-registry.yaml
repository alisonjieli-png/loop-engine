schema_version: benchmark_registry/v1
as_of: "2026-08-25"
purpose: >-
  Catalog external benchmark candidates before any task is downloaded, run,
  scored, or used in a comparison claim.

stage_definitions:
  catalog:
    meaning: The benchmark has an official source and has not been run.
  source_review:
    meaning: License, access, data handling, evaluator, and version are frozen.
  local_smoke:
    meaning: A small local subset proves the adapter and evaluator work.
  frozen_evaluation:
    meaning: The declared population runs with fixed inputs, settings, and oracle.
  comparison_ready:
    meaning: All comparison arms use the same frozen population and evaluator.

templates:
  common_catalog: &common_catalog
    current_status: cataloged_not_run
    staged_eligibility:
      current_stage: catalog
      next_stage: source_review
      eligible_for_comparison: false
      blockers:
        - Freeze a version or dated snapshot.
        - Confirm task-specific license and access terms.
        - Reproduce the official evaluator on a known sample.

  agentbench: &agentbench
    <<: *common_catalog
    family: agentic_task
    parent_suite: AgentBench
    modality: [text, tool, environment]
    source_url: https://github.com/THUDM/AgentBench
    evaluator:
      kind: executable_environment
      primary_metric: task_success_rate
      oracle_owner: upstream_harness
    license_access:
      license: Apache-2.0 repository; upstream environment terms vary
      access: Public code and data; Docker services and task assets are required
    cost_network_needs:
      network: required_for_setup
      compute: medium_to_high
      paid_service: optional_model_api
    contamination_risk:
      level: high
      basis: The task definitions and development data are public.

  gaia: &gaia
    <<: *common_catalog
    family: agentic_task
    parent_suite: GAIA
    modality: [text, file, tool, web]
    source_url: https://huggingface.co/datasets/gaia-benchmark/GAIA
    evaluator:
      kind: answer_match_with_private_test
      primary_metric: accuracy
      oracle_owner: official_leaderboard
    license_access:
      license: Dataset card and gating terms apply
      access: Gated download; test answers remain private
    cost_network_needs:
      network: required
      compute: medium
      paid_service: optional_model_and_search_apis
    contamination_risk:
      level: medium
      basis: Development questions are public, while test answers are private.

  bfcl: &bfcl
    <<: *common_catalog
    family: agentic_task
    parent_suite: Berkeley Function Calling Leaderboard V4
    modality: [text, tool]
    source_url: https://gorilla.cs.berkeley.edu/leaderboard
    evaluator:
      kind: ast_execution_or_agentic_task
      primary_metric: category_accuracy
      oracle_owner: upstream_harness
    license_access:
      license: Apache-2.0 evaluation repository; contributed function terms vary
      access: Public code and data; live tracks need network services
    cost_network_needs:
      network: track_dependent
      compute: medium
      paid_service: optional_model_api
    contamination_risk:
      level: medium
      basis: Static categories are public; live and agentic tracks change over time.

  tau_bench: &tau_bench
    <<: *common_catalog
    family: agentic_task
    parent_suite: tau-bench
    modality: [text, tool, database]
    source_url: https://taubench.com/
    evaluator:
      kind: executable_policy_task
      primary_metric: pass_1
      oracle_owner: upstream_harness
    license_access:
      license: Review the source repository and domain data terms
      access: Public benchmark materials; environment setup required
    cost_network_needs:
      network: required_for_setup_and_model_calls
      compute: medium
      paid_service: optional_model_api
    contamination_risk:
      level: medium
      basis: Policies and examples are public, but executable state limits memorization.

  beir: &beir
    <<: *common_catalog
    family: rag_retrieval
    parent_suite: BEIR
    modality: [text, retrieval]
    source_url: https://github.com/beir-cellar/beir
    evaluator:
      kind: ranked_retrieval
      primary_metric: ndcg_at_10
      oracle_owner: upstream_qrels
    license_access:
      license: Apache-2.0 wrapper; each upstream dataset has separate terms
      access: Most tracks are public downloads; some require reconstruction
    cost_network_needs:
      network: required_for_setup
      compute: corpus_dependent
      paid_service: no
    contamination_risk:
      level: high
      basis: Corpora, queries, and relevance labels are widely available.

  longbench: &longbench
    <<: *common_catalog
    family: long_context
    parent_suite: LongBench
    modality: [text, long_context]
    source_url: https://github.com/THUDM/LongBench
    evaluator:
      kind: official_task_metric
      primary_metric: task_specific_score
      oracle_owner: upstream_harness
    license_access:
      license: Apache-2.0 repository; upstream dataset terms vary
      access: Public benchmark data and evaluation code
    cost_network_needs:
      network: required_for_setup
      compute: high_context_dependent
      paid_service: optional_model_api
    contamination_risk:
      level: high
      basis: Benchmark inputs and evaluation code are public.

  legalbench: &legalbench
    <<: *common_catalog
    family: legal
    parent_suite: LegalBench
    modality: [text, legal]
    source_url: https://github.com/HazyResearch/legalbench
    evaluator:
      kind: official_task_evaluator
      primary_metric: task_specific_accuracy_or_score
      oracle_owner: upstream_harness
    license_access:
      license: Mixed by task; the official task license must be checked
      access: Public repository and data; some tasks have extra restrictions
    cost_network_needs:
      network: required_for_setup
      compute: low_to_medium
      paid_service: optional_model_api
    contamination_risk:
      level: high
      basis: Task prompts and labels are public or widely mirrored.

  harvey_lab: &harvey_lab
    <<: *common_catalog
    family: legal
    parent_suite: Harvey Legal Agent Benchmark v1.0
    modality: [text, document, file, tool]
    source_url: https://github.com/harveyai/harvey-labs/tree/v1.0
    evaluator:
      kind: expert_rubric_all_pass
      primary_metric: all_pass_rate
      oracle_owner: upstream_harness
    license_access:
      license: MIT repository; task asset terms must still be reviewed
      access: Public versioned repository with tasks, documents, rubrics, and harness
    cost_network_needs:
      network: required_for_setup
      compute: high
      paid_service: optional_model_api_and_llm_judge
    contamination_risk:
      level: high
      basis: Public tasks and rubrics can appear in model training or development.

  swebench: &swebench
    <<: *common_catalog
    family: coding
    parent_suite: SWE-bench
    modality: [text, code, repository]
    source_url: https://github.com/princeton-nlp/SWE-bench
    evaluator:
      kind: repository_test_execution
      primary_metric: resolved_rate
      oracle_owner: upstream_harness
    license_access:
      license: MIT harness; each source repository keeps its own license
      access: Public datasets; Docker images and source repositories are required
    cost_network_needs:
      network: required_for_setup
      compute: high
      paid_service: optional_model_api
    contamination_risk:
      level: high
      basis: Issues, patches, and repositories are public.

  livecodebench: &livecodebench
    <<: *common_catalog
    family: coding
    parent_suite: LiveCodeBench
    modality: [text, code]
    source_url: https://github.com/LiveCodeBench/LiveCodeBench
    evaluator:
      kind: sandboxed_code_execution
      primary_metric: pass_at_1
      oracle_owner: upstream_harness
    license_access:
      license: MIT harness; contest platform problem terms also apply
      access: Public versioned dataset and evaluator
    cost_network_needs:
      network: required_for_setup
      compute: medium_to_high
      paid_service: optional_model_api
    contamination_risk:
      level: medium
      basis: Dated releases permit post-training windows, but older tasks are public.

  ds1000: &ds1000
    <<: *common_catalog
    family: coding
    parent_suite: DS-1000
    modality: [text, code, data_science]
    source_url: https://github.com/xlang-ai/DS-1000
    evaluator:
      kind: isolated_code_execution
      primary_metric: execution_accuracy
      oracle_owner: upstream_harness
    license_access:
      license: CC-BY-SA-4.0
      access: Public dataset and evaluator
    cost_network_needs:
      network: required_for_setup
      compute: medium
      paid_service: optional_model_api
    contamination_risk:
      level: high
      basis: All prompts, reference code, and tests are public.

  sql_data: &sql_data
    <<: *common_catalog
    family: data_engineering
    parent_suite: SQL and table benchmarks
    modality: [text, table, database, code]
    source_url: https://github.com/taoyds/spider
    evaluator:
      kind: query_execution_or_task_specific
      primary_metric: execution_accuracy
      oracle_owner: upstream_harness
    license_access:
      license: Review each benchmark source and database terms
      access: Public or gated by benchmark; database setup is required
    cost_network_needs:
      network: required_for_setup
      compute: medium_to_high
      paid_service: benchmark_dependent
    contamination_risk:
      level: high
      basis: Static questions, schemas, and development answers are public.

  docvqa: &docvqa
    <<: *common_catalog
    family: document_understanding
    parent_suite: DocVQA
    modality: [text, image, document]
    source_url: https://www.docvqa.org/datasets
    evaluator:
      kind: official_challenge_evaluator
      primary_metric: anls_or_task_specific_score
      oracle_owner: official_challenge
    license_access:
      license: Dataset and source document terms apply
      access: RRC account or official download may be required
    cost_network_needs:
      network: required_for_setup
      compute: medium_to_high
      paid_service: optional_ocr_or_model_api
    contamination_risk:
      level: high
      basis: Training and validation documents and questions are public.

  document_other: &document_other
    <<: *common_catalog
    family: document_understanding
    parent_suite: Independent document benchmarks
    modality: [text, image, document]
    source_url: https://github.com/crcresearch/FUNSD
    evaluator:
      kind: benchmark_specific
      primary_metric: task_specific_score
      oracle_owner: upstream_harness
    license_access:
      license: Review the named dataset terms before download or redistribution
      access: Public or account-gated, depending on the dataset
    cost_network_needs:
      network: required_for_setup
      compute: medium_to_high
      paid_service: optional_ocr_or_model_api
    contamination_risk:
      level: high
      basis: Static document images and labels are public or widely mirrored.

  safety: &safety
    <<: *common_catalog
    family: safety
    parent_suite: Safety evaluation
    modality: [text, safety]
    source_url: https://crfm.stanford.edu/2024/11/08/helm-safety.html
    evaluator:
      kind: benchmark_specific_safety_evaluator
      primary_metric: harmfulness_or_refusal_score
      oracle_owner: upstream_harness
    license_access:
      license: Review each source; harmful content handling rules apply
      access: Public or gated benchmark data
    cost_network_needs:
      network: required_for_setup
      compute: medium
      paid_service: judge_model_may_be_required
    contamination_risk:
      level: high
      basis: Most prompts and evaluation protocols are public.
    staged_eligibility:
      current_stage: catalog
      next_stage: source_review
      eligible_for_comparison: false
      blockers:
        - Approve a safety test plan and restricted-output handling.
        - Freeze the benchmark version and evaluator.
        - Confirm licenses and any model-judge dependency.

  multimodal: &multimodal
    <<: *common_catalog
    family: multimodal
    parent_suite: Multimodal evaluation
    modality: [text, image, multimodal]
    source_url: https://github.com/MMMU-Benchmark/MMMU
    evaluator:
      kind: benchmark_specific
      primary_metric: accuracy_or_task_specific_score
      oracle_owner: upstream_harness
    license_access:
      license: Review each dataset and source media license
      access: Public or gated, depending on the benchmark
    cost_network_needs:
      network: required_for_setup
      compute: high
      paid_service: optional_multimodal_model_api
    contamination_risk:
      level: high
      basis: Most static prompts, images, and answers are public.

  kaggle: &kaggle
    <<: *common_catalog
    family: ml_kaggle
    parent_suite: Kaggle competition
    modality: [table, machine_learning]
    source_url: https://www.kaggle.com/competitions
    evaluator:
      kind: private_test_leaderboard
      primary_metric: competition_specific_metric
      oracle_owner: Kaggle
    license_access:
      license: Competition rules and dataset license apply
      access: Kaggle account and rule acceptance are required
    cost_network_needs:
      network: required
      compute: competition_dependent
      paid_service: no_for_local_baseline
    contamination_risk:
      level: medium
      basis: Training data is public, while test labels remain private.

benchmarks:
  # Agentic tasks and tool use, 20 tracks.
  - <<: *agentbench
    id: agentbench_os
    name: AgentBench Operating System
    task: Complete bounded shell and operating system tasks.
  - <<: *agentbench
    id: agentbench_database
    name: AgentBench Database
    task: Answer database questions through SQL interaction.
  - <<: *agentbench
    id: agentbench_knowledge_graph
    name: AgentBench Knowledge Graph
    task: Query a knowledge graph through the benchmark service.
  - <<: *agentbench
    id: agentbench_digital_card_game
    name: AgentBench Digital Card Game
    task: Plan actions in the benchmark card game environment.
  - <<: *agentbench
    id: agentbench_lateral_thinking
    name: AgentBench Lateral Thinking Puzzles
    task: Resolve interactive lateral thinking questions.
  - <<: *agentbench
    id: agentbench_alfworld
    name: AgentBench ALFWorld
    task: Complete household tasks in a text environment.
  - <<: *agentbench
    id: agentbench_webshop
    name: AgentBench WebShop
    task: Find and purchase products under task constraints.
  - <<: *agentbench
    id: agentbench_mind2web
    name: AgentBench Mind2Web
    task: Complete web navigation tasks.
  - <<: *gaia
    id: gaia_level_1
    name: GAIA Level 1
    task: Solve general assistant questions with limited tool depth.
  - <<: *gaia
    id: gaia_level_2
    name: GAIA Level 2
    task: Solve general assistant questions with several reasoning and tool steps.
  - <<: *gaia
    id: gaia_level_3
    name: GAIA Level 3
    task: Solve the most complex GAIA questions with substantial autonomy.
  - <<: *bfcl
    id: bfcl_single_turn_non_live
    name: BFCL Single Turn Non-Live
    task: Select and format one or more function calls against static functions.
  - <<: *bfcl
    id: bfcl_single_turn_live
    name: BFCL Single Turn Live
    task: Call functions whose behavior depends on a live service.
  - <<: *bfcl
    id: bfcl_parallel_calls
    name: BFCL Parallel Calls
    task: Produce independent function calls in parallel.
  - <<: *bfcl
    id: bfcl_multi_turn
    name: BFCL Multi Turn
    task: Maintain function state and choose calls across turns.
  - <<: *bfcl
    id: bfcl_relevance_detection
    name: BFCL Relevance Detection
    task: Refuse function calls when no listed function applies.
  - <<: *bfcl
    id: bfcl_agentic_web_search
    name: BFCL Agentic Web Search
    task: Use search tools for multi-step questions and recovery.
  - <<: *bfcl
    id: bfcl_agentic_memory
    name: BFCL Agentic Memory
    task: Store and retrieve information through memory tools.
  - <<: *tau_bench
    id: tau_bench_retail
    name: tau-bench Retail
    task: Follow retail policy while changing simulated customer state.
  - <<: *tau_bench
    id: tau_bench_airline
    name: tau-bench Airline
    task: Follow airline policy while changing simulated booking state.

  # Retrieval and RAG, 18 BEIR datasets.
  - <<: *beir
    id: beir_msmarco
    name: BEIR MS MARCO
    task: Retrieve passages for web search queries.
  - <<: *beir
