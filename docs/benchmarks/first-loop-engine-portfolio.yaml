        classes: 2
        dataset_url: >-
          https://www.openml.org/data/v1/download/1586225/blood-transfusion-service-center.arff
        dataset_md5: c3242468edab8c2e7a907674122dc851
        dataset_sha256: ee1304cac4a650ac31afe7395a100536a165f935bbe718a4643757c1a842316a
        dataset_bytes: 14143
        split_url: >-
          https://www.openml.org/api_splits/get/10101/Task_10101_splits.arff
        split_sha256: 965d72fa31f34cf0ca3c3345747bb68a8b78ad614c843ee7e6479c6d60503690
        split_bytes: 103033

    split_contract:
      type: crossvalidation
      repeats: 1
      folds: 10
      stratified: true
      source: official_task_split_files

    engine_scope:
      classification: practitioner_end_to_end
      public_label: Full Loop Practitioner benchmark
      required_path:
        - A Starting Practitioner uses reference_nine_step.
        - Data and intelligence spawned Loops verify inputs and retrieve prior work.
        - A construction spawned selects and builds one typed pipeline.
        - The Practitioner compiles a tabular Solution Canvas.
        - The Solution Canvas executes all ten official folds.
        - A pinned accuracy evaluator spawned verifies predictions independently.
        - Model calls use ModelGateway with Ollama Cloud pinned.
        - Run History saves and verifies Practitioner and Solution events.
        - Playback and a report are rendered from the saved Run History.
      disqualifier: >-
        A model selector or evaluator-only run is a diagnostic. Exclude it
        from this benchmark population if the full path is absent.

    evaluator:
      kind: fixed_fold_classification
      primary_metric: predictive_accuracy
      direction: higher_is_better
      fold_aggregation: mean_of_10_official_fold_accuracies
      implementation: sklearn.metrics.accuracy_score
      oracle_owner: OpenML task splits plus frozen local evaluator
      independent_from_selector: true

    arms:
      deterministic_baseline:
        mode: deterministic
        model_calls: 0
        method: >-
          Run the full Practitioner path and compile a Solution Canvas with a
          fixed one-hot encoder, unknown categories ignored, and
          LogisticRegression with C 1.0, max_iter 1000, and one CPU thread.
      ollama_advisor:
        mode: hybrid
        provider: ollama_cloud
        failover: false
        method: >-
          Run the full Practitioner path. Before any fold result exists, a
          planning spawned gives schema and non-outcome metadata to Ollama once.
          It selects the fixed logistic pipeline or a 200-tree seeded random
          forest. Compile the choice into a Canvas and run all ten folds.

    limits:
      max_physical_calls_per_task: 1
      max_physical_calls_track: 3
      provider_attempt_timeout_seconds: 120
      track_wall_time_minutes: 15
      max_output_tokens: provider_declared_maximum

    contamination_risk:
      level: high
      basis: >-
        Dataset names, data, labels, and prior results are public. The Ollama
        advisor may have seen them. Keep cost and integration findings separate
        from claims about general machine learning ability.
    expected_resources:
      data_and_splits: 344966 verified bytes
      scratch_disk: 500 MB including environment cache and outputs
      compute: CPU only, 1 worker, 2 GB RAM; no GPU required
      paid_service: At most three Ollama Cloud calls under account terms

    go_no_go:
      current_decision: no_go
      gates:
        - Recheck suite 99 still maps the three task IDs to the named data IDs.
        - Verify every dataset and split hash after acquisition.
        - Record the exact Python and scikit-learn environment lock.
        - Confirm local use is allowed under each Public metadata label.
        - Freeze one real Ollama Cloud model and its declared output maximum.
        - Verify the Starting Practitioner, spawned Loops, Canvas execution,
          independent evaluator, Run History, playback, and report.

portfolio_go_no_go:
  current_decision: no_go
  promotion_rule: >-
    A track may enter local smoke only after every track gate is true. The
    portfolio may enter paired comparison only after all arms use the same
    frozen tasks and independent evaluator, and all calls, time, tokens, and
    price state are recorded without converting unknown values to zero.
