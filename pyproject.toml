[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "loop-engine"
version = "0.1.0"
description = "A Python engine for deterministic, hybrid, and non-deterministic task loops."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Alie Jie Li", email = "alisonjieli@gmail.com" }]
keywords = ["agent", "loop", "llm", "orchestration", "automl", "provider-failover"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
# The default install supports the public solve path. Large data, benchmark,
# and protocol adapters are explicit extras so a first install does not pull a
# GPU stack that the working solver does not use.
dependencies = [
    "PyYAML",
    "jsonschema>=4.20",
]

[project.optional-dependencies]
data = [
    "numpy",
    "pandas",
    "scikit-learn",
    "lightgbm",
    "xgboost",
    "kaggle",
    "duckdb",
    "model2vec",
    "lancedb",
]
integrations = [
    "mcp>=1.29,<2",
    "opentelemetry-api>=1.41",
    "opentelemetry-sdk>=1.41",
    "tomli>=2; python_version < '3.11'",
]
all = [
    "numpy", "pandas", "scikit-learn", "lightgbm", "xgboost", "kaggle",
    "duckdb", "model2vec", "lancedb", "mcp>=1.29,<2",
    "opentelemetry-api>=1.41", "opentelemetry-sdk>=1.41",
    "tomli>=2; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/alisonjieli-png/loop-engine"
Documentation = "https://github.com/alisonjieli-png/loop-engine/tree/main/docs"
Issues = "https://github.com/alisonjieli-png/loop-engine/issues"

[project.scripts]
loop-engine = "loop_engine.__main__:main"

[tool.setuptools]
# `loop_engine` is the import name for the `loop-engine` distribution.
# One package directory, one public surface.
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["loop_engine*"]

[tool.setuptools.package-data]
# Every non-.py file the package READS AT RUNTIME. A missing entry here is
# invisible in the source tree and fails only after installation — which is
# why the clean-virtualenv acceptance run is part of CI rather than optional.
loop_engine = [
    "forbidden_paths.json",
    "architecture_conformance.json",
    "ARCHITECTURE-MAP.md",
    "**/*.md",            # folder contracts and seed dimensions
    "**/*.html",          # Studio and report assets
    "**/*.json",          # manifests, evidence, and published measurements
    "**/*.jsonl",         # intelligence, governance, and run evidence
    "**/*.yaml",          # installed architecture and semantic projections
]

[tool.setuptools.exclude-package-data]
# Local Run History and Studio state may sit below the source package in a
# developer checkout.  They are evidence from that machine, not product data,
# and must never be copied into a wheel or source distribution.
loop_engine = [
    "evidence/runs/*",
    "evidence/runs/**/*",
    "evidence/studio/*",
    "evidence/studio/**/*",
]
