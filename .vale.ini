StylesPath = .vale/styles
MinAlertLevel = error

[*.md]
BasedOnStyles = LoopEngine

# Historical evidence: archived prompt transcripts and evidence captures are
# records of what was said, not current public prose. Exact paths only.
[docs/prompts/**.md]
BasedOnStyles =

[docs/evidence/**.md]
BasedOnStyles =

# Dated verification reports are point-in-time evidence, and a report whose
# finding is that a retired term was used has to quote that term. The CI
# retired-language check already exempts this path for exactly that reason
# (see the "Refuse retired public language" step). Vale now agrees with it.
# Dashes are still refused here: that rule is about current prose style and
# applies to every document the project publishes.
[docs/verification/**.md]
LoopEngine.RetiredTerms = NO
LoopEngine.RetiredTopology = NO
