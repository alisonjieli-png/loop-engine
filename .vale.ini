StylesPath = .vale/styles
MinAlertLevel = error

[*.md]
BasedOnStyles = LoopEngine

# Historical evidence: archived prompt transcripts and evidence captures are
# records of what was said, not current public prose. Exact paths only.
[docs/prompts/**.md]
BasedOnStyles =

[docs/prompts/**/*.md]
BasedOnStyles =

[docs/evidence/**.md]
BasedOnStyles =

# Vale 3.18 matched the two-star form above only for files directly inside
# the folder; dated evidence in a subfolder (for example
# docs/evidence/architecture-mesh-audit-20260904/) was still held to the
# live vocabulary. This form covers the nested reports as the comment above
# intends.
[docs/evidence/**/*.md]
BasedOnStyles =

# Dated verification reports are point-in-time evidence, and a report whose
# finding is that a retired term was used has to quote that term. The CI
# retired-language check already exempts this path for exactly that reason
# (see the "Refuse retired public language" step). Vale now agrees with it.
# Dashes are still refused here: that rule is about current prose style and
# applies to every document the project publishes.
[docs/verification/**.md]
LoopEngine.RetiredTerms = NO
LoopEngine.RetiredTopology = NO

# HANDOFF-ASTRA-6-WORKING-DIRECTORY-COMPILER-2026-09-23.md is a dated
# handoff written September 23, 2026 and committed unedited during the
# September 27, 2026 consolidation (builder k), per AGENTS.md's rule to keep
# dated records byte-for-byte and not rewrite a preserved historical file to
# satisfy a style check. Its only failure was three em dashes in running
# prose, so only the dash rule is exempted here; every other LoopEngine rule
# still applies to this file, and the dash rule still applies everywhere
# else, including every other dated record in docs/context.
[docs/context/HANDOFF-ASTRA-6-WORKING-DIRECTORY-COMPILER-2026-09-23.md]
LoopEngine.NoDashes = NO
