# Loop Engine user settings
version: 1

loop:
  framework: nine_step
  allowable_modes: [deterministic, hybrid, non_deterministic]
  preferred_modes: [deterministic, hybrid, non_deterministic]
  delegated_modes: [deterministic, hybrid, non_deterministic]
  max_depth: 3
  exit_condition: steps_complete
  success_confidence_min: 0.5

search:
  mode: hybrid
  lexical_backend: fts5
  vector_backend: hash
  vector_model: ""
  top_k: 10
  zero_model_first: true

models:
  default_thinking_power: medium
  allow_local_counted_generation: false
  providers:
    - id: ollama_cloud
      kind: builtin
      credential_env: OLLAMA_API_KEY
    - id: mistral
      kind: builtin
      credential_env: MISTRAL_API_KEY
    - id: openrouter
      kind: builtin
      credential_env: OPENROUTER_API_KEY
    # Optional keyless local route. Publisher model-card facts are not a
    # verified deployment capability. Pin the exact revision/deployment and
    # add maximum_output_tokens plus maximum_output_source only after probing
    # the server you actually run.
    - id: local_qwen38_2b
      kind: custom
      endpoint: http://127.0.0.1:8000/v1
      model: empero-ai/Qwen3.8-2B-Distill
      wire: openai
      locality: local
      credential_env: ""
      purposes: [decide_label, query_rewrite, structured_extract]
  tiers:
    small:
      routes: [custom.local_qwen38_2b, cloud.mistral, cloud.default]
      timeout_seconds: 120
      max_attempts: 2
    medium:
      routes: [cloud.default, cloud.mistral.large, cloud.openrouter]
      timeout_seconds: 300
      max_attempts: 3
    high:
      routes: [cloud.mistral.large, cloud.hard, cloud.openrouter.reasoning]
      timeout_seconds: 600
      max_attempts: 3
    max:
      routes: [cloud.hard, cloud.openrouter.reasoning, cloud.mistral.large]
      timeout_seconds: 900
      max_attempts: 3
    specialized:
      routes: []
      timeout_seconds: 600
      max_attempts: 2
  escalation:
    enabled: false
    order: [small, medium, high, max]
    on_errors: [output_validation_failed]
    max_tier_changes: 1

operating:
  access_mode: approved_external_read
  reasoning_and_model_mode: deterministic_first_local_first
  construction_and_execution_mode: sandbox_generate
  effort_mode: standard
  optimization_mode: quality_first
  limits: {}

history:
  runs_dir: ~/.loop-engine/runs
  save_run_history: true
