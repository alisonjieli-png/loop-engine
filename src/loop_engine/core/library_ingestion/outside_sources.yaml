# The curated outside sources an ingestion run may read. Record: library_outside_sources/v1.
# Every commit was resolved and every repository licence verified on 2026-09-22 through GitHub's
# licence interface and the licence text (tools/ingest_outside_material.py curate). The licence
# gate still decides each file at run time; a repository whose licence changed stops the run.
# Repositories curated and dropped, with the reason:
#   dallay/agents-skills: MIT at the root, but it holds copies of other authors' skills (Anthropic's Apache-2.0 skills and web quality skills), so its root licence cannot stand in for theirs.
#   sickn33/antigravity-awesome-skills: An aggregation of thousands of third-party skills under one root licence.
#   jeremylongshore/claude-code-plugins-plus-skills: An aggregation of third-party and generated skills under one root licence.
#   davila7/claude-code-templates: An aggregation of third-party components under one root licence.
#   alirezarezvani/claude-skills: Half of its skill files are symbolic links and its layout mixes copies; left for a later curation.
#   ComposioHQ/awesome-claude-skills: No repository licence; not read in this increment.
# The order is the duplicate order: when two sources hold the same text, the one listed first is
# kept and the other is merged into it. The original authors come first, collections of several
# authors' work after them, so a copy never displaces its original or takes on another licence.
