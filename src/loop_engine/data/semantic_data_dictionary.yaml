  - two running instances, one paused under pressure, one stalled and stopped through its handle.
  negative_examples:
  - A signal sent to a process the ledger does not own.
  - A ceiling typed into the module.
  conformance_rules:
  - one_term_one_meaning
  - one_source_of_truth
  - no_authority_from_alias
- term_id: core.term.instance_checkpoint
  canonical_name: Checkpoint
  primary_category: record
  definition: The declared state one harness instance can be restored from, with the restoration fidelity
    the adapter performs (restart only, native session resume, application checkpoint, filesystem snapshot,
    or process memory restore), the session, workspace, and intelligence references, the graph position,
    the outputs already published, the external effects still pending, and the requirements a resume needs.
  source_of_truth: loop_engine.core.instance_hibernation:Checkpoint
  source_symbol: loop_engine.core.instance_hibernation:Checkpoint
  public_or_internal: public
  runtime_or_passive: passive
  authoritative_or_projection: authoritative
  versioning: instance_checkpoint/v1
  related_terms:
  - ResourceReservation
  - InstanceLedger
  - ProgressSignal
  difference_from_neighbors: a Checkpoint records what a stopped instance can be restored from; a Run
    History record says what already happened; neither restores anything by itself.
  parameterization_decision: closed_fidelity_vocabulary_declared_per_adapter
  composition_decision: a checkpoint that claims a fidelity above the one the adapter declares is refused;
    a checkpoint that restores state names a session or a workspace; pending external effects travel with
    it so a resume reconciles them instead of repeating them
  inheritance_decision: none
  storage_authority: the caller's checkpoint store; this boundary writes no files
  lifecycle: Immutable per hibernation.
  legacy_aliases: []
  migration: New on 2026-09-18.
  examples:
  - an application checkpoint naming session:abc, workspace:i1, one published solution, and one pending
    provider call.
  negative_examples:
  - A checkpoint that claims process memory restore from an adapter that only restarts.
  - A checkpoint treated as proof that memory was freed.
  conformance_rules:
  - one_term_one_meaning
  - one_source_of_truth
  - no_authority_from_alias
- term_id: core.term.resource_reservation
  canonical_name: ResourceReservation
  primary_category: record
  definition: Memory held for one harness instance from before it starts until its worker is confirmed
    gone, counted against every later admission and kept behind a declared headroom fraction for the operating
    system and for writing a checkpoint.
  source_of_truth: loop_engine.core.instance_hibernation:Reservation
  source_symbol: loop_engine.core.instance_hibernation:Reservation
  public_or_internal: public
  runtime_or_passive: passive
  authoritative_or_projection: authoritative
  versioning: resource_reservation/v1
  related_terms:
  - ResourceSnapshot
  - InstanceLedger
  - Checkpoint
  difference_from_neighbors: a reservation holds capacity for work that has not grown into it yet; a ResourceSnapshot
    measures what the machine reports now.
  parameterization_decision: measured_available_memory_minus_reserved_minus_headroom
  composition_decision: capacity is released only on a confirmed stop, because a written checkpoint and
    a sent signal are requests; an unconfirmed stop keeps the reservation and is recorded as its own event
  inheritance_decision: none
  storage_authority: the reservation ledger while the machine runs
  lifecycle: Active until released; a released reservation keeps its reason.
  legacy_aliases: []
  migration: New on 2026-09-18.
  examples:
  - 300 bytes held for instance i1 and released when the controller confirmed the worker stopped.
  negative_examples:
  - Capacity marked free because a stop was requested.
  - A reservation taken on a machine whose memory could not be measured.
  conformance_rules:
  - one_term_one_meaning
  - one_source_of_truth
  - no_authority_from_alias
- term_id: core.term.progress_signal
  canonical_name: ProgressSignal
  primary_category: record
  definition: 'What one harness instance reports about its own progress at one moment: advancing, waiting
    on a declared reason with its own deadline, no progress, or unknown; a declared wait is not a stall
    until its deadline passes, and a heartbeat that reports no progress still stalls.'
  source_of_truth: loop_engine.core.instance_hibernation:ProgressSignal
  source_symbol: loop_engine.core.instance_hibernation:ProgressSignal
  public_or_internal: public
  runtime_or_passive: passive
  authoritative_or_projection: authoritative
  versioning: progress_assessment/v1
  related_terms:
  - InstanceLedger
  - ResourcePolicy
  - outcome_vector
  difference_from_neighbors: a progress signal says whether work is moving; a heartbeat says only that
    a worker is alive; an outcome vector judges the quality of a finished step.
  parameterization_decision: closed_progress_and_waiting_vocabularies_with_a_deadline_per_wait
  composition_decision: the assessment combines the signal with the heartbeat age, so silence during an
    authorized model call is not a stall and liveness without movement is
  inheritance_decision: none
  storage_authority: the instance ledger event log
  lifecycle: One signal per report.
  legacy_aliases: []
  migration: New on 2026-09-18.
  examples:
  - waiting on a model call until second 500; no progress for ten rounds on the same candidate.
  negative_examples:
  - A universal rule that no output for a while means the worker is killed.
  conformance_rules:
  - one_term_one_meaning
  - one_source_of_truth
  - no_authority_from_alias
