- term_id: core.term.outcome_vector
  canonical_name: OutcomeVector
  primary_category: record
  definition: Tri-valued per-stage record separating response admission, observable process alignment,
    execution, expected and requested output satisfaction, local verification, material progress, continuation,
    downstream use, branch contribution, invalidation, and whole-task outcome.
  source_of_truth: loop_engine.core.outcome_vector:OutcomeVector
  source_symbol: loop_engine.core.outcome_vector:OutcomeVector
  public_or_internal: internal
  runtime_or_passive: passive
  authoritative_or_projection: authoritative
  versioning: outcome_vector/v2; outcome_vector/v1 is read only through exact migration
  related_terms:
  - ActionIntentVector
  - ActionVectorAssessment
  difference_from_neighbors: OutcomeVector stores observed tri-valued signals; ActionIntentVector stores
    the intended direction, and ActionVectorAssessment supplies subject-bound semantic evidence.
  parameterization_decision: signals_are_observed_at_their_own_boundary
  composition_decision: nested in stage observations and exact action lineage
  inheritance_decision: none
  storage_authority: Run History and the existing stage store
  lifecycle: Signals accumulate without replacing unknown with false; contradictions remain visible.
  legacy_aliases: []
  migration: stage_observation/v2 with outcome_vector/v1 supplies only its historical axes; every new
    axis remains unknown.
  examples:
  - A schema-admitted response with failed observable process alignment and unknown requested-output satisfaction.
  negative_examples:
  - A successful model response treated as proof that the requested task succeeded.
  conformance_rules:
  - one_term_one_meaning
  - one_source_of_truth
  - no_authority_from_alias
