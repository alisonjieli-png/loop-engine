categories:
  runtime:
    definition: Stateful executable object with governed identity and lifecycle.
    preferred_suffixes:
    - Loop
    - Runtime
  operation:
    definition: Governed or pure work performed through a declared contract.
    preferred_suffixes: []
  definition:
    definition: Immutable versioned description of permitted behavior.
    preferred_suffixes:
    - Definition
    - Spec
  contract:
    definition: Typed compatibility and acceptance boundary.
    preferred_suffixes:
    - Contract
  request:
    definition: Passive validated input for one operation.
    preferred_suffixes:
    - Request
  context:
    definition: Scoped runtime identity, cancellation, deadline, and authority state.
    preferred_suffixes:
    - Context
  record:
    definition: Passive persisted or observed fact with identity and provenance.
    preferred_suffixes:
    - Record
    - Evidence
  snapshot:
    definition: Immutable point-in-time projection of selected state.
    preferred_suffixes: []
  reference:
    definition: Exact pointer to another object; never its full body.
    preferred_suffixes:
    - Ref
    - Reference
  policy:
    definition: Hard permission, eligibility, budget, or effect constraint.
    preferred_suffixes:
    - Policy
  preference:
    definition: Soft choice that never grants authority.
    preferred_suffixes: []
  strategy:
    definition: Replaceable algorithm or search behavior under one contract.
    preferred_suffixes:
    - Strategy
  profile:
    definition: Versioned reusable behavior and preference configuration.
    preferred_suffixes:
    - Profile
    - ProfileSpec
    - ProfileRef
  procedure:
    definition: Typed step, graph, state-machine, or bounded-cycle description.
    preferred_suffixes: []
  service:
    definition: Stateful implementation boundary used by an owning runtime.
    preferred_suffixes:
    - Service
    - Gateway
    - Directory
  adapter:
    definition: Protocol-specific implementation behind a provider-neutral boundary.
    preferred_suffixes:
    - Adapter
    - Port
  provider:
    definition: External or local service implementation identity.
    preferred_suffixes: []
  route:
    definition: Configured path to an exact provider or deployment.
    preferred_suffixes: []
  capability:
    definition: Declared operation that may be selected after compatibility checks.
    preferred_suffixes: []
  tool:
    definition: Invocable capability with typed input, output, permission, and effects.
    preferred_suffixes: []
  plugin:
    definition: Versioned extension contribution and provenance mechanism.
    preferred_suffixes: []
  registry:
    definition: Exact identity resolution authority.
    preferred_suffixes: []
  catalog:
    definition: Logical discovery and query surface over records.
    preferred_suffixes: []
  store:
    definition: Physical persistence authority for records in a declared scope.
    preferred_suffixes:
    - Store
    - Journal
    - Catalog
  index:
    definition: Rebuildable query materialization traceable to canonical records.
    preferred_suffixes:
    - Index
    - Materialization
  cache:
    definition: Discardable acceleration that owns no canonical identity.
    preferred_suffixes: []
  artifact:
    definition: Digest-addressed body or output stored outside small events.
    preferred_suffixes: []
  event:
    definition: One chronological typed fact in Run History.
    preferred_suffixes: []
  history:
    definition: Canonical append-only evidence of governed runtime events.
    preferred_suffixes:
    - RunHistory
    - Event
  memory:
    definition: Bounded working state or reviewed reusable experience, claim, or procedure.
    preferred_suffixes:
    - Memory
    - MemoryRecord
  candidate:
    definition: Unapproved proposed reusable knowledge or behavior.
    preferred_suffixes:
    - Candidate
  active_intelligence:
    definition: Independently reviewed and promoted reusable intelligence.
    preferred_suffixes: []
  result:
    definition: Typed outcome of one completed or refused operation.
    preferred_suffixes:
    - Result
    - Outcome
    - Decision
  report:
    definition: Read-only projection of canonical records and results.
    preferred_suffixes: []
  renderer:
    definition: Formatting implementation that cannot re-derive business facts.
    preferred_suffixes: []
  evaluator:
    definition: Independent contract-matched assessment implementation.
    preferred_suffixes: []
  benchmark:
    definition: Frozen task population, conditions, evaluator, and measured result.
    preferred_suffixes:
    - Benchmark
    - Campaign
    - Trial
  scenario:
    definition: Passive capability-proof task definition, not achieved evidence.
    preferred_suffixes: []
  settings:
    definition: Validated user or organization configuration; never runtime authority by itself.
    preferred_suffixes:
    - Settings
    - Defaults
    - Override
  builder:
    definition: Passive construction or comparison object that produces an authoritative definition.
    preferred_suffixes:
    - Canvas
    - Builder
    - Candidate
  ontology_category:
    definition: Abstract classification used to organize concepts; never executable.
    preferred_suffixes: []
decision_rules:
  parameterize:
    when: Values, roles, modes, profiles, procedures, budgets, or preferences vary while invariants and
      lifecycle remain the same.
    action: Use one base type with immutable typed parameters or a versioned profile.
  compose:
    when: Algorithms or providers vary behind the same contract and authority boundary.
    action: Register a strategy, port, or adapter and compose it into the owning runtime.
  separate_class:
    when: State invariants, lifecycle, protocol, persistence authority, or effect boundary materially
      differ.
    action: Create a separately named class with one semantic category and explicit contract.
  separate_function:
    when: The operation is stateless, deterministic, and needs no independent lifecycle.
    action: Use a typed function accepting at most three direct parameters.
  separate_loop:
    when: Work needs independent goal, authority, budget, scheduling, retry, verification, cancellation,
      or Run History identity.
    action: Create another Loop instance using a profile; never create another runtime subclass.
  inherit:
    when: The subtype is fully substitutable, preserves base invariants, and the extension cannot be expressed
      safely through composition.
    action: Record the justification and conformance test; runtime inheritance from Loop is forbidden.
  retain_typed_data_class:
    when: A passive type carries a cohesive stable contract, invariant, injectable configuration, or independently
      meaningful semantic dimension.
    action: Keep and version the typed class; consolidation must not collapse distinct data into strings
      or generic dictionaries.
