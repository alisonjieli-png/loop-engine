# The facet vocabulary of the library_facet_tagging engine slot: one
# library_facet_vocabulary/v1 record, read by core/library_ingestion/facet_tags.py.
#
# The owner, September 26, 2026: "tag/label our harness component files by job
# title, industry, level, language, geography, etc, and allow people to search
# in the dashboard (when they sign up not on the home pages)". Roadmap S-6.209.
#
# Five facets, each a served keyword_list attribute of the same name. A value
# is a stable word a filter can name; the rules engine tags an item with a value
# only when the item's own words name it, so an item whose words name nothing
# gets no value. A tag is descriptive only and grants nothing.
#
# job_titles: the pinned occupation grid of September 22, 2026
# (artifacts/occupation-grid-research-2026-09-22, both task-opportunities.json
# and task-opportunities-expanded.json, source O*NET 31.0 Database by the U.S.
# Department of Labor, Employment and Training Administration, CC BY 4.0,
# source digest 55033fc68b4c13ec23e7f74dc6378660f6e854e75d55d6e333ae0a761d3987cd)
# plus the four packaged occupation seeds (data/occupation_seeds.yaml) whose
# titles the grid does not hold; the two seeds it does hold (Customer Service
# Representative, Database Administrator) are served under the grid's title.
# Titles are the grid's words. The name phrases an item may use for a title
# are derived in code: the title, its singular, and each multi-word occupation
# a joined title names; a single word cut from a joined title (agents, records,
# judges) is never a phrase, so a title that needs one lists it under
# also_known_as, where a reviewer can see it. A phrase shared by several
# titles names none of them.
# The U.S. Department of Labor has not approved, endorsed or tested this use.
#
# industries: a declared list written here, one line of description each.
# levels: the six levels the owner named, in career order.
# languages: the twelve languages most used in web content and open source
# repositories, a judgement recorded here and not a measurement; English is the
# default. Six are found by their script, six Latin-script languages by a
# bounded stopword list. A stopword shared by two languages counts for neither.
# geographies: countries and regions, each with the names an item may use;
# an upper-case phrase (USA, EU, APAC) is matched exactly, every other phrase
# without regard to case. Demonyms and language names are not place names here.
record_type: library_facet_vocabulary/v1
