# The release catalogue of command-line harness recipes (plan package X1,
# engine design section 13.7). Package data, never host data: a host
# harness.json names a style listed here and cannot name a module.
#
# Adding a command-line harness is one recipe module in src/loop_engine/core
# and one harness_recipe/v1 record below. module_sha256 is the SHA-256 of the
# module file's exact bytes; editing a module without updating its digest
# makes that recipe refuse to bind, and the check
# every_recipe_names_resolvable_functions_and_its_module_digest fails.
#
# distribution.version is the version each recipe was written and checked
# against (the pinned embodiment); distribution.sha256 is the digest a
# qualification bound, or null where none was bound.
