# How one harness program starts fresh for one step (roadmap S-6.42), in the
# customer-side launch mode: a clean environment, an empty home folder, the
# harness's own configuration folder and the step folder as its own git root.
# tools/check_harness_fresh_instances.py proves each recipe offline at its
# pinned version; a changed installed version is unqualified until proven
# again. A candidate is listed for study and makes no support claim.
fresh_instance_recipes:
  - record_type: harness_fresh_instance_recipe/v1
    recipe_id: codex.fresh_instance
    harness: codex
    launch_mode: customer_process
    order: 1
    candidate: false
    source: {upstream: "https://github.com/openai/codex", revision: null, licence: Apache-2.0}
    executable: codex
    version_arguments: [--version]
    version_pattern: '^codex-cli (\S+)$'
    pinned_version: 0.155.1
    configuration_variable: CODEX_HOME
    environment:
      HOME: '{empty_home}'
      CODEX_HOME: '{configuration_folder}'
      TMPDIR: '{configuration_folder}'
      BALTOR_STEP_MODEL_CREDENTIAL: '{model_credential}'
    arguments: [exec, --ephemeral, --json, '{probe_prompt}']
    instruction_files:
      - {name: AGENTS.md, body: step_instructions}
    skills_directory: .agents/skills
    configuration_writer: codex_configuration_toml
    global_locations:
      - .codex/AGENTS.md
      - .codex/config.toml
      - .codex/skills/decoy-codex-skill/SKILL.md
      - .agents/skills/decoy-agents-skill/SKILL.md
    bundled_items: []
    material: {instruction_file: loaded, skills: loaded, protocol_servers: loaded}
    support_claim: material_loading
    evidence: [docs/research/HARNESS-INDEPENDENT-INSTANCES-2026-09-22.md, artifacts/architecture-audit-2026-09-19/harness-fresh-instance-isolation-3.json]
