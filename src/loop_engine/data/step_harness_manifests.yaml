# The step harness manifests this release ships (step_harness_manifest_catalog/v1).
#
# Each manifest declares one harness program as a candidate step executor
# engine: how it starts for one step, where the step's material goes, what it
# supports, what its sandbox needs and how its completion and output are read.
# A manifest grants nothing. A host installs one by naming it in an
# engine_installation/v1 with the program's real path and read-only software
# mounts; the engine stays a candidate until an engine_qualification/v1 made by
# core.step_execution.qualification proves a fresh start, loaded material and
# a read output on the fixture step. A customer's own harness uses the same
# record in a host file; see docs/components/core-architecture/STEP-EXECUTION.md.
record_type: step_harness_manifest_catalog/v1
version: 1.0.0
manifests:
  - record_type: step_harness_manifest/v1
    harness_id: baltor_loop.process
    harness_version: 1.0.0
    engine_kind: custom_loop_harness
    title: Baltor's own Loop runtime, started as a separate sandboxed process for each step
    source: {upstream: https://github.com/alisonjieli-png/loop-engine, revision: null, licence: MIT}
    launch:
      executable: python3
      version_arguments: [--version]
      version_pattern: '^Python (\S+)$'
      pinned_version: null
      arguments: [-s, -B, '{software_root}/loop_engine/core/step_execution/loop_harness_process.py',
                  --request, '{step_request_file}', --result, '{step_result_file}']
      environment: {HOME: '{empty_home}', PYTHONPATH: '{software_root}'}
      configuration_variable: null
      configuration_writer: none
      standard_input: none
    layout:
      layout_profile: baltor-harness
      instruction_files: [{name: AGENTS.md, body: step_instructions}]
      skills_directory: null
      global_locations: []
    capabilities:
      supported_modes: [deterministic]
      supported_features: [typed_request, deterministic_procedures]
      native_controls: []
      fresh_instance: supported
      compatibility:
        - {component_type: instruction_file, package_format: step_instructions/1, adapter_version: 1.0.0,
           harness_interface: baltor_loop/1.0.0, scope: step_folder, activation: explicit, support: embedded}
    sandbox: {isolation: os_sandbox, network: none, model_wire: none, native_tools: none, placement: fresh_process}
    completion:
      completed_exit_codes: [0, 3]
      output_source: result_file
      output_format: step_run_result_json
      event_field: ''
      event_value: ''
      occurrence: last
      text_pointer: ''
    evidence: []
  - record_type: step_harness_manifest/v1
    harness_id: fixture.step_harness
    harness_version: 1.0.0
    engine_kind: native_protocol_harness
    title: The offline fixture harness the step execution checks declare like any outside harness
    source: {upstream: https://github.com/alisonjieli-png/loop-engine, revision: null, licence: MIT}
    launch:
      executable: python3
      version_arguments: [--version]
      version_pattern: '^Python (\S+)$'
      pinned_version: null
      arguments: [-s, -B, '{software_root}', '{step_prompt}']
      environment: {HOME: '{empty_home}', FIXTURE_HARNESS_CONFIGURATION: '{configuration_folder}',
                    FIXTURE_MODEL_BASE_URL: '{model_base_url}', FIXTURE_MODEL: '{model_name}',
                    BALTOR_STEP_MODEL_CREDENTIAL: '{model_credential}'}
      configuration_variable: FIXTURE_HARNESS_CONFIGURATION
      configuration_writer: none
      standard_input: none
    layout:
      layout_profile: codex
      instruction_files: [{name: AGENTS.md, body: step_instructions}]
      skills_directory: .agents/skills
      global_locations: [AGENTS.md, .agents/skills/decoy-global-skill/SKILL.md]
    capabilities:
      supported_modes: [hybrid, non_deterministic]
      supported_features: [typed_request]
      native_controls: []
      fresh_instance: supported
      compatibility:
        - {component_type: instruction_file, package_format: agents_md/1, adapter_version: 1.0.0,
           harness_interface: fixture/1.0.0, scope: step_folder, activation: automatic, support: native}
        - {component_type: skill, package_format: agent_skills/1, adapter_version: 1.0.0,
           harness_interface: fixture/1.0.0, scope: step_folder, activation: automatic, support: native}
    sandbox: {isolation: os_sandbox, network: loopback_model_endpoint, model_wire: openai_chat_completions,
              native_tools: none, placement: fresh_process}
    completion:
      completed_exit_codes: [0]
      output_source: stdout
      output_format: json_lines
      event_field: type
      event_value: answer
      occurrence: last
      text_pointer: /text
    evidence: []
  - record_type: step_harness_manifest/v1
    harness_id: pi.print
    harness_version: 0.73.1
    engine_kind: native_protocol_harness
    title: Pi in print mode with JSON events, native tools off, for a text-only step
    source: {upstream: https://github.com/earendil-works/pi, revision: null, licence: MIT}
    launch:
      executable: pi
      version_arguments: [--version]
      version_pattern: '^(\S+)$'
      pinned_version: 0.73.1
      arguments: [--offline, --no-session, --model, 'step_model/{model_name}', --no-context-files, --no-tools,
                  --no-extensions, --no-prompt-templates, --no-themes, --no-skills, --append-system-prompt,
                  '{step_folder}/AGENTS.md', --mode, json, -p, '{step_prompt}']
      environment: {HOME: '{empty_home}', PI_CODING_AGENT_DIR: '{configuration_folder}',
                    TMPDIR: '{configuration_folder}', PI_OFFLINE: '1',
                    BALTOR_STEP_MODEL_CREDENTIAL: '{model_credential}'}
      configuration_variable: PI_CODING_AGENT_DIR
      configuration_writer: pi_models_json
      standard_input: none
    layout:
      layout_profile: pi
      instruction_files: [{name: AGENTS.md, body: step_instructions}]
      skills_directory: .pi/skills
      global_locations: [.pi/agent/AGENTS.md, .pi/agent/skills/decoy-pi-skill/SKILL.md,
                         .agents/skills/decoy-agents-skill/SKILL.md]
    capabilities:
      supported_modes: [hybrid, non_deterministic]
      supported_features: [typed_request]
      native_controls: []
      fresh_instance: supported
      compatibility:
        - {component_type: instruction_file, package_format: agents_md/1, adapter_version: 1.0.0,
           harness_interface: pi/0.73.1:print_json, scope: step_folder, activation: explicit, support: native}
        # With its tools off Pi offers no skill: it lists skills only for its read tool.
        - {component_type: skill, package_format: agent_skills/1, adapter_version: 1.0.0,
           harness_interface: pi/0.73.1:print_json, scope: step_folder, activation: tool_mediated,
           support: unsupported}
    sandbox: {isolation: os_sandbox, network: loopback_model_endpoint, model_wire: openai_chat_completions,
              native_tools: none, placement: fresh_process}
    completion:
      completed_exit_codes: [0]
      output_source: stdout
      output_format: json_lines
      event_field: type
      event_value: turn_end
      occurrence: last
      text_pointer: /message/content/0/text
    evidence: [docs/research/HARNESS-INDEPENDENT-INSTANCES-2026-09-22.md]
