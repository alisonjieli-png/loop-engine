    selects_context_or_state_policy: false
    mutates_memory_or_trusted_state: false
    promotes_shortcut: false
  invariants:
    - predictive_and_paired_measurements_bind_declared_variables_target_population_evaluator_estimator_and_holdout
    - empirical_information_uses_discrete_base_two_plugin_estimates_only
    - observed_deterministic_state_projection_must_obey_data_processing
