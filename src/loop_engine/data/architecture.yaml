    - declared_minimum_valid_population_coverage_blocks_high_attrition
    - paired_occurrences_and_outcomes_cannot_be_counted_more_than_once
    - absolute_treatment_loss_is_bounded_separately_from_relative_regret
    - paired_compression_and_distortion_is_an_observed_operating_point_not_a_rate_distortion_function
    - paired_assessment_uses_a_distinct_byte_and_declared_loss_estimator_contract
    - unknown_cost_or_latency_never_becomes_zero_or_a_partial_aggregate
    - public_aggregate_result_construction_requires_recomputation_functions
    - measurements_grant_no_execution_promotion_or_generalization_authority
    - proper_forecast_loss_is_distinct_from_entropy_surprise_and_decision_utility
    - forecast_scores_are_recomputed_and_do_not_establish_temporal_order_or_calibration
  unproven:
    - external_reference_manifest_and_validity_record_resolution
    - issued_preregistration_identity_for_measurement_design
