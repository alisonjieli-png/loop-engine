# The engine slot catalogue: one engine_slot/v1 record for every engine slot.
#
# An engine slot is the owner's swap point: one functional component's typed
# socket, where interchangeable engines of declared kinds plug in behind a
# fixed, versioned edge. The records below come from the three tables of
# docs/architecture/ENGINES-BEHIND-FIXED-EDGES.md (sections 5.2, 5.3 and 5.4)
# and, marked roadmap_addition, from roadmap step S-6.61 (one place for the
# customer's credentials and connections, with scoped access for each step).
#
# What each record joins to, read by core/engines/slot_index.py:
# - work_boundaries: exact rows of core.boundary_registry.BOUNDARIES;
# - interactions: rows of data/component_interactions.yaml, which hold the
#   request and result contracts (a slot never restates them), newest first;
# - component_folder: a row of data/component_folder_map.yaml;
# - conformance_suite: a suite the main self-test collects;
# - symbols: dotted paths read from source; planned_symbols do not exist yet.
#
# The catalogue lists slots. It installs, enables, selects and runs nothing,
# and grants no authority. Hosts declare installed engines separately.
record_type: engine_slot_catalog/v1
version: 1.0.0
slots:
