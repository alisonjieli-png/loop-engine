record_type: component_folder_map/v1
version: 1.5.0
folders:
  - path: src/loop_engine/core/decisions
    semantic_owner: typed_decision_contracts_and_provider_adapters
    allowed_component_kinds: [adapter, provider, result, settings]
    forbidden_component_kinds: [new_runtime, intelligence_layer]
    public_boundary: existing_model_gateway_typed_decision_operation
    dependency_direction: application_tools_depend_on_core_decision_contracts_never_reverse
  - path: src/loop_engine/core/engines
    semantic_owner: engine_slot_catalogue_selection_evidence_and_measurement_framework
    allowed_component_kinds: [policy, strategy, preference, result, report_projection]
    forbidden_component_kinds: [new_runtime, provider, intelligence_layer]
    public_boundary: engine_slot_catalogue_and_selection_decisions_over_existing_registries
    dependency_direction: the_framework_reads_existing_registries_and_never_imports_engine_modules
  - path: src/loop_engine/core/step_execution
    semantic_owner: step_run_edge_attempt_envelope_and_step_executor_engines
    allowed_component_kinds: [adapter, result, input_contract, output_contract]
    forbidden_component_kinds: [new_runtime, intelligence_layer]
    public_boundary: step_run_request_and_step_run_result_records
    dependency_direction: step_executor_engines_depend_on_the_step_edge_never_reverse
  - path: src/loop_engine/catalog
    semantic_owner: backend_neutral_record_store_contract_and_record_store_engines
    allowed_component_kinds: [adapter, result, policy]
    forbidden_component_kinds: [new_runtime, intelligence_layer]
    public_boundary: catalog_store_protocol_and_the_atomic_write_batch_contract
    dependency_direction: record_store_engines_depend_on_the_catalog_protocol_never_on_core_services
  - path: src/loop_engine/core/service_runtime
    semantic_owner: durable_tenant_authority_and_authenticated_intelligence_delivery
    allowed_component_kinds: [policy, adapter, provider, artifact, result]
    forbidden_component_kinds: [new_runtime, intelligence_layer]
    public_boundary: versioned_service_operations_over_existing_intelligence_and_catalog_contracts
    dependency_direction: transports_depend_on_service_domain_which_depends_on_catalog_contracts
  - path: src/loop_engine/core/practitioner_runtime
    semantic_owner: adaptive_capability_descriptions_and_stage_observations
    allowed_component_kinds: [capability, result, guidance]
    forbidden_component_kinds: [new_runtime, provider]
    public_boundary: owning_typed_capability_observation_and_provisioning_modules
    dependency_direction: helpers_depend_on_passive_records_and_validation_never_the_run_services_facade
  - path: src/loop_engine/loop
    semantic_owner: canonical_loop_runtime_and_runtime_contracts
    allowed_component_kinds: [runtime_definition, profile, procedure, policy]
    forbidden_component_kinds: [provider, adapter]
    public_boundary: loop_engine.Loop
    dependency_direction: ontology_and_passive_contracts_to_runtime
  - path: src/loop_engine/core
    semantic_owner: internal_runtime_services_and_component_operations
    allowed_component_kinds:
      - settings
      - policy
      - strategy
      - guidance
      - context_assembly
      - prompt_assembly
      - llm_work_packet
      - capability
      - adapter
      - provider
      - route
      - artifact
      - result
    forbidden_component_kinds: [new_runtime]
    public_boundary: three_core_architecture_capability_groups
    dependency_direction: contracts_to_adapters_not_adapters_to_ontology
  - path: src/loop_engine/data
    semantic_owner: installed_static_component_and_policy_data
    allowed_component_kinds:
      - persona
      - guidance
      - question_portfolio
      - prompt_assembly
      - configuration
    forbidden_component_kinds: [runtime_definition, executable_code]
    public_boundary: none
    dependency_direction: loaded_by_typed_core_readers
  - path: src/loop_engine/templates
    semantic_owner: passive_task_patterns_and_exact_baseline_binding
    allowed_component_kinds: [procedure, procedure_step, input_contract]
    forbidden_component_kinds: [new_runtime, provider]
    public_boundary: task_intake_and_binding
    dependency_direction: task_records_to_practitioner
  - path: src/loop_engine/code_nodes
    semantic_owner: reusable_solution_capabilities_and_compatibility_facades
    allowed_component_kinds: [capability, procedure, verification_contract]
    forbidden_component_kinds: [new_runtime, passive_loopnode]
    public_boundary: selected_solution_operations
    dependency_direction: solution_contracts_to_runtime
  - path: examples
    semantic_owner: thin_launchers_inputs_and_acceptance_fixtures
    allowed_component_kinds: [experiment_definition, benchmark_definition]
    forbidden_component_kinds: [generic_solver_authority]
    public_boundary: installed_or_checkout_examples
    dependency_direction: examples_depend_on_package_never_reverse
  - path: docs
    semantic_owner: human_projections_of_machine_and_runtime_authorities
    allowed_component_kinds: [report_projection]
    forbidden_component_kinds: [runtime_authority]
    public_boundary: documentation
    dependency_direction: generated_or_validated_from_current_sources
  - path: devtools/qualification_lab
    semantic_owner: independent_black_box_component_qualification
    allowed_component_kinds:
      - qualification_case
      - experiment_definition
      - report_projection
      - adapter
      - provider
    forbidden_component_kinds:
      - runtime_definition
    public_boundary: standalone_copyable_lab
    dependency_direction: may_invoke_public_cli_but_never_import_loop_engine
