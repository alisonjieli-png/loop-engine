# Envelope layer coverage: what each engine slot declares for each envelope layer.
#
# One entry for every slot of engine_slots.yaml, in catalogue order, and one declaration for each
# layer of docs/architecture/ADR-COMPONENT-ENVELOPE-LAYERS.md (section 14 of the functional
# component standard): full and partial name evidence, symbols or module:check references that
# resolve in source; not_applicable names one of the reasons below; none may name the roadmap
# step that closes the gap, and a slot added after the baseline must. Read and checked by
# core/engines/envelope_coverage.py against the baseline in
# component_envelope_coverage_baseline.yaml, which may rise and never fall.
#
# The survey of October 16, 2026 is conservative: a layer is partial only where it named code
# on the slot's own path, and a later survey raises a none with the evidence it finds. The file
# declares and grants nothing.
record_type: component_envelope_coverage/v1
version: 1.0.0
layers: [frustration_avoidance, carrier, handshake, account, tracking, preflight, nested_envelopes]
reasons:
  release_time_slot: >-
    This slot is chosen once in the release record and no run-time request crosses an edge of it, so
    the guarded release workflow and its live checks apply this layer, not an envelope Loop.
  no_nested_slot: >-
    No catalogued slot is nested under this slot and none of its engines is composite, so no
    envelope runs inside it.
  no_account_path: >-
    No account reaches this slot directly: the hosted service authenticates the credential and reads
    the entitlement before a request gets here, and a local run has no account, only the owning
    Loop's grants.
  before_any_account: >-
    This slot acts on a request before any account is known, by its client address, so there is no
    account to check yet.
  host_start_only: >-
    This slot runs once when the host starts, before any request or account exists.
  pure_without_state: >-
    Every engine of this slot is pure and keeps no state between calls, so there is no effect to
    journal, replay or reconcile and no desired state to resync; a repeated request is computed
    again.
