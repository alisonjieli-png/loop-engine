# Packaged exception catalogs for text conformance.
#
# This is the first of several places an exception can live. The layers, in
# precedence order from lowest to highest, are: this packaged file, a catalog
# file in the task working folder, evidence learned from the column itself,
# inline rule parameters, and recorded escalation answers. A later layer
# overrides a mapping entry and extends a list. Every correction names the
# catalog entry or signal that decided it, so a wrong entry is traceable.
#
# Values here are general business and personal-name conventions, not the
# contents of any one dataset. Dataset-specific exceptions belong in the task
# folder or in the learned evidence layer.
catalog_id: loop_engine.text_conformance.packaged
version: 1.0.0
# Confidence parameters read by the case operation. A task folder catalog may
# raise or lower them for a dataset whose conventions are known.
case_absent_confidence: 0.92
case_present_confidence: 0.95
particle_confidence: 0.8
short_token_confidence: 0.75
short_word_confidence: 0.85
null_sentinels: ["", "n/a", "na", "-", "--", "unknown", "none", "null", "nil", "?"]
preserved_tokens: [LLC, LLP, LP, PLC, PLLC, PC, USA, US, UK, EU, UAE, UN, NYC, DC,
                   IT, HR, AI, CEO, CFO, CTO, CPA, DBA, PO, VP, MD, PhD, ESQ,
                   BV, NV, SA, AG, AB, KK, SRL, SARL, SAS, OY, AS, IBM, HVAC, R&D]
minor_words: [a, an, and, as, at, but, by, for, in, nor, of, on, or, per, the, to,
              vs, via, with, y, e, et, und, de, du, des, der, die, das, del, della,
              di, da, la, le, les, los, las, el, en]
lowercase_particles: [de, del, della, di, da, du, la, le, van, von, der, den, ter,
                      ten, bin, ibn, al, el, y, e, zu, zum, zur, af, av, op, het]
internal_capital_prefixes:
  Mc: 0.97
  Fitz: 0.9
  Mac: 0.8
