<!-- Loop Engine Studio shell: a passive String served by studio_server.py.
     Every number on every page is fetched from /api/* at request time
     (saved run history + live stores), never a generated snapshot. -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>Loop Engine Studio</title>
<style>
:root { --bg:#f4f6f5; --panel:#fdfffe; --ink:#1d2422; --mut:#5f6c68;
  --line:#d7dedb; --acc:#1a6e63; --warn:#8a5a13; --hot:#c2571c;
  --chip:#e7edeb; --code:#eef2f0; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg:#131816; --panel:#1a201e;
    --ink:#e2e9e6; --mut:#8fa09a; --line:#2b332f; --acc:#4ec0ae;
    --warn:#d9a94a; --hot:#e07b3c; --chip:#242b28; --code:#202623; } }
:root[data-theme="dark"] { --bg:#131816; --panel:#1a201e; --ink:#e2e9e6;
  --mut:#8fa09a; --line:#2b332f; --acc:#4ec0ae; --warn:#d9a94a;
  --hot:#e07b3c; --chip:#242b28; --code:#202623; }
.lnode { padding:.35rem .5rem; border:1px solid var(--line); border-radius:6px;
  margin:.2rem 0; cursor:pointer; background:var(--panel); }
.lnode:hover, .lnode:focus { border-color:var(--acc); outline:none; }
.lnode b { font-family:"IBM Plex Mono",monospace; }
.mchip { font:600 .62rem/1 "IBM Plex Mono",monospace; padding:.25em .5em;
  border-radius:5px; margin-left:.35rem; border:1px solid var(--line);
  text-transform:uppercase; letter-spacing:.06em; }
.mchip.deterministic { color:var(--acc); border-color:var(--acc); }
.mchip.hybrid { color:#2e6f8e; border-color:#2e6f8e; }
.mchip.non_deterministic { color:var(--warn); border-color:var(--warn); }
.canvas { display:flex; flex-wrap:wrap; gap:.5rem; }
.cnode { border:1px solid var(--line); border-radius:6px; padding:.5rem .7rem;
  background:var(--panel); min-width:9rem; }
.cnode b { display:block; font-family:"IBM Plex Mono",monospace; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.5
  "IBM Plex Sans",system-ui,sans-serif; height:100vh; display:flex;
  flex-direction:column; }
header { display:flex; gap:1rem; align-items:center; padding:.5rem 1rem;
  border-bottom:1px solid var(--line); background:var(--panel); }
header b { letter-spacing:-.01em; }
header input { flex:1; max-width:28rem; padding:.35rem .6rem; border:1px
  solid var(--line); border-radius:.4rem; background:var(--bg);
  color:var(--ink); font:inherit; }
#status { font-size:.75rem; color:var(--mut); margin-left:auto; }
#layout { flex:1; display:flex; min-height:0; }
nav { width:11rem; border-right:1px solid var(--line); background:var(--panel);
  padding:.6rem 0; overflow:auto; }
nav a { display:block; padding:.4rem 1rem; color:var(--ink);
  text-decoration:none; font-size:.86rem; }
nav a.on { color:var(--acc); font-weight:600; border-left:3px solid
  var(--acc); padding-left:calc(1rem - 3px); }
main { flex:1; overflow:auto; padding:1rem 1.2rem; min-width:0; }
aside { width:22rem; border-left:1px solid var(--line);
  background:var(--panel); overflow:auto; padding:.8rem 1rem;
  display:none; font-size:.83rem; }
aside.open { display:block; }
aside h3 { margin:.2rem 0 .5rem; font-size:.95rem; }
h1 { font-size:1.25rem; margin:.2rem 0 .8rem; }
table { border-collapse:collapse; width:100%; font-size:.84rem;
  background:var(--panel); }
th,td { border-bottom:1px solid var(--line); padding:.35rem .55rem;
  text-align:left; white-space:nowrap; }
th { cursor:pointer; color:var(--mut); font-size:.72rem;
  text-transform:uppercase; letter-spacing:.05em; position:sticky; top:0;
  background:var(--panel); }
td.num,th.num { text-align:right; font-variant-numeric:tabular-nums; }
tr.row { cursor:pointer; } tr.row:hover td { background:var(--code); }
.cards { display:grid; grid-template-columns:repeat(auto-fill,
  minmax(9.5rem,1fr)); gap:.6rem; margin:.6rem 0 1.2rem; }
.card { background:var(--panel); border:1px solid var(--line);
  border-radius:.5rem; padding:.6rem .8rem; cursor:pointer; color:var(--ink);
  text-decoration:none; }
.card b { display:block; font-size:1.3rem;
  font-variant-numeric:tabular-nums; }
.card span { font-size:.7rem; color:var(--mut); text-transform:uppercase;
  letter-spacing:.05em; }
.chip { background:var(--chip); border-radius:.3rem; padding:.05rem .45rem;
  font-size:.72rem; font-family:"IBM Plex Mono",monospace; margin:0 .15rem;
  display:inline-block; cursor:pointer; color:var(--ink); border:0; }
.chip.on { background:var(--acc); color:#fff; }
.chip.reg { background:var(--acc); color:#fff; }
.chip.cand { background:var(--warn); color:#fff; }
.tabs { display:flex; gap:.2rem; border-bottom:1px solid var(--line);
  margin:.6rem 0; }
.tabs a { padding:.35rem .8rem; color:var(--mut); text-decoration:none;
  font-size:.84rem; border-bottom:2px solid transparent; }
.tabs a.on { color:var(--acc); border-bottom-color:var(--acc); }
pre { background:var(--code); border-radius:.4rem; padding:.6rem;
  font:12px/1.5 "IBM Plex Mono",monospace; overflow:auto; }
.tree { font:12.5px/1.7 "IBM Plex Mono",monospace; }
.tl { display:flex; align-items:center; gap:.7rem; margin:.6rem 0; }
.tl input[type=range] { flex:1; }
.ev { border-left:3px solid var(--line); padding:.3rem .7rem;
  margin:.25rem 0; font-size:.82rem; }
.ev.model { border-color:var(--hot); }
.ev.cur { background:var(--code); border-color:var(--acc); }
.k { color:var(--mut); font-size:.8rem; }
.warnbox { border-left:3px solid var(--warn); background:var(--panel);
  padding:.4rem .8rem; color:var(--mut); font-size:.82rem; margin:.6rem 0; }
button { background:var(--acc); color:#fff; border:0; border-radius:.35rem;
  padding:.3rem .7rem; font:inherit; cursor:pointer; }
.sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px;
  overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,
[role=button]:focus-visible { outline:2px solid var(--acc); outline-offset:2px; }
@media (max-width:760px) {
  body { height:auto; min-height:100vh; }
  header { flex-wrap:wrap; }
  header input { order:3; flex-basis:100%; max-width:none; }
  #layout { display:block; }
  nav { width:100%; border-right:0; border-bottom:1px solid var(--line);
    display:flex; overflow-x:auto; padding:.25rem; }
  nav a { flex:0 0 auto; padding:.45rem .65rem; }
  nav a.on { border-left:0; border-bottom:3px solid var(--acc);
    padding-left:.65rem; }
  main { min-height:60vh; }
  aside,aside.open { position:fixed; inset:4rem .5rem .5rem .5rem;
    width:auto; z-index:10; border:1px solid var(--line); border-radius:.5rem;
    box-shadow:0 12px 40px #0004; }
  .tabs { overflow-x:auto; }
  .tl { flex-wrap:wrap; }
  .tl input[type=range] { flex:1 1 calc(100% - 4rem); min-width:0; }
  #pos { flex:0 0 3rem; white-space:nowrap; text-align:right; }
  th,td { white-space:normal; min-width:6rem; }
}
</style></head><body>
<header><b>Loop Engine Studio</b>
<label class="sr-only" for="q">Filter the current page</label>
<input id="q" aria-label="Filter the current page"
  placeholder="Filter this page or use facet:value">
<span id="status" aria-live="polite">Loading</span></header>
<div id="layout"><nav id="nav" aria-label="Studio sections"></nav>
<main id="main" tabindex="-1">Loading</main>
<aside id="insp" aria-label="Selected item details"></aside></div>
<script>
const NAV = [["home","Home"],["runs","Runs"],
  ["runtime","Runtime"],
  ["intelligence","Intelligence Layers"],["context","Context Intelligence"],
  ["nodes","Code Intelligence"],["solutions","Solutions"],
  ["improvements","Improvements"]];
const $ = s => document.querySelector(s);
const esc = t => String(t ?? "").replace(/[&<>"]/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function api(p) { const r = await fetch("/api/" + p);
  if (!r.ok) throw new Error(p + " -> " + r.status); return r.json(); }
function nav(page) { $("#nav").innerHTML = NAV.map(([k, l]) =>
  `<a href="#/${k}" class="${page === k ? "on" : ""}">${l}</a>`).join(""); }
function inspect(html) { const a = $("#insp");
  a.className = html ? "open" : "";
  a.innerHTML = html ? `<button aria-label="close details"
    onclick="inspect('')">Close</button>` + html : ""; }
function filterRows() { const v = $("#q").value.toLowerCase();
  document.querySelectorAll("[data-s]").forEach(r =>
    r.style.display = !v || r.dataset.s.includes(v) ? "" : "none"); }
$("#q").addEventListener("input", filterRows);
function sortable(tbl) { tbl.querySelectorAll("th").forEach((th, i) => {
  th.tabIndex = 0; th.setAttribute("role", "button");
  const sort = () => { const rows = [...tbl.querySelectorAll("tr.row")];
    const num = th.classList.contains("num");
    const dir = th.dataset.d = -(th.dataset.d || -1);
    rows.sort((a, b) => { const x = a.children[i].textContent,
      y = b.children[i].textContent;
      return dir * (num ? (parseFloat(x) || 0) - (parseFloat(y) || 0)
                        : x.localeCompare(y)); });
    rows.forEach(r => tbl.appendChild(r)); };
  th.onclick = sort;
  th.onkeydown = event => { if (event.key === "Enter" || event.key === " ") {
    event.preventDefault(); sort(); } };
  th.setAttribute("aria-label", "Sort by " + th.textContent);
}); }

const pages = {
  async home() { const s = await api("summary");
    $("#main").innerHTML = `<h1>Operations</h1><div class="cards">` +
      s.cards.map(c => `<a class="card" href="#/${c.link}">
        <b>${esc(c.value)}</b><span>${esc(c.label)}</span></a>`).join("") +
      `</div><div class="warnbox">${esc(s.honesty)}</div>
      <h1 style="font-size:1.05rem">Recent runs</h1>` + runsTable(s.recent);
    sortable($("#main table")); },

  async runs() { const d = await api("runs");
    $("#main").innerHTML = `<h1>Runs</h1>` + runsTable(d.runs);
    sortable($("#main table")); },

  async run(id, tab) { tab = tab || "overview";
    const d = await api("run/" + encodeURIComponent(id));
    const T = ["overview","result","tree","runtime","canvas","playback","calls"];
    const product = d.product || {available:false,artifacts:[],verification:{},
      limitations:[],selected_canvas:{}};
    let body = "";
    if (tab === "overview") body = `<div class="cards">` + [
      ["events", d.totals.events], ["iterations", d.totals.iterations],
      ["semantic calls", d.totals.calls],
      ["tokens", d.totals.prompt_tokens + "+" + d.totals.eval_tokens],
      ["chain", d.chain_intact ? "intact" : "BROKEN"],
      ["stuckness", d.stuckness.stuckness_score]]
      .map(([l, v]) => `<div class="card"><b>${esc(v)}</b><span>${l}</span>
      </div>`).join("") + `</div><p class="k">${esc(d.goal)}</p>` +
      (d.stuckness.dominant_indicators.length ?
        `<div class="warnbox">stuck: ${esc(d.stuckness.dominant_indicators
          .map(i => i.indicator).join(", "))}; try ${esc(d.stuckness
          .suggested_interventions.join(", "))}</div>` : "") +
      (product.available
        ? `<h2>Product result</h2><div class="warnbox"><b>${esc(
            product.terminal_code)}</b>: ${esc(product.summary)}<br>
            ${product.artifacts.length} artifact(s), verification ${
            product.verification.passed || product.verification.verdict === "accept"
              ? "passed" : "not passed"}</div>`
        : `<div class="warnbox">This legacy run has no bound product outcome.
           Loop activity remains available below.</div>`);
    if (tab === "result") {
      if (!product.available) body = `<div class="warnbox">This legacy run
        has no bound product outcome.</div>`;
      else {
        const artifacts = product.artifacts.length ? `<table><tr><th>artifact</th>
          <th>type</th><th class="num">bytes</th><th>verified</th>
          <th>available now</th><th>digest</th></tr>` +
          product.artifacts.map(a => `<tr><td><code>${esc(a.relative_path)}</code></td>
          <td>${esc(a.media_type)}</td><td class="num">${a.byte_count}</td>
          <td>${a.verified && a.format_valid ? "yes" : "no"}</td>
          <td>${a.present ? "yes" : "missing"}</td>
          <td><code>${esc((a.digest || "").slice(0,12))}</code></td></tr>`).join("") +
          `</table>` : `<p class="k">No artifacts were recorded.</p>`;
        body = `<div class="cards">
          <div class="card"><b>${esc(product.terminal_code)}</b><span>terminal</span></div>
          <div class="card"><b>${product.solved ? "yes" : "no"}</b><span>solved</span></div>
          <div class="card"><b>${product.verification.passed ||
            product.verification.verdict === "accept" ? "passed" : "not passed"}</b>
            <span>verification</span></div>
          <div class="card"><b>${product.artifacts.length}</b><span>artifacts</span></div>
          </div><p>${esc(product.summary)}</p>
          <p class="k">Workspace: <code>${esc(product.workspace || "not recorded")}</code></p>
          <h2>Artifacts</h2>${artifacts}` +
          (product.limitations.length ? `<h2>Limitations</h2><ul>` +
            product.limitations.map(item => `<li>${esc(item)}</li>`).join("") + `</ul>` : "") +
          (product.next_action ? `<h2>Next action</h2><p>${esc(product.next_action)}</p>` : "");
      }
    }
    if (tab === "tree") {
      window.__loops = {};
      (d.loops || []).forEach(l => { window.__loops[l.loop_id] = l; });
      const chip = (m, n) => `<span class="mchip ${m}">${m.replace(
        "non_deterministic", "model-backed")} ${n}</span>`;
      const draw = (n, depth) => {
        const modes = Object.entries(n.modes || {})
          .map(([m, c]) => chip(m, c)).join("");
        return `<div class="lnode" style="margin-left:${depth * 1.1}rem"
          tabindex="0" role="button"
          onclick="pickLoop('${esc(n.loop_id)}')">
          <b>${esc(n.loop_id)}</b> <span class="k">${esc(
            (n.goal || "").slice(0, 64))}</span>
          <span class="k">iter ${n.iterations || 0} · calls ${
            n.calls || 0} · ${esc(n.terminal || "running")}</span>
          ${modes}</div>` +
          (n.spawned_loops || []).map(c => draw(c, depth + 1)).join("");
      };
      body = `<div class="looptree">` +
        (d.tree_json || []).map(r => draw(r, 0)).join("") +
        `</div><p class="k">Select a loop to inspect what it was given, what
         it produced, and how it resolved each step.</p>`;
    }
    if (tab === "canvas") {
      const canvas = product.selected_canvas || {};
      const graph = canvas.loop_graph || {};
      const vertices = graph.vertices || [];
      body = vertices.length
        ? `<p class="k">Graph: <code>${esc(product.graph_digest)}</code></p>
          <div class="canvas">` + vertices.map(vertex =>
            `<div class="cnode"><b>${esc(vertex.vertex_id)}</b>
             <span class="k">${esc(vertex.purpose || "component")}</span>
             <span class="k">${esc(vertex.operation_ref || "controller")}</span>
             <span class="k">${esc(vertex.selected_mode || "")}</span></div>`).join("") +
          `</div><h2>Graph definition</h2><pre>${esc(canvas.mermaid || "")}</pre>`
        : `<div class="warnbox">This run recorded no Solution components.
           A run that only explored has no executable product graph.</div>`;
    }
    if (tab === "runtime") {
      const r = d.runtime || {};
      const spawned_loops = r.spawned_tasks || [], harnesses =
        r.external_harness_runs || [], mcp = r.mcp_calls || [],
        approvals = (r.effect_approvals || {}).items || [],
        artifacts = (r.context_artifacts || {}).items || [],
        compactions = (r.context_artifacts || {}).compactions || [],
        skillLoads = r.skill_loads || [];
      body = `<h2>Spawned tasks <span class="k">(${spawned_loops.length})</span></h2>` +
        (spawned_loops.length ? `<table><tr><th>task</th><th>profile</th>
          <th>mode</th><th>status</th><th class="num">updates</th>
          <th class="num">steps</th><th class="num">calls</th></tr>` +
          spawned_loops.map(c => `<tr><td>${esc(c.task_id)}</td>
            <td>${esc(c.profile)}</td><td>${esc(c.mode)}</td>
            <td>${esc(c.status)}</td><td class="num">${c.updates}</td>
            <td class="num">${c.steps_run}</td>
            <td class="num">${c.model_calls}</td></tr>`).join("") +
          `</table>` : `<p class="k">No spawned task lifecycle was recorded.</p>`) +
        `<h2>External harness runs <span class="k">(${harnesses.length})
          </span></h2>` + (harnesses.length ? `<table><tr><th>harness</th>
          <th>status</th><th>acceptance</th><th class="num">calls</th>
          <th class="num">tokens</th><th>accounting</th></tr>` +
          harnesses.map(h => `<tr><td>${esc(h.harness_id)}</td>
            <td>${esc(h.status)}</td><td>${esc(h.acceptance)}</td>
            <td class="num">${esc(h.physical_model_calls ?? "unknown")}</td>
            <td class="num">${esc(h.total_tokens ?? "unknown")}</td>
            <td>${h.accounting_complete ? "complete" : "incomplete"}</td>
            </tr>`).join("") + `</table>` :
          `<p class="k">No external harness summary was recorded.</p>`) +
        `<h2>MCP calls <span class="k">(${mcp.length})</span></h2>` +
        (mcp.length ? `<table><tr><th>server</th><th>tool</th><th>effect</th>
          <th>status</th><th>stored output</th></tr>` + mcp.map(c =>
          `<tr><td>${esc(c.server_id)}</td><td>${esc(c.tool_name)}</td>
          <td>${esc(c.effect)}</td><td>${esc(c.status)}</td>
          <td>${c.has_output_ref ? "yes" : "no"}</td></tr>`).join("") +
          `</table>` : `<p class="k">No MCP terminal result was recorded.</p>`) +
        `<h2>Effect approvals <span class="k">(${approvals.length})</span></h2>` +
        (approvals.length ? `<table><tr><th>request</th><th>effect</th>
          <th>operation</th><th>status</th><th>decision</th></tr>` +
          approvals.map(a => `<tr><td>${esc(a.request_id)}</td>
          <td>${esc(a.effect_class)}</td><td>${esc(a.operation)}</td>
          <td>${esc(a.status)}</td><td>${esc(a.action || "pending")}</td>
          </tr>`).join("") + `</table>` :
          `<p class="k">No effect approval lifecycle was recorded.</p>`) +
        `<h2>Context artifacts <span class="k">(${artifacts.length})</span></h2>` +
        (artifacts.length ? `<table><tr><th>digest</th><th class="num">bytes</th>
          <th>kind</th><th>offloaded</th></tr>` + artifacts.map(a =>
          `<tr><td>${esc(a.digest_prefix)}</td><td class="num">${a.byte_count}</td>
          <td>${esc(a.artifact_kind)}</td><td>${a.offloaded ? "yes" : "no"}</td>
          </tr>`).join("") + `</table>` :
          `<p class="k">No context artifact was recorded.</p>`) +
        `<p class="k">${compactions.length} compaction operation(s) recorded.</p>` +
        `<h2>Skill loads <span class="k">(${skillLoads.length})</span></h2>` +
        (skillLoads.length ? `<table><tr><th>skill</th><th>version</th>
          <th>lifecycle</th><th>status</th><th>manifest</th></tr>` +
          skillLoads.map(s => `<tr><td>${esc(s.skill_id)}</td>
          <td>${esc(s.version)}</td><td>${esc(s.lifecycle)}</td>
          <td>${esc(s.status)}</td><td>${esc(s.manifest_digest_prefix)}</td>
          </tr>`).join("") + `</table>` :
          `<p class="k">No skill load was recorded.</p>`) +
        (r.history_gaps || []).map(g =>
          `<div class="warnbox">${esc(g)}</div>`).join("");
    }
    const timeline = d.playback_events || d.events || [];
    if (tab === "playback") body = `<p class="k">${timeline.length} key event(s)
      from ${d.events.length} stored event(s).</p><div class="tl">
      <button onclick="stepEv(-1)" aria-label="previous event">◀</button>
      <button id="playbtn" onclick="togglePlay()" aria-label="play timeline">Play</button>
      <button onclick="stepEv(1)" aria-label="next event">▶</button>
      <label class="k">Speed <select id="speed" aria-label="playback speed">
        <option value="1000">0.5x</option><option value="500" selected>1x</option>
        <option value="250">2x</option><option value="100">5x</option>
      </select></label>
      <input type="range" id="scrub" aria-label="playback position"
        min="0" max="${Math.max(0,timeline.length - 1)}"
        value="0" oninput="showEv()"><span class="k" id="pos"></span></div>
      <div id="evs">` + timeline.map((e, i) =>
        `<div class="ev ${e.type === "model_invocation" ? "model" : ""}"
          id="ev${i}">[${i}] <b>${esc(e.type)}</b> ${esc(e.loop)}
          ${esc(e.step)} ${e.mode ? "(" + esc(e.mode) + ")" : ""}
          ${e.tokens ? "· " + e.tokens + " tok" : ""}
          <div class="k">${esc(e.detail)}</div></div>`).join("") + "</div>";
    if (tab === "calls") body = d.calls.length ? `<table><tr>
      <th class="num">#</th><th>loop</th><th>step</th><th>model</th>
      <th class="num">in</th><th class="num">out</th></tr>` +
      d.calls.map(c => `<tr class="row"><td class="num">${c.seq}</td>
        <td>${esc(c.loop)}</td><td>${esc(c.step)}</td><td>${esc(c.model)}
        </td><td class="num">${c.prompt_tokens}</td>
        <td class="num">${c.eval_tokens}</td></tr>`).join("") + "</table>"
      : `<p class="k">zero semantic calls, fully code-served</p>`;
    $("#main").innerHTML = `<h1>${esc(id)}</h1><div class="tabs">` +
      T.map(t => `<a href="#/runs/${encodeURIComponent(id)}/${t}"
        class="${t === tab ? "on" : ""}">${t}</a>`).join("") +
      `</div>` + body;
    window.showEv = () => { const i = +$("#scrub").value;
      document.querySelectorAll(".ev").forEach(e =>
        e.classList.remove("cur"));
      const el = $("#ev" + i); if (el) { el.classList.add("cur");
        el.scrollIntoView({block: "center"}); }
      $("#pos").textContent = timeline.length ?
        (i + 1) + " / " + timeline.length : "0 / 0"; };
    window.__playTimer = null;
    window.stepEv = delta => { const scrub = $("#scrub");
      scrub.value = Math.max(0, Math.min(timeline.length - 1,
        +scrub.value + delta)); showEv(); };
    window.togglePlay = () => { const button = $("#playbtn");
      if (window.__playTimer) { clearTimeout(window.__playTimer);
        window.__playTimer = null; button.textContent = "Play"; return; }
      button.textContent = "Pause";
      const advance = () => { const scrub = $("#scrub");
        if (+scrub.value >= timeline.length - 1) { window.__playTimer = null;
          button.textContent = "Play"; return; }
        scrub.value = +scrub.value + 1; showEv();
        window.__playTimer = setTimeout(advance, +$("#speed").value); };
      window.__playTimer = setTimeout(advance, +$("#speed").value); };
    if (tab === "playback" && timeline.length) showEv(); },

    <td class="num">${r.events}</td><td class="num">${r.calls}</td>
    <td class="num">${r.tokens}</td>
    <td>${r.intact ? "intact" : "<b>BROKEN</b>"}</td></tr>`).join("") +

// PATH routing with a hash fallback. The server serves the declared paths
// (GET /routes enumerates them), so a Studio URL is shareable and
// bookmarkable. A hash-only shell cannot be deep-linked into by anything
// that does not already run the page.
function currentParts() {
  if (location.hash.length > 2)
    return location.hash.replace(/^#\//, "").split("/").map(decodeURIComponent);
  const p = location.pathname.replace(/^\/(app\/?)?/, "").replace(/\/$/, "");
  return p ? p.split("/").map(decodeURIComponent) : [];
}

async function route() { inspect("");
  if (window.__playTimer) { clearTimeout(window.__playTimer);
    window.__playTimer = null; }
  const parts = currentParts();
  const page = parts[0] || "home"; nav(page);
  $("#status").textContent = "loading…";
  try {
    if (page === "runs" && parts[1]) await pages.run(parts[1], parts[2]);
    else if (pages[page]) await pages[page](parts[1]);
    else $("#main").innerHTML = "<h1>Not found</h1>";
    $("#status").textContent = "live · computed at request time";
  } catch (e) { $("#main").innerHTML = `<h1>Error</h1><pre>${esc(e)}</pre>`;
    $("#status").textContent = "error"; } }
// intercept in-app links so path navigation does not reload the shell
document.addEventListener("click", (e) => {
  const a = e.target.closest && e.target.closest("a[href^='/app']");
  if (!a) return;
  e.preventDefault();
  history.pushState({}, "", a.getAttribute("href"));
  route();
});
document.addEventListener("keydown", (event) => {
  const target = event.target.closest && event.target.closest('[role="button"]');
  if (!target || !["Enter", " "].includes(event.key)) return;
  event.preventDefault(); target.click();
});
function pickLoop(id) {
  const l = (window.__loops || {})[id];
  if (!l) return;
  const steps = (l.steps || []).map(s =>
    `<tr><td>${esc(s.step)}</td><td><span class="mchip ${esc(s.mode)}">${
      esc((s.mode || "").replace("non_deterministic", "model-backed"))
    }</span></td><td class="k">${esc(s.out)}</td></tr>`).join("");
  inspect(`<h2>${esc(l.loop_id)}</h2>
    <p class="k">${esc(l.goal || "(no goal recorded)")}</p>
    <table><tr><th>parent</th><td>${esc(l.parent || "root")}</td></tr>
    <tr><th>iterations</th><td>${l.iterations || 0}</td></tr>
    <tr><th>semantic calls</th><td>${l.calls || 0}</td></tr>
    <tr><th>tokens</th><td>${l.tokens || 0}</td></tr>
    <tr><th>terminal</th><td>${esc(l.terminal || "running")}</td></tr></table>
    <h3>steps</h3><table><tr><th>step</th><th>mode</th><th>output</th></tr>
    ${steps || "<tr><td colspan=3 class=k>no iterations recorded</td></tr>"}
    </table>`);
}

window.addEventListener("hashchange", route);
window.addEventListener("popstate", route);
route();
