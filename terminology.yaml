  Harness Intelligence:
    kind: technical_word
    definition: >-
      The provisioning view that serves authorized material from the four
      persistent layers to one harness assignment. It is a view, not a fifth
      persistent layer, and it is not the Intelligence Library, which is the
      searchable view every Loop uses.
    pattern: '\bHarness Intelligence\b'
    case_sensitive: true
    may_appear:
