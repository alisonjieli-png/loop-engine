schema_version: 1
terms:
  Loop:
    kind: canonical
    definition: The sole concrete public operational runtime and executable graph vertex.
  LoopDefinition:
    kind: canonical
    definition: Immutable versioned description bound to one Loop invocation.
  LoopDefinitionRecord:
    kind: canonical
    definition: Passive searchable catalog projection of a LoopDefinition.
  LoopInputCardinality:
    kind: canonical
    definition: Passive declaration of how many emissions one named input port accepts, independent of the consuming Loop's output cardinality.
  HarnessSelectionScope:
    kind: canonical
    definition: Immutable comparison scope binding the response contract, owning Loop definition, resource policy, execution settings, and evaluation obligation.
  HarnessTrialEvidence:
    kind: canonical
    definition: Immutable measured harness trial with an exact population, evaluator, subject, history identity, denominator, and nullable usage measurements.
  HarnessEvidenceReview:
    kind: canonical
    definition: Host-issued independent review bound to one exact harness trial; the record does not perform or invent the review.
  ReviewedHarnessEvidence:
    kind: canonical
    definition: One measured harness trial paired with its exact independent review decision.
  HarnessSelectionPolicy:
    kind: canonical
    definition: Versioned policy that ranks eligible authorized harnesses from matched reviewed evidence and preserves configured order when evidence is insufficient.
  HarnessSelectionDecision:
    kind: canonical
    definition: Passive recorded harness ordering with exclusions, measurements, evidence references, and the owning selection Loop identity.
  HarnessResponseEvaluator:
    kind: internal_only
    definition: Explicit trusted host callback binding for one versioned response obligation; it grants no model, tool, file, or task-acceptance authority.
  HarnessResponseEvaluation:
    kind: canonical
    definition: A verifier Loop's passed, rejected, or inconclusive assessment bound to the exact assignment and response digests.
  LoopComponentDefinition:
    kind: canonical
    definition: Passive versioned envelope for a semantic building block; never a runtime.
  LoopComponentRef:
    kind: canonical
    definition: Exact ID, version, digest, kind, scope, and compatibility pointer to a passive component.
  LoopValue:
    kind: canonical
    definition: Typed value with producer Loop, source refs, digest, lineage, privacy, materialization, and verification state.
  LoopValueRef:
    kind: canonical
    definition: Exact body-free identity for one value produced by a Loop; storage placement is resolved separately.
  InformationStorageBinding:
    kind: canonical
    definition: Passive physical materialization binding for one LoopValueRef; it grants no access and exposes no locator publicly.
  InformationResolver:
    kind: internal_only
    definition: Storage-neutral internal mechanic that checks scope, permission, size, contract, and digest before materializing a LoopValueRef.
  ReactiveLoopProfile:
    kind: canonical
    definition: Passive versioned composition of activation, admission, scheduling, persistence, exploration, portfolio, emission, serving, retention, and liveness policies.
  ReactiveSeriesDefinition:
    kind: canonical
    definition: Passive stable responsibility whose finite activations always execute through the canonical Loop runtime.
  TriggerEnvelope:
    kind: canonical
    definition: Passive typed information delta that may request one finite reactive activation but grants no authority.
  ActivationRecord:
    kind: canonical
    definition: Passive append-only lifecycle projection for one finite reactive Loop activation.
  WorkLease:
    kind: canonical
    definition: Passive expiring exclusive claim with a fencing token that prevents stale workers from committing.
  CandidateOutput:
    kind: canonical
    definition: Immutable output metadata from one finite Loop activation with an exact LoopValueRef payload.
  CandidateEvaluation:
    kind: canonical
    definition: Independent versioned assessment of one immutable CandidateOutput.
  OutputPortfolioSnapshot:
    kind: canonical
    definition: Immutable ranked view whose ranks belong to one exact policy and portfolio version.
  PluginBundleManifest:
    kind: canonical
    definition: Passive distribution manifest referencing exact admitted skills, profiles, capabilities, and Run History subscriptions; grants no authority.
  ResolvedPluginSnapshot:
    kind: canonical
    definition: Deterministic full-content and admission-bound plugin population selected for one run.
  ExtensionRoot:
    kind: canonical
    definition: Added-file directory resolved from explicit, environment, project, or user configuration without granting execution authority.
  ExtensionSnapshot:
    kind: canonical
    definition: Immutable secret-free view of provider routes, capability candidates, skill candidates, plugin bundles, and intelligence candidates discovered from added files.
  ProviderRouteBundle:
    kind: canonical
    definition: Passive exact provider and model route file composed into existing RuntimeSettings and ModelGateway contracts.
  ProviderAuthDefinition:
    kind: canonical
    definition: Passive secret-free description of how a provider credential is supplied; unsupported authentication remains inactive.
  ProviderEndpointDefinition:
    kind: canonical
    definition: Passive provider endpoint, model, protocol, output-limit, and authentication facts independent from an installed executor.
  ProviderSourceRef:
    kind: canonical
    definition: Passive exact source URL, fact class, and observation date supporting one provider route declaration.
  ExtensionApplicationRequest:
    kind: canonical
    definition: Passive request that combines exact RuntimeSettings, an ExtensionSnapshot, and explicit nonzero-cost route policy.
  ProductOutcomeRef:
    kind: canonical
    definition: Digest-bound reference from one Run History manifest to the exact saved solve outcome.
  SavedRunBundle:
    kind: canonical
    definition: Verified composition of one immutable Run History and its optional bound product outcome.
  CapabilityCandidate:
    kind: canonical
    definition: Passive added-file description of a possible capability and implementation reference; never executable merely because it was discovered.
  PlanDefinition:
    kind: canonical
    definition: Passive versioned planning contract containing an immutable original task reference, goal, scope, clarification dispositions, and typed task slices.
  TaskSliceDefinition:
    kind: canonical
    definition: Passive bounded unit of planned work with exact inputs, outputs, dependencies, activation path, concurrency contract, and verification obligations.
  TaskLoopBinding:
    kind: canonical
    definition: Task-conditioned exact operation, mode, and Solution Loop profile binding used to compile one task slice into LoopGraphDefinition.
  DevelopmentExecutionRequest:
    kind: canonical
    definition: Passive exact plan, task Loop bindings, attempt deltas, retry policies, and concurrency ceiling for one dependency-wave execution.
  TaskOperationOutput:
    kind: canonical
    definition: Typed task value, artifact references, covered criteria, verification evidence, and failure class returned by one Solution Loop attempt.
  SolveTerminalCode:
    kind: canonical
    definition: User-visible terminal vocabulary distinguishing verified completion, completed best-available resolution, operational interruption, and the exact constraint that prevented verification of the requested outcome.
  TaskResolutionPackage:
    kind: canonical
    definition: Complete useful response that preserves available evidence, analysis, assumptions, provisional outputs, missing or unverified material, alternatives, questions, and next actions without claiming the requested outcome was verified.
  ResolutionCompletionPolicy:
    kind: canonical
    definition: Passive policy requiring every safe reversible part of a task and a best-available resolution before a task-level stop, while prohibiting invented facts, authority, verification, or external effects.
  ResolutionMethodAssessment:
    kind: canonical
    definition: Typed disposition for one registered best-available-resolution method, with completed, not applicable, unavailable, authority-required, or resource-exhausted state and evidence references.
  OutcomeVector:
    kind: canonical
    definition: Tri-valued per-stage record separating response admission, observable process alignment, execution, expected and requested output satisfaction, local verification, material progress, continuation, downstream use, branch contribution, invalidation, and whole-task outcome.
  OutcomeVectorPolicy:
    kind: canonical
    definition: Passive policy requiring action-vector assessment and continued work while safe authorized action remains, without recording private model reasoning or granting authority.
  ActionIntentVector:
    kind: canonical
    definition: Passive projection of one admitted action's goal direction, expected state delta, verification condition, dependencies, fallback, and bounded decision coordinates.
  ActionVectorAssessment:
    kind: canonical
    definition: Subject-bound assessment of observable process checks, action and requested outputs, progress, and continuation that supplies signals to OutcomeVector without granting acceptance.
  ActionVectorRouteDecision:
    kind: canonical
    definition: Passive result of applying the outcome-vector continuation policy to a proposed route, with no task-acceptance or authority grant.
  MaterialQuestion:
    kind: canonical
    definition: Passive answerable clarification containing the exact question, material subject, reason, and feedback slot required before a solve can continue.
  WorkerAssignmentEnvelope:
    kind: canonical
    definition: Exact digest-bound child handoff carrying resolved workspace, settings, capabilities, extensions, context, authority, contracts, budget, and return destination.
  PlanningAuthority:
    kind: canonical
    definition: Parameterized policy stating when planning requires interaction, safe defaults, post-plan approval, low-risk autonomy, or parent Loop authority.
  ClarificationDisposition:
    kind: canonical
    definition: Typed classification that keeps must-answer, defaultable, delegated, derived, researchable, authority-required, and nonmaterial questions distinct.
  RequirementVerificationContract:
    kind: canonical
    definition: Evidence-first binding from one acceptance criterion to its verification operator, expected evidence, failure state, and independent-review requirement.
  LifecycleExtensionDefinition:
    kind: canonical
    definition: Passive exact declaration connecting one procedure-supported lifecycle event to a registered Loop definition and typed execution contract.
  ResolvedExtensionSetSnapshot:
    kind: canonical
    definition: Deterministically ordered procedure-scoped extension population with an exact semantic fingerprint and explicit empty state.
  ExecutionContextFingerprint:
    kind: canonical
    definition: Bounded set of separate semantic digests for plan, extensions, capabilities, settings, context, intelligence, environment, and verification policy.
  RetryPolicy:
    kind: canonical
    definition: Passive bounded retry rule whose attempts depend on failure class and require a materially executable delta.
  PublicationAuthorization:
    kind: canonical
    definition: Independent approval bound to one exact verified target and one commit, push, pull-request, package-publication, or deployment effect.
  LLMWorkPacket:
    kind: canonical
    definition: Passive provider-neutral component packet for one bounded semantic model step.
  PractitionerStallSignal:
    kind: canonical
    definition: Passive deterministic evidence that progress requires semantic diagnosis; never a terminal decision.
  FailureDiagnosis:
    kind: canonical
    definition: Passive typed model result that identifies evidenced causes, failed strategy, missing context, and invalid assumptions.
  RecoveryProposal:
    kind: canonical
    definition: Passive candidate changed strategy with capability requirements, expected progress, risk, and follow-up budget.
  PractitionerRecoveryDirective:
    kind: canonical
    definition: Passive independently selected and runtime-validated recovery proposal carried into later next-action work.
  QualificationCase:
    kind: canonical
    definition: Passive versioned black-box proof obligation for one component, interaction, state transition, or architecture classification.
  AtomicPrimitiveDefinition:
    kind: canonical
    definition: Passive description of one small semantic operation that defaults to deterministic Loop execution.
  IntrinsicKernel:
    kind: internal_only
    definition: Finite audited native substrate beneath atomic Loops; owns no task, provider, storage, policy, permission, or routing semantics.
  LoopGraphDefinition:
    kind: canonical
    definition: The one authoritative reusable executable graph contract.
  StageOccurrenceIdentity:
    kind: canonical
    definition: Passive exact identity for one semantic-call occurrence inside one Loop activation; separate activation and semantic-call references exclude similarity signatures and physical retries.
  StageRetrievalSnapshot:
    kind: canonical
    definition: Passive immutable portfolio of prior-stage candidates considered for one exact occurrence; every candidate remains prior evidence rather than proof.
  StageAssistanceExperimentSpec:
    kind: canonical
    definition: Passive versioned definition for one advisory-versus-fresh stage-assistance comparison.
  PairedStageAssistanceTrial:
    kind: canonical
    definition: Passive pair of distinct stage occurrences that share one source-state digest, semantic signature, shape signature, graph version, and experiment reference.
  StageExperimentAssignment:
    kind: canonical
    definition: Passive retry-stable binding of one paired-trial occurrence to exactly one advisory or fresh arm.
  StageExposureManifest:
    kind: canonical
    definition: Passive record binding one assignment to the exact packet event and the prior-stage references recorded as retrieved and exposed.
  StageAssistanceDecision:
    kind: canonical
    definition: Passive solver disposition to use, modify, combine, ignore, hydrate, start fresh from, or challenge prior-stage candidates.
  StageTrialOutcome:
    kind: canonical
    definition: Passive outcome link joining one occurrence, experiment, trial, assignment, exposure, decision, evaluation, metric, run-validity state, cost, latency, and usage.
  SQLiteStageEvidenceProjection:
    kind: internal_only
    definition: Idempotent SQLite/WAL query projection rebuilt from committed intact Run History events; never an evidence or execution authority.
  IntelligenceItemRef:
    kind: canonical
    definition: Passive body-free pointer to one intelligence item and its compatibility facts.
  IntelligenceItemPackage:
    kind: canonical
    definition: Passive lazy package for one intelligence item; never a runtime.
  LoopRef:
    kind: compatibility_alias
    definition: Pre-1.0 alias for IntelligenceItemRef.
    replacement: IntelligenceItemRef
  LoopCapsule:
    kind: compatibility_alias
    definition: Pre-1.0 alias for IntelligenceItemPackage.
    replacement: IntelligenceItemPackage
  Node:
    kind: conceptual_only
    definition: Ontological category and package namespace.
    concrete_class_allowed: false
  LoopProfile:
    kind: canonical
    definition: Versioned passive behavior specification selected by a Loop.
  LoopProfileRef:
    kind: canonical
    definition: Exact versioned reference to one Loop profile.
  IntelligenceAccessPolicy:
    kind: canonical
    definition: Hard constraints on what may be queried, returned, or exposed.
  IntelligenceSeekingStrategy:
    kind: canonical
    definition: Declarative search, expansion, challenge, selection, and stopping behavior.
  IntelligenceQueryProfile:
    kind: canonical
    definition: Reusable soft preferences and ranking parameters.
  CatalogRecord:
    kind: canonical
    definition: Passive persistent record at rest. Not a Node.
legacy_serialized_terms:
  loop_node:
    maps_to: LoopDefinitionRecord
    reader: loop_engine.ontology.loop_node.read_legacy_loop_node_record
    may_emit: false
  loop_node_preset:
    maps_to: LoopProfile
    may_emit: false
  resolved_loop_node_plan:
    maps_to: LoopDefinition
    may_emit: false
deprecated_terms:
  CodeNode:
    replacement: Loop with a code-execution role profile
    forbidden_in_new_code: true
forbidden_class_names:
- Node
- LoopNode
- ConfigurationNode
- StringNode
- CodeNode
- PractitionerNode
- IntelligenceNode
- SolutionNode
qualified_terms:
  memory:
    allowed:
    - RuntimeMemory
    - RunHistory
    - Checkpoint
    - Cache
  store:
    allowed:
    - RecordStore
    - BlobStore
    - CandidateStore
    - RunHistoryStore
  version:
    allowed:
    - engine_version
    - ontology_version
    - schema_version
    - definition_version
    - plugin_version
    - protocol_version
    - implementation_version
vocabulary_schema_version: vocabulary_placement/v1
vocabulary_note: >-
  This file is the single structured source for the words the repository uses.
  A term states its kind, its definition, where it may appear, where it must
  not appear and its status. The product style guide, humanizer-context.md and
  the names and nomenclature standard point here instead of repeating the
  list. The gate vocabulary_and_placement_violations in
  loop_engine.nomenclature_conformance reads these sections.
surfaces:
  public_website_pages:
    definition: >-
      The homepage, the How it works view and the shared footer of the served
      website. A customer reads these without any technical background.
    enforcement: checked
    html_page: src/loop_engine/core/service_runtime/web_assets/index.html
    html_regions:
    - view:home
    - view:about
    - footer
  website_documentation_view:
    definition: >-
      The Documentation view of the served website and the runtime vocabulary
      template it shows. Exact runtime terms belong here.
    enforcement: declared_only
    html_page: src/loop_engine/core/service_runtime/web_assets/index.html
    html_regions:
    - view:docs
    - template:runtime-vocabulary-template
  website_application_views:
    definition: >-
      The signed-in views of the served website: sign in, registration,
      workspace, account, administration, client connection, first example and
      access and data.
    enforcement: declared_only
    html_page: src/loop_engine/core/service_runtime/web_assets/index.html
    html_regions:
    - view:login
    - view:signup
    - view:workspace
    - view:account
    - view:admin
    - view:setup
    - view:examples
    - view:security
  technical_documents:
    definition: >-
      Markdown under docs/ and the instruction files in the repository root.
      These keep the exact runtime terms and their complete definitions.
    enforcement: checked
    document_paths:
    - AGENTS.md
    - ASTRA.md
    - CHANGELOG.md
    - CONTRIBUTING.md
    - README.md
    - SECURITY.md
    - humanizer-context.md
    - docs
    document_exclusions:
    - docs/evidence
    - docs/prompts
    - docs/verification
  source_code:
    definition: >-
      Python, JavaScript, YAML and JSON inside src/, tools/ and devtools/.
      Exact code identifiers live here and prose never renames them.
    enforcement: declared_only
  command_output:
    definition: What the installed loop-engine command prints to a terminal.
    enforcement: declared_only
  customer_configuration:
    definition: >-
      Client settings a customer copies, the environment variable names in
      them, and the credentials the service issues.
    enforcement: declared_only
placement_defaults:
  canonical:
    may_appear:
    - source_code
    - technical_documents
    - website_documentation_view
    - command_output
    must_not_appear:
    - public_website_pages
    status: current
  internal_only:
    may_appear:
    - source_code
    - technical_documents
    must_not_appear:
    - public_website_pages
    - website_application_views
    status: current
  compatibility_alias:
    may_appear:
    - source_code
    - technical_documents
    must_not_appear:
    - public_website_pages
    - website_application_views
    - website_documentation_view
    status: compatibility_only
  conceptual_only:
    may_appear:
    - technical_documents
    - website_documentation_view
    must_not_appear:
    - public_website_pages
    status: current
vocabulary:
  Baltor:
    kind: public_brand
    definition: >-
      The public brand. It names the product, the website and the hosted
      service as a customer sees them. It never replaces a code identifier, a
      package name, a record type, a contract field or the repository name.
    pattern: '\bBaltor\b'
    case_sensitive: true
    may_appear:
    - public_website_pages
    - website_application_views
    - website_documentation_view
    - technical_documents
    - command_output
    - customer_configuration
    must_not_appear: []
    status: decided_by_the_owner
  Loop Engine:
    kind: technical_name
    definition: >-
      The repository, the engine, the Python distribution and command
      loop-engine, and the Python import loop_engine.
    pattern: '\bLoop Engine\b'
    case_sensitive: true
    may_appear:
    - source_code
    - technical_documents
    - website_documentation_view
    - command_output
    must_not_appear:
    - public_website_pages
    status: decided_by_the_owner
  Building with Loops:
    kind: readme_title
    definition: The title of the public README. It is not a product name.
    pattern: '\bBuilding with Loops\b'
    case_sensitive: true
    may_appear:
    - technical_documents
    must_not_appear:
    - public_website_pages
    status: decided_by_the_owner
  Loop:
    kind: technical_word
    definition: >-
      The sole operational runtime type and the only executable graph vertex.
      A customer-facing page calls the same thing a step.
    pattern: '\bLoops?\b'
    case_sensitive: true
    may_appear:
    - source_code
    - technical_documents
    - website_documentation_view
    - command_output
    must_not_appear:
    - public_website_pages
    status: decided_by_the_owner
  Loop node:
    kind: technical_word
    definition: >-
      The graph-vertex wording used inside the phrase discrete cognitive or
      act step Loop node. It never names a runtime class of its own.
    pattern: '\bLoop nodes?\b'
    case_sensitive: true
    may_appear:
    - technical_documents
    - website_documentation_view
    must_not_appear:
    - public_website_pages
    status: decided_by_the_owner
  discrete cognitive or act step Loop node:
    kind: technical_phrase
    definition: >-
      An independently governed instance of the Loop runtime responsible for
      one clearly defined cognitive step or action. Write the phrase in full
      and keep it beside its complete behavioral explanation in ASTRA.md. Do
      not shorten it, remove the word node or replace the explanation with a
      label.
    pattern: '\bdiscrete cognitive or act step Loop node\b'
    case_sensitive: true
    may_appear:
    - technical_documents
    - website_documentation_view
    must_not_appear:
    - public_website_pages
    status: decided_by_the_owner
  Practitioner:
    kind: technical_word
    definition: >-
      The Loop role that plans, builds and verifies work. Written in full as
      Practitioner Loop when the sentence names a running instance.
    pattern: '\bPractitioners?\b'
    case_sensitive: true
    may_appear:
    - source_code
    - technical_documents
    - website_documentation_view
    - command_output
    must_not_appear:
    - public_website_pages
    status: decided_by_the_owner
  Intelligence Loop:
    kind: technical_word
    definition: >-
      A Loop in the Intelligence role. The bare word Intelligence is not a
      reserved technical word, because the four layer names are public.
    pattern: '\bIntelligence Loops?\b'
    case_sensitive: true
    may_appear:
    - source_code
    - technical_documents
    - website_documentation_view
    must_not_appear:
    - public_website_pages
    status: decided_by_engineering_2026_09_21
  Solution Loop:
    kind: technical_word
    definition: A Loop in the Solution role, represented in a Solution Canvas.
    pattern: '\bSolution Loops?\b'
    case_sensitive: true
    may_appear:
    - source_code
    - technical_documents
    - website_documentation_view
    must_not_appear:
    - public_website_pages
    status: current
  Solution Canvas:
    kind: technical_word
    definition: The declarative reusable solution that runs for a new input.
    pattern: '\bSolution Canvas\b'
    case_sensitive: true
    may_appear:
    - source_code
    - technical_documents
    - website_documentation_view
    must_not_appear:
    - public_website_pages
    status: current
  role profile:
    kind: technical_word
    definition: >-
      The versioned behavior preset a Loop uses, carried by LoopProfileSpec.
      It is not the step profile, the effort setting or the operating
      settings.
    pattern: '\brole profiles?\b'
    case_sensitive: false
    may_appear:
    - source_code
    - technical_documents
    - website_documentation_view
    must_not_appear:
    - public_website_pages
    status: current
  run mode:
    kind: technical_word
    definition: >-
      How a Loop is allowed to resolve its work: deterministic, hybrid or
      non-deterministic.
    pattern: '\brun modes?\b'
    case_sensitive: false
    may_appear:
    - source_code
    - technical_documents
    - website_documentation_view
    must_not_appear:
    - public_website_pages
    status: current
  step profile:
    kind: technical_word
    definition: >-
      The number, order and repetition of the steps a Loop may run. Carried by
      the fields framework and custom_steps.
    pattern: '\bstep profiles?\b'
    case_sensitive: false
    may_appear:
    - source_code
    - technical_documents
    - website_documentation_view
    must_not_appear:
    - public_website_pages
    status: current
  runtime classification:
    kind: technical_word
    definition: >-
      The tree of runtime type, relationship, role, profile, mode, contract,
      conditions, budget and records.
    pattern: '\bruntime classification\b'
    case_sensitive: false
    may_appear:
    - technical_documents
    - website_documentation_view
    must_not_appear:
    - public_website_pages
    status: current
  effort setting:
    kind: technical_word
    definition: >-
      Bounded work limits for one Loop. The code field is LoopConfig.power and
      its values are light, standard, deep and max. It is not thinking power.
      Write effort setting, not effort budget and not bare power.
    pattern: '\beffort settings?\b'
    case_sensitive: false
    may_appear:
    - source_code
    - technical_documents
    - website_documentation_view
    must_not_appear:
    - public_website_pages
    status: decided_by_engineering_2026_09_21
  thinking power:
    kind: technical_word
    definition: >-
      The model effort a hybrid or non-deterministic Loop asks a provider for.
      The code field is llm_thinking_power and its values are small, medium,
      high, max and specialized. It is not the effort setting.
    pattern: '\bthinking power\b'
    case_sensitive: false
    may_appear:
    - source_code
    - technical_documents
    - website_documentation_view
    must_not_appear:
    - public_website_pages
    status: decided_by_engineering_2026_09_21
  operating settings:
    kind: technical_word
    definition: >-
      Permissions, access, providers and optimization preferences, carried by
      OperatingProfile.
    pattern: '\boperating settings\b'
    case_sensitive: false
    may_appear:
    - source_code
    - technical_documents
    must_not_appear:
    - public_website_pages
    status: current
  Run History:
    kind: technical_word
    definition: The saved event history of a run, used for reports and playback.
    pattern: '\bRun History\b'
    case_sensitive: true
    may_appear:
    - source_code
    - technical_documents
    - website_documentation_view
    - command_output
    must_not_appear:
    - public_website_pages
    status: current
  Runtime Memory:
    kind: technical_word
    definition: >-
      The temporary note board scoped to one run. It is separate from the four
      persistent intelligence layers and is not a fifth layer.
    pattern: '\bRuntime Memory\b'
    case_sensitive: true
    may_appear:
    - source_code
    - technical_documents
    - website_documentation_view
    must_not_appear:
    - public_website_pages
    status: current
  prompt cycle:
    kind: technical_word
    definition: One request and response between a harness and a model provider.
    pattern: '\bprompt cycles?\b'
    case_sensitive: false
    may_appear:
    - technical_documents
    - website_documentation_view
    must_not_appear:
    - public_website_pages
    status: current
  harness:
    kind: customer_word
    definition: >-
      The customer's own program that calls a model and runs tools, for
      example OpenCode, Codex or Claude Code. The owner's category line
      harness and agent optimized operation puts this word on the public
      pages, so it is no longer refused there.
    pattern: '\bharness(?:es)?\b'
    case_sensitive: false
    may_appear:
    - public_website_pages
    - website_application_views
    - website_documentation_view
    - technical_documents
    - source_code
    - command_output
    must_not_appear: []
    status: decided_by_the_owner_2026_09_20
  agent:
    kind: customer_word
    definition: >-
      The customer's model-driven program that performs work. The owner's
      category line puts this word on the public pages.
    pattern: '\bagents?\b'
    case_sensitive: false
    may_appear:
    - public_website_pages
    - website_application_views
    - website_documentation_view
    - technical_documents
    - source_code
    must_not_appear: []
    status: decided_by_the_owner_2026_09_20
  harness and agent optimized operation:
    kind: public_category_line
    definition: >-
      The owner's positioning phrase for what Baltor does. Use it in the words
      the owner chose. It is a category line, not a measured claim.
