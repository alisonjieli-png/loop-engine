schema_version: 1
terms:
  Loop:
    kind: canonical
    definition: The sole concrete public operational runtime and executable graph vertex.
  LoopDefinition:
    kind: canonical
    definition: Immutable versioned description bound to one Loop invocation.
  LoopDefinitionRecord:
    kind: canonical
    definition: Passive searchable catalog projection of a LoopDefinition.
  LoopComponentDefinition:
    kind: canonical
    definition: Passive versioned envelope for a semantic building block; never a runtime.
  LoopComponentRef:
    kind: canonical
    definition: Exact ID, version, digest, kind, scope, and compatibility pointer to a passive component.
  LoopValue:
    kind: canonical
    definition: Typed value with producer Loop, source refs, digest, lineage, privacy, materialization, and verification state.
  LoopValueRef:
    kind: canonical
    definition: Exact body-free identity for one value produced by a Loop; storage placement is resolved separately.
  InformationStorageBinding:
    kind: canonical
    definition: Passive physical materialization binding for one LoopValueRef; it grants no access and exposes no locator publicly.
  InformationResolver:
    kind: internal_only
    definition: Storage-neutral internal mechanic that checks scope, permission, size, contract, and digest before materializing a LoopValueRef.
  ReactiveLoopProfile:
    kind: canonical
    definition: Passive versioned composition of activation, admission, scheduling, persistence, exploration, portfolio, emission, serving, retention, and liveness policies.
  ReactiveSeriesDefinition:
    kind: canonical
    definition: Passive stable responsibility whose finite activations always execute through the canonical Loop runtime.
  TriggerEnvelope:
    kind: canonical
    definition: Passive typed information delta that may request one finite reactive activation but grants no authority.
  ActivationRecord:
    kind: canonical
    definition: Passive append-only lifecycle projection for one finite reactive Loop activation.
  WorkLease:
    kind: canonical
    definition: Passive expiring exclusive claim with a fencing token that prevents stale workers from committing.
  CandidateOutput:
    kind: canonical
    definition: Immutable output metadata from one finite Loop activation with an exact LoopValueRef payload.
  CandidateEvaluation:
    kind: canonical
    definition: Independent versioned assessment of one immutable CandidateOutput.
  OutputPortfolioSnapshot:
    kind: canonical
    definition: Immutable ranked view whose ranks belong to one exact policy and portfolio version.
  PluginBundleManifest:
    kind: canonical
    definition: Passive distribution manifest referencing exact admitted skills, profiles, capabilities, and Run History subscriptions; grants no authority.
  ResolvedPluginSnapshot:
    kind: canonical
    definition: Deterministic full-content and admission-bound plugin population selected for one run.
  ExtensionRoot:
    kind: canonical
    definition: Added-file directory resolved from explicit, environment, project, or user configuration without granting execution authority.
  ExtensionSnapshot:
    kind: canonical
    definition: Immutable secret-free view of provider routes, capability candidates, skill candidates, plugin bundles, and intelligence candidates discovered from added files.
  ProviderRouteBundle:
    kind: canonical
    definition: Passive exact provider and model route file composed into existing RuntimeSettings and ModelGateway contracts.
  ProviderAuthDefinition:
    kind: canonical
    definition: Passive secret-free description of how a provider credential is supplied; unsupported authentication remains inactive.
  ProviderEndpointDefinition:
    kind: canonical
    definition: Passive provider endpoint, model, protocol, output-limit, and authentication facts independent from an installed executor.
  ProviderSourceRef:
    kind: canonical
    definition: Passive exact source URL, fact class, and observation date supporting one provider route declaration.
  ExtensionApplicationRequest:
    kind: canonical
    definition: Passive request that combines exact RuntimeSettings, an ExtensionSnapshot, and explicit nonzero-cost route policy.
  ProductOutcomeRef:
    kind: canonical
    definition: Digest-bound reference from one Run History manifest to the exact saved solve outcome.
  SavedRunBundle:
    kind: canonical
    definition: Verified composition of one immutable Run History and its optional bound product outcome.
  CapabilityCandidate:
    kind: canonical
    definition: Passive added-file description of a possible capability and implementation reference; never executable merely because it was discovered.
  PlanDefinition:
    kind: canonical
    definition: Passive versioned planning contract containing an immutable original task reference, goal, scope, clarification dispositions, and typed task slices.
  TaskSliceDefinition:
    kind: canonical
    definition: Passive bounded unit of planned work with exact inputs, outputs, dependencies, activation path, concurrency contract, and verification obligations.
  TaskLoopBinding:
    kind: canonical
    definition: Task-conditioned exact operation, mode, and Solution Loop profile binding used to compile one task slice into LoopGraphDefinition.
  DevelopmentExecutionRequest:
    kind: canonical
    definition: Passive exact plan, task Loop bindings, attempt deltas, retry policies, and concurrency ceiling for one dependency-wave execution.
  TaskOperationOutput:
    kind: canonical
    definition: Typed task value, artifact references, covered criteria, verification evidence, and failure class returned by one Solution Loop attempt.
  SolveTerminalCode:
    kind: canonical
    definition: User-visible terminal vocabulary distinguishing verified completion, material blockers, authority, capability, provider, verification, repair, progress, budget, deadline, abstention, and cancellation.
  MaterialQuestion:
    kind: canonical
    definition: Passive answerable clarification containing the exact question, material subject, reason, and feedback slot required before a solve can continue.
  WorkerAssignmentEnvelope:
    kind: canonical
    definition: Exact digest-bound child handoff carrying resolved workspace, settings, capabilities, extensions, context, authority, contracts, budget, and return destination.
  PlanningAuthority:
    kind: canonical
    definition: Parameterized policy stating when planning requires interaction, safe defaults, post-plan approval, low-risk autonomy, or parent Loop authority.
  ClarificationDisposition:
    kind: canonical
    definition: Typed classification that keeps must-answer, defaultable, delegated, derived, researchable, authority-required, and nonmaterial questions distinct.
  RequirementVerificationContract:
    kind: canonical
    definition: Evidence-first binding from one acceptance criterion to its verification operator, expected evidence, failure state, and independent-review requirement.
  LifecycleExtensionDefinition:
    kind: canonical
    definition: Passive exact declaration connecting one procedure-supported lifecycle event to a registered Loop definition and typed execution contract.
  ResolvedExtensionSetSnapshot:
    kind: canonical
    definition: Deterministically ordered procedure-scoped extension population with an exact semantic fingerprint and explicit empty state.
  ExecutionContextFingerprint:
    kind: canonical
    definition: Bounded set of separate semantic digests for plan, extensions, capabilities, settings, context, intelligence, environment, and verification policy.
  RetryPolicy:
    kind: canonical
    definition: Passive bounded retry rule whose attempts depend on failure class and require a materially executable delta.
  PublicationAuthorization:
    kind: canonical
    definition: Independent approval bound to one exact verified target and one commit, push, pull-request, package-publication, or deployment effect.
  LLMWorkPacket:
    kind: canonical
    definition: Passive provider-neutral component packet for one bounded semantic model step.
  PractitionerStallSignal:
    kind: canonical
    definition: Passive deterministic evidence that progress requires semantic diagnosis; never a terminal decision.
  FailureDiagnosis:
    kind: canonical
    definition: Passive typed model result that identifies evidenced causes, failed strategy, missing context, and invalid assumptions.
  RecoveryProposal:
    kind: canonical
    definition: Passive candidate changed strategy with capability requirements, expected progress, risk, and follow-up budget.
  PractitionerRecoveryDirective:
    kind: canonical
    definition: Passive independently selected and runtime-validated recovery proposal carried into later next-action work.
  QualificationCase:
    kind: canonical
    definition: Passive versioned black-box proof obligation for one component, interaction, state transition, or architecture classification.
  AtomicPrimitiveDefinition:
    kind: canonical
    definition: Passive description of one small semantic operation that defaults to deterministic Loop execution.
  IntrinsicKernel:
    kind: internal_only
    definition: Finite audited native substrate beneath atomic Loops; owns no task, provider, storage, policy, permission, or routing semantics.
  LoopGraphDefinition:
    kind: canonical
    definition: The one authoritative reusable executable graph contract.
  StageOccurrenceIdentity:
    kind: canonical
    definition: Passive exact identity for one semantic-call occurrence inside one Loop activation; separate activation and semantic-call references exclude similarity signatures and physical retries.
  StageRetrievalSnapshot:
    kind: canonical
    definition: Passive immutable portfolio of prior-stage candidates considered for one exact occurrence; every candidate remains prior evidence rather than proof.
  StageAssistanceExperimentSpec:
    kind: canonical
    definition: Passive versioned definition for one advisory-versus-fresh stage-assistance comparison.
  PairedStageAssistanceTrial:
    kind: canonical
    definition: Passive pair of distinct stage occurrences that share one source-state digest, semantic signature, shape signature, graph version, and experiment reference.
  StageExperimentAssignment:
    kind: canonical
    definition: Passive retry-stable binding of one paired-trial occurrence to exactly one advisory or fresh arm.
  StageExposureManifest:
    kind: canonical
    definition: Passive record binding one assignment to the exact packet event and the prior-stage references recorded as retrieved and exposed.
  StageAssistanceDecision:
    kind: canonical
    definition: Passive solver disposition to use, modify, combine, ignore, hydrate, start fresh from, or challenge prior-stage candidates.
  StageTrialOutcome:
    kind: canonical
    definition: Passive outcome link joining one occurrence, experiment, trial, assignment, exposure, decision, evaluation, metric, run-validity state, cost, latency, and usage.
  SQLiteStageEvidenceProjection:
    kind: internal_only
    definition: Idempotent SQLite/WAL query projection rebuilt from committed intact Run History events; never an evidence or execution authority.
  IntelligenceItemRef:
    kind: canonical
    definition: Passive body-free pointer to one intelligence item and its compatibility facts.
  IntelligenceItemPackage:
    kind: canonical
    definition: Passive lazy package for one intelligence item; never a runtime.
  LoopRef:
    kind: compatibility_alias
    definition: Pre-1.0 alias for IntelligenceItemRef.
    replacement: IntelligenceItemRef
  LoopCapsule:
    kind: compatibility_alias
    definition: Pre-1.0 alias for IntelligenceItemPackage.
    replacement: IntelligenceItemPackage
  Node:
    kind: conceptual_only
    definition: Ontological category and package namespace.
    concrete_class_allowed: false
  LoopProfile:
    kind: canonical
    definition: Versioned passive behavior specification selected by a Loop.
  LoopProfileRef:
    kind: canonical
    definition: Exact versioned reference to one Loop profile.
  FunctionalIntelligenceDomain:
    kind: canonical
    cardinality: many
  IntelligenceAccessPolicy:
    kind: canonical
    definition: Hard constraints on what may be queried, returned, or exposed.
  IntelligenceSeekingStrategy:
    kind: canonical
    definition: Declarative search, expansion, challenge, selection, and stopping behavior.
  IntelligenceQueryProfile:
    kind: canonical
    definition: Reusable soft preferences and ranking parameters.
  CatalogRecord:
    kind: canonical
    definition: Passive persistent record at rest. Not a Node.
legacy_serialized_terms:
  loop_node:
    maps_to: LoopDefinitionRecord
    reader: loop_engine.ontology.loop_node.read_legacy_loop_node_record
    may_emit: false
  loop_node_preset:
    maps_to: LoopProfile
    may_emit: false
  resolved_loop_node_plan:
    maps_to: LoopDefinition
    may_emit: false
deprecated_terms:
  CodeNode:
    replacement: Loop with a code-execution role profile
    forbidden_in_new_code: true
forbidden_class_names:
- Node
- LoopNode
- ConfigurationNode
- StringNode
- CodeNode
- PractitionerNode
- IntelligenceNode
- SolutionNode
qualified_terms:
  memory:
    allowed:
    - RuntimeMemory
    - ExperienceIntelligence
    - Checkpoint
    - Cache
  store:
    allowed:
    - RecordStore
    - BlobStore
    - CandidateStore
    - RunHistoryStore
  version:
    allowed:
    - engine_version
    - ontology_version
    - schema_version
    - definition_version
    - plugin_version
    - protocol_version
    - implementation_version
semantic_schema_version: semantic_constitution/v1
semantic_categories:
  component:
    definition: Versioned typed semantic building block that is passive unless an executable definition is instantiated through Loop.
    preferred_suffixes:
    - ComponentDefinition
    - ComponentRef
  runtime:
    definition: Stateful executable object with governed identity and lifecycle.
    preferred_suffixes:
    - Loop
    - Runtime
  operation:
    definition: Governed or pure work performed through a declared contract.
    preferred_suffixes: []
  definition:
    definition: Immutable versioned description of permitted behavior.
    preferred_suffixes:
    - Definition
    - Spec
  contract:
    definition: Typed compatibility and acceptance boundary.
    preferred_suffixes:
    - Contract
  request:
    definition: Passive validated input for one operation.
    preferred_suffixes:
    - Request
  context:
    definition: Scoped runtime identity, cancellation, deadline, and authority state.
    preferred_suffixes:
    - Context
  record:
    definition: Passive persisted or observed fact with identity and provenance.
    preferred_suffixes:
    - Record
    - Evidence
  snapshot:
    definition: Immutable point-in-time projection of selected state.
    preferred_suffixes: []
  reference:
    definition: Exact pointer to another object; never its full body.
    preferred_suffixes:
    - Ref
    - Reference
  policy:
    definition: Hard permission, eligibility, budget, or effect constraint.
    preferred_suffixes:
    - Policy
  preference:
    definition: Soft choice that never grants authority.
    preferred_suffixes: []
  strategy:
    definition: Replaceable algorithm or search behavior under one contract.
    preferred_suffixes:
    - Strategy
  profile:
    definition: Versioned reusable behavior and preference configuration.
    preferred_suffixes:
    - Profile
    - ProfileSpec
    - ProfileRef
  procedure:
    definition: Typed step, graph, state-machine, or bounded-cycle description.
    preferred_suffixes: []
  service:
    definition: Stateful implementation boundary used by an owning runtime.
    preferred_suffixes:
    - Service
    - Gateway
    - Directory
  adapter:
    definition: Protocol-specific implementation behind a provider-neutral boundary.
    preferred_suffixes:
    - Adapter
    - Port
  provider:
    definition: External or local service implementation identity.
    preferred_suffixes: []
  route:
    definition: Configured path to an exact provider or deployment.
    preferred_suffixes: []
  capability:
    definition: Declared operation that may be selected after compatibility checks.
    preferred_suffixes: []
  tool:
    definition: Invocable capability with typed input, output, permission, and effects.
    preferred_suffixes: []
  plugin:
    definition: Versioned extension contribution and provenance mechanism.
    preferred_suffixes: []
  registry:
    definition: Exact identity resolution authority.
    preferred_suffixes: []
  catalog:
    definition: Logical discovery and query surface over records.
    preferred_suffixes: []
  store:
    definition: Physical persistence authority for records in a declared scope.
    preferred_suffixes:
    - Store
    - Journal
    - Catalog
  index:
    definition: Rebuildable query materialization traceable to canonical records.
    preferred_suffixes:
    - Index
    - Materialization
  cache:
    definition: Discardable acceleration that owns no canonical identity.
    preferred_suffixes: []
  artifact:
    definition: Digest-addressed body or output stored outside small events.
    preferred_suffixes: []
  event:
    definition: One chronological typed fact in Run History.
    preferred_suffixes: []
  history:
    definition: Canonical append-only evidence of governed runtime events.
    preferred_suffixes:
    - RunHistory
    - Event
  memory:
    definition: Bounded working state or reviewed reusable experience, claim, or procedure.
    preferred_suffixes:
    - Memory
    - MemoryRecord
  candidate:
    definition: Unapproved proposed reusable knowledge or behavior.
    preferred_suffixes:
    - Candidate
  active_intelligence:
    definition: Independently reviewed and promoted reusable intelligence.
    preferred_suffixes: []
  result:
    definition: Typed outcome of one completed or refused operation.
    preferred_suffixes:
    - Result
    - Outcome
    - Decision
  report:
    definition: Read-only projection of canonical records and results.
    preferred_suffixes: []
  renderer:
    definition: Formatting implementation that cannot re-derive business facts.
    preferred_suffixes: []
  evaluator:
    definition: Independent contract-matched assessment implementation.
    preferred_suffixes: []
  benchmark:
    definition: Frozen task population, conditions, evaluator, and measured result.
    preferred_suffixes:
    - Benchmark
    - Campaign
    - Trial
  scenario:
    definition: Passive capability-proof task definition, not achieved evidence.
    preferred_suffixes: []
  settings:
    definition: Validated user or organization configuration; never runtime authority by itself.
    preferred_suffixes:
    - Settings
    - Defaults
    - Override
  builder:
    definition: Passive construction or comparison object that produces an authoritative definition.
    preferred_suffixes:
    - Canvas
    - Builder
    - Candidate
  ontology_category:
    definition: Abstract classification used to organize concepts; never executable.
    preferred_suffixes: []
component_ontology:
  source_of_truth: src/loop_engine/data/component_ontology.yaml
  interaction_source: src/loop_engine/data/component_interactions.yaml
  folder_source: src/loop_engine/data/component_folder_map.yaml
  runtime_type: Loop
  active_loopnode_allowed: false
semantic_decision_rules:
  parameterize:
    when: Values, roles, modes, profiles, procedures, budgets, or preferences vary while invariants and
      lifecycle remain the same.
    action: Use one base type with immutable typed parameters or a versioned profile.
  compose:
    when: Algorithms or providers vary behind the same contract and authority boundary.
    action: Register a strategy, port, or adapter and compose it into the owning runtime.
  separate_class:
    when: State invariants, lifecycle, protocol, persistence authority, or effect boundary materially
      differ.
    action: Create a separately named class with one semantic category and explicit contract.
  separate_function:
    when: The operation is stateless, deterministic, and needs no independent lifecycle.
    action: Use a typed function accepting at most three direct parameters.
  separate_loop:
    when: Work needs independent goal, authority, budget, scheduling, retry, verification, cancellation,
      or Run History identity.
    action: Create another Loop instance using a profile; never create another runtime subclass.
  inherit:
    when: The subtype is fully substitutable, preserves base invariants, and the extension cannot be expressed
      safely through composition.
    action: Record the justification and conformance test; runtime inheritance from Loop is forbidden.
  retain_typed_data_class:
    when: A passive type carries a cohesive stable contract, invariant, injectable configuration, or independently
      meaningful semantic dimension.
    action: Keep and version the typed class; consolidation must not collapse distinct data into strings
      or generic dictionaries.
semantic_terms:
- term_id: core.term.node
  canonical_name: Node
  primary_category: ontology_category
  definition: Abstract category containing the sole executable kind, Loop.
  source_of_truth: terminology.yaml#terms.Node
  source_symbol: null
  public_or_internal: public
  runtime_or_passive: passive
  authoritative_or_projection: authoritative
  versioning: versioned at its source contract
  related_terms: &id001 []
  difference_from_neighbors: Node is a ontology_category; neighboring categories retain separate authority.
  parameterization_decision: not_applicable
  composition_decision: compose through typed contracts, profiles, strategies, and adapters; never create
    another runtime
  inheritance_decision: no_concrete_base_class
  storage_authority: none
  lifecycle: versioned passive contract
  legacy_aliases: *id001
  migration: none
  examples:
  - Node
  negative_examples: *id001
  conformance_rules:
  - one_term_one_meaning
  - one_source_of_truth
  - no_authority_from_alias
- term_id: core.term.parameter_input
  canonical_name: ParameterInput
  primary_category: contract
  definition: Tagged invocation value that distinguishes omission, explicit null, empty values, false, zero, and an ordinary value.
  source_of_truth: loop_engine.core.parameter_resolution:ParameterInput
  source_symbol: loop_engine.core.parameter_resolution:ParameterInput
  public_or_internal: public
  runtime_or_passive: passive
  authoritative_or_projection: authoritative
  versioning: parameter_definition/v1
  related_terms:
  - ParameterDefinition
  - ResolvedParameter
  difference_from_neighbors: ParameterInput carries one requested state; RuntimeSettings owns settings and ResolvedParameter records the selected value.
  parameterization_decision: tagged_value_state
  composition_decision: consumed by the existing RuntimeSettings and Loop configuration boundary
  inheritance_decision: none
  storage_authority: none
  lifecycle: invocation scoped
  legacy_aliases: []
  migration: raw empty and null override sentinels remain compatibility input until callers adopt tagged values
  examples:
  - explicit null max depth
  - explicit zero confidence threshold
  negative_examples:
  - raw None used simultaneously for clear, disable, inherit, and omit
  conformance_rules:
  - one_term_one_meaning
  - one_source_of_truth
  - no_authority_from_alias
- term_id: core.term.parameter_definition
  canonical_name: ParameterDefinition
  primary_category: contract
  definition: Versioned semantic owner, type, scope, constraints, default policy, sensitivity, and qualification impact for one material parameter.
  source_of_truth: loop_engine.core.parameter_resolution:ParameterDefinition
  source_symbol: loop_engine.core.parameter_resolution:ParameterDefinition
  public_or_internal: public
  runtime_or_passive: passive
  authoritative_or_projection: authoritative
  versioning: parameter_definition/v1
  related_terms:
  - ParameterInput
  - ResolvedParameter
  difference_from_neighbors: A parameter definition declares meaning and validation; it does not load deployment settings or infer a value.
  parameterization_decision: typed_parameter_contract
  composition_decision: resolved from exact sources by the deterministic resolver
  inheritance_decision: none
  storage_authority: none
  lifecycle: versioned passive contract
  legacy_aliases: []
  migration: none
  examples:
  - loop.config.max_depth
  negative_examples:
  - an undocumented key in a generic settings dictionary
  conformance_rules:
  - one_term_one_meaning
  - one_source_of_truth
  - no_authority_from_alias
- term_id: core.term.resolved_parameter
  canonical_name: ResolvedParameter
  primary_category: record
  definition: Safe resolved value evidence containing source, version, precedence, validation, state, digest, and every source considered.
  source_of_truth: loop_engine.core.parameter_resolution:ResolvedParameter
  source_symbol: loop_engine.core.parameter_resolution:ResolvedParameter
  public_or_internal: public
  runtime_or_passive: passive
  authoritative_or_projection: evidence
  versioning: resolved_parameter/v1
  related_terms:
  - ParameterDefinition
  - ParameterInput
  difference_from_neighbors: ResolvedParameter records a decision; RuntimeSettings and policies remain the authorities that supplied candidates.
  parameterization_decision: exact_resolution_trace
  composition_decision: grouped into LoopConfigResolutionRecord for one Loop configuration
  inheritance_decision: none
  storage_authority: Run History or the owning execution record
  lifecycle: immutable per resolution
  legacy_aliases: []
  migration: none
  examples:
  - profile value selected after explicit omission
  negative_examples:
  - a scalar with no source or fallback explanation
  conformance_rules:
  - one_term_one_meaning
  - one_source_of_truth
  - no_authority_from_alias
- term_id: core.term.prompt_resource_bundle
  canonical_name: PromptResourceBundle
  primary_category: artifact
  definition: Versioned prompt semantics with typed slots, trust classes, composition order, policy identities, and exact content digests.
  source_of_truth: loop_engine.strings.prompt_fragments:PromptResourceBundle
  source_symbol: loop_engine.strings.prompt_fragments:PromptResourceBundle
  public_or_internal: public
  runtime_or_passive: passive
  authoritative_or_projection: authoritative
  versioning: semantic version plus exact bundle digest
  related_terms:
  - PromptSlotDefinition
  difference_from_neighbors: A prompt bundle is passive semantic material; model invocation still runs through a Loop and the ModelGateway.
  parameterization_decision: typed_slots_and_fixed_composition
  composition_decision: rendered deterministically before the existing model invocation boundary
  inheritance_decision: none
  storage_authority: Context Intelligence or the owning versioned source resource
  lifecycle: versioned and requalified after material changes
  legacy_aliases: []
  migration: inline campaign prompt now renders from campaign.problem.solve
  examples:
  - campaign.problem.solve@1.0.0
  negative_examples:
  - an f-string that mixes trusted contract text with untrusted task data
  conformance_rules:
  - one_term_one_meaning
  - one_source_of_truth
  - no_authority_from_alias
- term_id: core.term.prompt_slot_definition
  canonical_name: PromptSlotDefinition
  primary_category: contract
  definition: Typed prompt input slot with sensitivity, trust class, escaping, size, omission, and provenance policy.
  source_of_truth: loop_engine.strings.prompt_fragments:PromptSlotDefinition
  source_symbol: loop_engine.strings.prompt_fragments:PromptSlotDefinition
  public_or_internal: public
  runtime_or_passive: passive
  authoritative_or_projection: authoritative
  versioning: bound into the prompt bundle slot schema digest
  related_terms:
  - PromptResourceBundle
  difference_from_neighbors: A prompt slot constrains one input; it does not select a model, grant authority, or validate the model output.
  parameterization_decision: typed_prompt_input
  composition_decision: owned by one PromptResourceBundle component
  inheritance_decision: none
  storage_authority: prompt resource bundle
  lifecycle: versioned passive contract
  legacy_aliases: []
  migration: none
  examples:
  - untrusted_data goal with a character limit and provenance
  negative_examples:
  - opaque string interpolation
  conformance_rules:
  - one_term_one_meaning
  - one_source_of_truth
  - no_authority_from_alias

- term_id: core.term.capability_need
  canonical_name: CapabilityNeed
  primary_category: request
  definition: Typed subtask goal, contracts, effects, environment, privacy scope, and search fields used to find reusable capabilities.
  source_of_truth: loop_engine.core.reusable_capability_records:CapabilityNeed
  source_symbol: loop_engine.core.reusable_capability_records:CapabilityNeed
  public_or_internal: public
  runtime_or_passive: passive
  authoritative_or_projection: authoritative
  versioning: capability_need/v1
  related_terms:
  - ReusableCapability
  difference_from_neighbors: CapabilityNeed describes one subtask for resolution; it is not the original user request or an executable Loop.
  parameterization_decision: typed_subtask_resolution_fields
  composition_decision: consumed by CapabilityResolver inside an Intelligence Loop
  inheritance_decision: none
  storage_authority: Run History when persisted
  lifecycle: invocation scoped
  legacy_aliases: []
  migration: none
  examples:
  - a record deduplication need with exact input and output contract digests
  negative_examples:
  - free form task text with no contract
  conformance_rules:
  - one_term_one_meaning
  - one_source_of_truth
  - no_authority_from_alias
- term_id: core.term.reuse_opportunity_observed
  canonical_name: ReuseOpportunityObserved
  primary_category: event
  definition: Reference-only observation that accepted verified work produced an artifact that may be reusable.
  source_of_truth: loop_engine.core.reusable_capability_records:ReuseOpportunityObserved
  source_symbol: loop_engine.core.reusable_capability_records:ReuseOpportunityObserved
  public_or_internal: public
  runtime_or_passive: passive
  authoritative_or_projection: projection
  versioning: reuse_opportunity_observed/v1
  related_terms:
  - ReuseAssessment
  difference_from_neighbors: A reuse opportunity starts review; it is not a candidate, qualification, promotion, or active capability.
  parameterization_decision: exact_source_result_and_artifact_references
  composition_decision: admitted to the reactive harvest series or the identical inline path
  inheritance_decision: none
  storage_authority: Run History and reactive input materialization
  lifecycle: observed
  legacy_aliases: []
  migration: none
  examples:
  - one verified generated Python project reference
  negative_examples:
  - an unverified model recommendation
  conformance_rules:
  - one_term_one_meaning
