      constraints, examples and output contracts. The layer key is
      context_intelligence and its public slug is context.
    may_appear:
    - public_website_pages
    - website_application_views
    - website_documentation_view
    - technical_documents
    - source_code
    must_not_appear: []
    status: current
  Code Intelligence:
    kind: public_layer_name
    definition: >-
      The second persistent intelligence layer: reusable functions, tools,
      packages and workflows with declared inputs, outputs and effects. The
      layer key is code_intelligence and its public slug is code.
    may_appear:
    - public_website_pages
    - website_application_views
    - website_documentation_view
    - technical_documents
    - source_code
    must_not_appear: []
    status: current
  Runtime History and Solution Intelligence:
    kind: public_layer_name
